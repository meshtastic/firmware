name: Update protobufs and regenerate classes
on:
  workflow_dispatch:
    inputs:
      protobufs_branch:
        description: Branch of meshtastic/protobufs to generate from
        required: true
        type: choice
        default: same-as-this-branch
        options:
          - same-as-this-branch
          - master
          - develop
      nanopb_dl_src:
        description: Download source for nanopb
        required: false
        type: choice
        # 'jpa.kapsi.fi' is the original nanopb download source
        # default to GitHub for better availability
        default: github
        options:
          - jpa.kapsi.fi
          - github

permissions: read-all

jobs:
  update-protobufs:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: Resolve protobufs branch
        id: resolve
        env:
          INPUT_BRANCH: ${{ inputs.protobufs_branch }}
          TRIGGER_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$INPUT_BRANCH" = "same-as-this-branch" ]; then
            BRANCH="$TRIGGER_BRANCH"
          else
            BRANCH="$INPUT_BRANCH"
          fi
          case "$BRANCH" in
            master | develop) ;;
            *)
              echo "::error::Refusing to generate from branch '$BRANCH'"
              exit 1
              ;;
          esac
          echo "branch=$BRANCH" >>"$GITHUB_OUTPUT"

      - name: Update submodule
        working-directory: protobufs
        env:
          GIT_BRANCH: ${{ steps.resolve.outputs.branch }}
        run: |
          set -euo pipefail
          git fetch --prune origin "+refs/heads/${GIT_BRANCH}:refs/remotes/origin/${GIT_BRANCH}"
          git checkout --detach "refs/remotes/origin/${GIT_BRANCH}"
          git rev-parse HEAD

      - name: Download nanopb
        env:
          NANOPB_DL_SRC: ${{ inputs.nanopb_dl_src }}
          NANOPB_VERSION: 0.4.9.3
          NANOPB_SHA256: 2f5271feae60f0445ff92a3b7ffe8812114329af9b4bd1ca02fde4510a1217f0
        run: |
          set -euo pipefail
          TARBALL="nanopb-${NANOPB_VERSION}-linux-x86.tar.gz"
          case "$NANOPB_DL_SRC" in
            jpa.kapsi.fi) wget -q "https://jpa.kapsi.fi/nanopb/download/${TARBALL}" ;;
            github) wget -q "https://github.com/nanopb/nanopb/releases/download/nanopb-${NANOPB_VERSION}/${TARBALL}" ;;
            *)
              echo "::error::Unknown nanopb_dl_src '$NANOPB_DL_SRC'"
              exit 1
              ;;
          esac
          echo "${NANOPB_SHA256}  ${TARBALL}" | sha256sum -c -
          tar xzf "${TARBALL}"
          mv "nanopb-${NANOPB_VERSION}-linux-x86" nanopb-0.4.9

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: protobufs/tools/protoc-gen-fieldmeta/go.mod
          cache: false

      - name: Re-generate protocol buffers
        run: |
          ./bin/regen-protos.sh

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: create-pull-request/update-protobufs-${{ github.ref_name }}-from-${{ steps.resolve.outputs.branch }}
          labels: submodules
          title: Update protobufs and classes
          commit-message: Update protobufs
          add-paths: |
            protobufs
            src/mesh
