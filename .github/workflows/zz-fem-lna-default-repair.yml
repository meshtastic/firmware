name: Isolate FEM LNA default change

on:
  push:
    branches: [fem-lna-default-off]
    paths: [.github/workflows/zz-fem-lna-default-repair.yml]

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'Quency-D/firmware' && github.ref == 'refs/heads/fem-lna-default-off'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - name: Restore upstream file and apply exactly one default change
        shell: bash
        run: |
          set -euo pipefail
          BASE=332b5b0a2c4fec2896de3c5fa63f46d5cd05ea98
          git fetch --no-tags --depth=1 origin "$BASE"
          python3 - <<'PY'
          import hashlib
          import pathlib
          import subprocess

          base = '332b5b0a2c4fec2896de3c5fa63f46d5cd05ea98'
          path = 'src/mesh/NodeDB.cpp'
          original = subprocess.check_output(['git', 'show', f'{base}:{path}'])
          digest = hashlib.sha1(b'blob ' + str(len(original)).encode() + b'\0' + original).hexdigest()
          if digest != 'e63e90abf3ee873e3b980a2dc6f84bb11fe027c7':
              raise SystemExit('Unexpected upstream blob; refusing to modify the branch')
          old = b'config.lora.fem_lna_mode = meshtastic_Config_LoRaConfig_FEM_LNA_Mode_ENABLED;'
          new = b'config.lora.fem_lna_mode = meshtastic_Config_LoRaConfig_FEM_LNA_Mode_DISABLED;'
          if original.count(old) != 1:
              raise SystemExit('Expected exactly one FEM LNA default assignment')
          updated = original.replace(old, new, 1)
          pathlib.Path(path).write_bytes(updated)
          diffstat = subprocess.check_output(['git', 'diff', '--numstat', base, '--', path], text=True).strip()
          if diffstat != f'1\t1\t{path}':
              raise SystemExit(f'Unexpected diff: {diffstat!r}')
          print('Verified: exactly one line replaced in NodeDB.cpp')
          subprocess.run(['git', 'diff', '--check', base, '--', path], check=True)
          subprocess.run(['git', 'diff', base, '--', path], check=True)
          PY
      - name: Remove temporary workflow and commit verified result
        shell: bash
        run: |
          set -euo pipefail
          git add -- src/mesh/NodeDB.cpp
          git rm -- .github/workflows/zz-fem-lna-default-repair.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Isolate FEM LNA default-off setting and remove temporary verifier'
          git push origin HEAD:refs/heads/fem-lna-default-off
