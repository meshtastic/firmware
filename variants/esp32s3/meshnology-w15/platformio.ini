[env:meshnology_w15]
custom_meshtastic_hw_model = 153
custom_meshtastic_hw_model_slug = MESHNOLOGY_W15
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Meshnology W15
custom_meshtastic_tags = Meshnology
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 8MB
custom_meshtastic_url = https://wiki.meshnology.com/W15/W15_ESP32-S3_LR2021_DEV_KIT/

extends = esp32s3_base
; This board profile supplies the USB Serial/JTAG flags during the ESP-IDF build stage.
board = esp32-s3-devkitc-1
board_level = release
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
build_flags =
  ${esp32s3_base.build_flags}
  -D MESHNOLOGY_W15
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D BOARD_HAS_PSRAM
  -I variants/esp32s3/meshnology-w15
