[t5s3_epaper_base]
extends = esp32s3_base
board = t5-epaper-s3
board_build.partitions = default_16MB.csv
upload_protocol = esptool
custom_meshtastic_hw_model = 123
custom_meshtastic_hw_model_slug = T5_S3_EPAPER_PRO
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_images = t5s3_epaper.svg
custom_meshtastic_tags = LilyGo
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 16MB
build_flags = -fno-strict-aliasing
  ${esp32s3_base.build_flags} 
  -I variants/esp32s3/t5s3_epaper
  -D T5_S3_EPAPER_PRO
  -D USE_EINK
  -D USE_EINK_PARALLELDISPLAY
  -D TOUCH_THRESHOLD_X=40
  -D TOUCH_THRESHOLD_Y=40
  -D TIME_LONG_PRESS=500
;  -D EINK_LIMIT_GHOSTING_PX=5000
  -D EPD_FULLSLOW_PERIOD=100
  -D FAST_EPD_PARTIAL_UPDATE_BUG ; use rect area update instead of partial

build_src_filter = 
  ${esp32s3_base.build_src_filter}
  +<../variants/esp32s3/t5s3_epaper>
lib_deps =
  ${esp32s3_base.lib_deps}
  # renovate: datasource=custom.pio depName=SensorLib packageName=lewisxhe/library/SensorLib
  lewisxhe/SensorLib@0.4.1
  # renovate: datasource=git-refs depName=meshtastic-PCF8xRTC packageName=https://github.com/meshtastic/PCF8xRTC gitBranch=main
  https://github.com/meshtastic/PCF8xRTC/archive/efe1d9c92f79d8413f8ac4e9bdce0c48410600de.zip
  https://github.com/mverch67/BQ27220/archive/07d92be846abd8a0258a50c23198dac0858b22ed.zip
  https://github.com/mverch67/FastEPD/archive/0df1bff329b6fc782e062f611758880762340647.zip

; This board's 3.3V octal (AP_3v3) 8MB PSRAM is unreliable at the qio_opi default 80MHz
; (Total PSRAM reads 0); 40MHz makes it enumerate. Forces a from-source build as no
; precompiled 40MHz-octal libs exist; bandwidth is immaterial for an e-paper node.
custom_sdkconfig =
  ${esp32s3_base.custom_sdkconfig}
  CONFIG_SPIRAM_SPEED_40M=y
  CONFIG_SPIRAM_SPEED=40

[env:t5s3_epaper_inkhud]
extends = t5s3_epaper_base, inkhud
board_level = release
custom_meshtastic_display_name = LilyGo T5 E-paper S3 Pro V2 InkHUD
custom_meshtastic_key = t5s3_epaper_inkhud
custom_meshtastic_variant = H752-01 (V2) InkHUD
custom_meshtastic_has_ink_hud = true
build_flags =
  ${t5s3_epaper_base.build_flags}
  ${inkhud.build_flags}
  -D MESHTASTIC_INCLUDE_INKHUD_BOOKREADER
  -D INKHUD_BOOKREADER_GRAYSCALE=1
  -D SDCARD_USE_SPI1
  -D INKHUD_BOOKREADER_ENABLE_INLINE_IMAGES=1
  ; Board-specific resource limits; other reader variants can set their own.
  -D INKHUD_BOOKREADER_MAX_FILE_BYTES=196608U
  -D INKHUD_BOOKREADER_MAX_HTML_FILE_BYTES=524288U
  -D INKHUD_BOOKREADER_MAX_OPF_PARSE_BYTES=131072U
  -D INKHUD_BOOKREADER_MAX_TOC_PARSE_BYTES=131072U
  -D INKHUD_BOOKREADER_CSS_MAX_INLINE_TOTAL_BYTES=49152U
  -D INKHUD_BOOKREADER_CSS_MAX_EXTERNAL_FILE_BYTES=32768U
  -D INKHUD_BOOKREADER_CSS_MAX_EXTERNAL_TOTAL_BYTES=65536U
  -D INKHUD_BOOKREADER_CSS_MAX_SOURCE_TEXT_BYTES=98304U
  -D INKHUD_BOOKREADER_PREFETCH_MAX_FILE_BYTES=65536U
  -D INKHUD_BOOKREADER_PREFETCH_MAX_TEXT_BYTES=98304U
  -D INKHUD_BOOKREADER_MAX_EPUB_CENTRAL_DIR_BYTES=524288U
  -D INKHUD_BOOKREADER_MAX_EPUB_UNCOMPRESSED_ENTRY_BYTES=2097152U
  -D INKHUD_BOOKREADER_MAX_EPUB_INLINE_IMAGE_BYTES=2097152U
  -D INKHUD_BOOKREADER_INITIAL_PARTIAL_BYTES=16384U
  -D INKHUD_BOOKREADER_USE_JPEGDEC=1
  -D T5_S3_EPAPER_PRO_V2
build_src_filter =
  ${t5s3_epaper_base.build_src_filter}
  ${inkhud.build_src_filter}
lib_deps =
  ${inkhud.lib_deps} ; InkHUD libs first, so we get GFXRoot instead of AdafruitGFX
  ${t5s3_epaper_base.lib_deps}
  # EPUB inline image rendering for Book Reader (scoped to this env only)
  https://github.com/bitbank2/JPEGDEC/archive/refs/tags/1.8.4.zip
  https://github.com/bitbank2/PNGdec/archive/refs/tags/1.1.6.zip


[env:t5s3-epaper-v1] ; H752
extends = t5s3_epaper_base
board_level = release
custom_meshtastic_display_name = LilyGo T5 E-paper S3 Pro V1
custom_meshtastic_key = t5s3-epaper-v1
custom_meshtastic_variant = H752 (V1)
build_flags =
  ${t5s3_epaper_base.build_flags}
  -D T5_S3_EPAPER_PRO_V1
  -D GPS_DEFAULT_NOT_PRESENT=1

[env:t5s3-epaper-v2] ; H752-01
extends = t5s3_epaper_base
board_level = release
custom_meshtastic_display_name = LilyGo T5 E-paper S3 Pro V2
custom_meshtastic_key = t5s3-epaper-v2
custom_meshtastic_variant = H752-01 (V2)
build_flags =
  ${t5s3_epaper_base.build_flags}
  -D T5_S3_EPAPER_PRO_V2
  -D SDCARD_USE_SPI1
  -D GPS_POWER_TOGGLE
