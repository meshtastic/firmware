; DMShell loss bench r148: both ends on boards, no CH341. The T-Beam is the server: a synthetic shell answers the
; test client's commands. Every node waits for a PPS clock hold (120 s of edges), then logs µs radio edges and raw
; PPS edges. Set R148_PEER to the server's node number (0x...) before building the clients. Not built by CI.

[env:tbeam-s3-core-r148-server]
extends = env:tbeam-s3-core
board_level = extra
build_flags = ${env:tbeam-s3-core.build_flags}
  -DDMSHELL_SYNTHETIC_SHELL=1
  -DPPS_BENCH_HOLD_SECS=120
  -DPPS_ALLOW_2D_FIX=1
  -DRADIO_EDGE_LOG=1

[env:thinknode_m9-r148]
extends = env:thinknode_m9
board_level = extra
build_flags = ${env:thinknode_m9.build_flags}
  -DDMSHELL_TEST_PEER=${sysenv.R148_PEER}
  -DDMSHELL_TEST_UNTIL_DONE=1
  -DDMSHELL_TEST_WAIT_PPS=1
  -DPPS_BENCH_HOLD_SECS=120
  -DPPS_ALLOW_2D_FIX=1
  -DRADIO_EDGE_LOG=1
