; DMShell loss bench r148: both ends on boards, no CH341. The T-Beam is the server: a synthetic shell answers the
; test client's commands. Every node waits for a PPS clock hold (120 s of edges), then logs µs radio edges and raw
; PPS edges. Set R148_PEER to the server's node number (0x...) before building the clients. Not built by CI.

[env:tbeam-s3-core-r148-server]
extends = env:tbeam-s3-core
board_level = extra
build_flags = ${env:tbeam-s3-core.build_flags}
  -DDMSHELL_SYNTHETIC_SHELL=1
  -DPPS_BENCH_HOLD_SECS=120
  -DPPS_ALLOW_2D_FIX=1
  -DRADIO_EDGE_LOG=1

[env:thinknode_m9-r148]
extends = env:thinknode_m9
board_level = extra
build_flags = ${env:thinknode_m9.build_flags}
  -DDMSHELL_TEST_PEER=${sysenv.R148_PEER}
  -DDMSHELL_TEST_UNTIL_DONE=1
  -DDMSHELL_TEST_WAIT_PPS=1
  -DPPS_BENCH_HOLD_SECS=120
  -DPPS_ALLOW_2D_FIX=1
  -DRADIO_EDGE_LOG=1

; Diagnostics for the server's 12.4 ms scan-to-air (one session each; compare the four RadioEdge pieces).
; -logafter: the "CAD free" log moves after the TX launch. -noparanoid: RadioLib skips its per-command status checks.
[env:tbeam-s3-core-r148-server-logafter]
extends = env:tbeam-s3-core-r148-server
build_flags = ${env:tbeam-s3-core-r148-server.build_flags}
  -DRADIO_LOG_CAD_FREE_AFTER_TX=1

[env:tbeam-s3-core-r148-server-noparanoid]
extends = env:tbeam-s3-core-r148-server
build_flags = ${env:tbeam-s3-core-r148-server.build_flags}
  -DRADIOLIB_SPI_PARANOID=0

[env:tbeam-s3-core-r148-server-both]
extends = env:tbeam-s3-core-r148-server
build_flags = ${env:tbeam-s3-core-r148-server.build_flags}
  -DRADIO_LOG_CAD_FREE_AFTER_TX=1
  -DRADIOLIB_SPI_PARANOID=0

; r148b: the M9 with RadioLib's per-command SPI status checks off, against thinknode_m9-r148.
[env:thinknode_m9-r148-noparanoid]
extends = env:thinknode_m9-r148
build_flags = ${env:thinknode_m9-r148.build_flags}
  -DRADIOLIB_SPI_PARANOID=0

; r148d: hold TX while a busy scan's handoff RX is open (RADIO_CAD_HANDOFF_HOLDS_TX), against the plain envs.
[env:tbeam-s3-core-r148-server-hold]
extends = env:tbeam-s3-core-r148-server
build_flags = ${env:tbeam-s3-core-r148-server.build_flags}
  -DRADIO_CAD_HANDOFF_HOLDS_TX=1

[env:thinknode_m9-r148-hold]
extends = env:thinknode_m9-r148
build_flags = ${env:thinknode_m9-r148.build_flags}
  -DRADIO_CAD_HANDOFF_HOLDS_TX=1

; r148d arm R: re-read the RX flags just before the pre-TX scan's standby; "CAD arm" logs after the scan.
[env:tbeam-s3-core-r148-server-recheck]
extends = env:tbeam-s3-core-r148-server
build_flags = ${env:tbeam-s3-core-r148-server.build_flags}
  -DRADIO_PREAMBLE_RECHECK=1

[env:thinknode_m9-r148-recheck]
extends = env:thinknode_m9-r148
build_flags = ${env:thinknode_m9-r148.build_flags}
  -DRADIO_PREAMBLE_RECHECK=1

; r148e: time every radio command from the pre-TX scan to the transmit call ("RadioEdge: tx_seq" lines).
[env:tbeam-s3-core-r148e-server]
extends = env:tbeam-s3-core-r148-server
build_flags = ${env:tbeam-s3-core-r148-server.build_flags}
  -DRADIO_EDGE_SEQ=1

[env:thinknode_m9-r148e]
extends = env:thinknode_m9-r148
build_flags = ${env:thinknode_m9-r148.build_flags}
  -DRADIO_EDGE_SEQ=1
