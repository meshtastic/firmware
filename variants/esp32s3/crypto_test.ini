; Crypto tests on hardware: pio test -e crypto-esp32s3 -f test_crypto_vectors
; Serial is the USB-Serial-JTAG port; it may re-enumerate after an upload.
[env:crypto-esp32s3]
extends = esp32s3_base
board = esp32-s3-devkitc-1
board_level = extra
build_flags =
  ${esp32s3_base.build_flags}
  -D HELTEC_V3
  -I variants/esp32s3/heltec_v3
  -D CRYPTO_TEST_MINIMAL
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
build_src_filter =
  -<*>
  +<crypto/>
  +<mesh/HardwareRNG.cpp>
  +<meshUtils.cpp>
  +<mesh/CryptoEngine.cpp>
  +<concurrency/Lock.cpp>
  +<concurrency/LockGuard.cpp>
lib_ignore =
  ${esp32s3_base.lib_ignore}
  ESP32 Codec2
test_filter =
  test_crypto_vectors

; Backend suite only: no CryptoEngine.
[env:crypto-esp32s3-backend]
extends = env:crypto-esp32s3
build_src_filter =
  -<*>
  +<crypto/>
  +<mesh/HardwareRNG.cpp>
  +<concurrency/Lock.cpp>
  +<concurrency/LockGuard.cpp>
test_filter =
  test_crypto_backend
