; DMShell loss bench r116, arm P: #12125 (preamble hold sized for CR 4/8, CAD may settle an old bare preamble), nothing else added. See variants/nrf52840/r116.ini. Not built by CI.

[env:tbeam-s3-core-r116-p]
extends = env:tbeam-s3-core
board_level = extra
build_flags = ${env:tbeam-s3-core.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2

[env:tbeam-s3-core-r116-pt]
extends = env:tbeam-s3-core
board_level = extra
build_flags = ${env:tbeam-s3-core.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DMESHTASTIC_TRACE_LOGGING=1
