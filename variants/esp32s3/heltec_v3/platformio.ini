[env:heltec-v3]
custom_meshtastic_hw_model = 43
custom_meshtastic_hw_model_slug = HELTEC_V3
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Heltec V3
custom_meshtastic_images = heltec-v3.svg, heltec-v3-case.svg
custom_meshtastic_tags = Heltec
custom_meshtastic_partition_scheme = 8MB
 
extends = esp32s3_base
board = heltec_wifi_lora_32_V3
board_level = pr
board_build.partitions = default_8MB.csv
build_flags = 
  ${esp32s3_base.build_flags}
  -D HELTEC_V3
  -I variants/esp32s3/heltec_v3

; The BLE-mesh opt-in build for heltec-v3. It carries the GATT mesh-peer transport, a second
; peripheral link beside the phone's; network.enabled_protocols turns it on at runtime. The host
; and controller are rebuilt for it: two connections, and three controller activities (the
; advertisement and both links). Last key wins, so these follow the inherited values.
[env:heltec-v3_blemesh]
extends = env:heltec-v3
build_flags = ${env:heltec-v3.build_flags}
  -DHAS_BLE_GATT_MESH=1
  -DBLE_GATT_MESH_ESP32_LINKS=2
custom_sdkconfig =
  ${esp32s3_base.custom_sdkconfig}
  CONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
  CONFIG_BT_CTRL_BLE_MAX_ACT=3
