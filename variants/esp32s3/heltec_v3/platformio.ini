[env:heltec-v3]
custom_meshtastic_hw_model = 43
custom_meshtastic_hw_model_slug = HELTEC_V3
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Heltec V3
custom_meshtastic_images = heltec-v3.svg, heltec-v3-case.svg
custom_meshtastic_tags = Heltec
custom_meshtastic_partition_scheme = 8MB
 
extends = esp32s3_base
board = heltec_wifi_lora_32_V3
board_level = pr
board_build.partitions = default_8MB.csv
build_flags = 
  ${esp32s3_base.build_flags}
  -D HELTEC_V3
  -I variants/esp32s3/heltec_v3

; The BLE-mesh opt-in build for heltec-v3. It carries both bearers, the advertisement mesh and the
; GATT mesh-peer transport; network.enabled_protocols turns each on at runtime. An opt-in env
; rather than a flag on heltec-v3, because turning the transport on is not free: it rebuilds
; NimBLE with ext-adv, the observer role and a larger activity budget, and BLE_MESH_USE_EXT_ADV
; replaces NimbleBluetooth::startAdvertising() outright - so the phone advertisement on this build
; is not the one every other S3 board ships. That has to be a board somebody chose.
; Two connections, and six controller activities (two advertising sets, the scan, both links, one
; spare). Last key wins, so these follow ble_mesh_esp32's values.
[env:heltec-v3_blemesh]
extends = env:heltec-v3
build_flags =
  ${env:heltec-v3.build_flags}
  ${ble_mesh_esp32.build_flags}
  -DHAS_BLE_GATT_MESH=1
  -DBLE_GATT_MESH_ESP32_LINKS=2
custom_sdkconfig =
  ${esp32s3_base.custom_sdkconfig}
  ${ble_mesh_esp32.custom_sdkconfig}
  CONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
  CONFIG_BT_CTRL_BLE_MAX_ACT=6
