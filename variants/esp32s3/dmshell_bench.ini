; DMShell loss bench, comparison arm: the T-Beam Supreme with the on-board test client, under the same env name as
; claude/dmshell-shared. [dmshell_bench] is in variants/nrf52840/dmshell_bench.ini. Not built by CI.
[env:tbeam-s3-core-dmshell-bench]
extends = env:tbeam-s3-core
board_level = extra
build_flags = ${env:tbeam-s3-core.build_flags}
  ${dmshell_bench.build_flags}
