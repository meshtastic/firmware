; DMShell loss bench: the T-Beam Supreme's live configuration. [dmshell_bench] is in variants/nrf52840/dmshell_bench.ini.
; Its SX1262 is wired like the RAK4631's, so it takes the RAK's measured flags. Off nRF52 the TX_DONE re-arm runs in the
; readout task, with RadioLib calls, as on the LR boards. Not built by CI.
[env:tbeam-s3-core-dmshell-bench]
extends = env:tbeam-s3-core
board_level = extra
build_flags = ${env:tbeam-s3-core.build_flags}
  ${dmshell_bench.build_flags}
  -DSX126X_TCXO_DELAY_US=1000
  -DSX126X_STANDBY_XOSC
  -DSX126X_RESUME_CONTINUOUS_RX
  -DSX126X_RX_REARM_AT_TX_DONE
  ; Logging only: names any thread that holds the main loop 10 ms or more, against the TX timeline's rx>thr.
  -DMESHTASTIC_SLOW_THREAD_MS=10

; The same image without the TX_DONE re-arm, for a same-session A/B. A re-armed run logs "Radio back in RX at TX_DONE".
[env:tbeam-s3-core-dmshell-bench-norearm]
extends = env:tbeam-s3-core
board_level = extra
build_flags = ${env:tbeam-s3-core.build_flags}
  ${dmshell_bench.build_flags}
  -DSX126X_TCXO_DELAY_US=1000
  -DSX126X_STANDBY_XOSC
  -DSX126X_RESUME_CONTINUOUS_RX

; Diagnostic only: tbeam-s3-core-dmshell-bench plus a 1 ms chip-state look (GetIrqStatus) from a FreeRTOS task above
; the main loop, logging each change of chip mode or IRQ flags: is the chip in RX when the firmware believes it is?
[env:tbeam-s3-core-dmshell-bench-sampler]
extends = env:tbeam-s3-core-dmshell-bench
board_level = extra
build_flags = ${env:tbeam-s3-core-dmshell-bench.build_flags}
  -DSX126X_STATE_SAMPLER_MS=1
  -DSX126X_STATE_SAMPLER_TASK

; Round 84 arms, against tbeam-s3-core-dmshell-bench (A). After a clear CAD the SX1262 sits deaf in STBY_RC until SET_TX.
; L prints the "CAD free" line after the launch instead of inside that window.
[env:tbeam-s3-core-dmshell-bench-cadlog]
extends = env:tbeam-s3-core-dmshell-bench
board_level = extra
build_flags = ${env:tbeam-s3-core-dmshell-bench.build_flags}
  -DMESHTASTIC_LOG_CAD_FREE_AFTER_TX

; LS: L, plus the payload written while RX still runs, so the launch after the verdict is four commands. When a frame
; is in the buffer it falls back to writing in the scan's standby (SX126X_TX_PRESTAGE).
[env:tbeam-s3-core-dmshell-bench-stage]
extends = env:tbeam-s3-core-dmshell-bench
board_level = extra
build_flags = ${env:tbeam-s3-core-dmshell-bench.build_flags}
  -DMESHTASTIC_LOG_CAD_FREE_AFTER_TX
  -DSX126X_TX_PRESTAGE
  -DSX126X_TX_STAGE_IN_RX

; R: LS, plus the task re-arms RX with the four raw commands the nRF52 interrupt sends, under ONE SPI lock,
; instead of RadioLib's startReceive(). Round 84 measured the task's startReceive() at 1829 us against the
; interrupt's 215 us on the same chip -- about 7 separately-locked transactions against 4 locked once, two of
; them from a standby() the task path's own comment calls unnecessary after TX_DONE.
[env:tbeam-s3-core-dmshell-bench-rawrearm]
extends = env:tbeam-s3-core-dmshell-bench
board_level = extra
build_flags = ${env:tbeam-s3-core-dmshell-bench-stage.build_flags}
  -DSX126X_REARM_RAW_FROM_TASK

; R plus the 1 ms chip-state task, to measure the deaf stretch the raw re-arm leaves
[env:tbeam-s3-core-dmshell-bench-rawrearm-sampler]
extends = env:tbeam-s3-core-dmshell-bench
board_level = extra
build_flags = ${env:tbeam-s3-core-dmshell-bench-rawrearm.build_flags}
  -DSX126X_STATE_SAMPLER_MS=1
  -DSX126X_STATE_SAMPLER_TASK

; Diagnostic: LS with the 1 ms chip-state task, to measure the deaf stretch it leaves
[env:tbeam-s3-core-dmshell-bench-stage-sampler]
extends = env:tbeam-s3-core-dmshell-bench
board_level = extra
build_flags = ${env:tbeam-s3-core-dmshell-bench-stage.build_flags}
  -DSX126X_STATE_SAMPLER_MS=1
  -DSX126X_STATE_SAMPLER_TASK
