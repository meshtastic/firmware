; DMShell loss bench: the T-Beam Supreme's live configuration. [dmshell_bench] is in variants/nrf52840/dmshell_bench.ini.
; Its SX1262 is wired like the RAK4631's, so it takes the RAK's measured flags. Off nRF52 the TX_DONE re-arm runs in the
; readout task, with RadioLib calls, as on the LR boards. Not built by CI.
[env:tbeam-s3-core-dmshell-bench]
extends = env:tbeam-s3-core
board_level = extra
build_flags = ${env:tbeam-s3-core.build_flags}
  ${dmshell_bench.build_flags}
  -DSX126X_TCXO_DELAY_US=1000
  -DSX126X_STANDBY_XOSC
  -DSX126X_RESUME_CONTINUOUS_RX
  -DSX126X_RX_REARM_AT_TX_DONE

; The same image without the TX_DONE re-arm, for a same-session A/B. A re-armed run logs "Radio back in RX at TX_DONE".
[env:tbeam-s3-core-dmshell-bench-norearm]
extends = env:tbeam-s3-core
board_level = extra
build_flags = ${env:tbeam-s3-core.build_flags}
  ${dmshell_bench.build_flags}
  -DSX126X_TCXO_DELAY_US=1000
  -DSX126X_STANDBY_XOSC
  -DSX126X_RESUME_CONTINUOUS_RX
