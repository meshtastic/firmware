; DMShell loss bench: the T-Beam Supreme's live configuration. [dmshell_bench] is in variants/nrf52840/dmshell_bench.ini.
; Its SX1262 is wired like the RAK4631's, so it takes the RAK's measured flags. Off nRF52 the TX_DONE re-arm runs in the
; readout task, with RadioLib calls, as on the LR boards. Not built by CI.
[env:tbeam-s3-core-dmshell-bench]
extends = env:tbeam-s3-core
board_level = extra
build_flags = ${env:tbeam-s3-core.build_flags}
  ${dmshell_bench.build_flags}
  -DSX126X_TCXO_DELAY_US=1000
  -DSX126X_STANDBY_XOSC
  -DSX126X_RESUME_CONTINUOUS_RX
  -DSX126X_RX_REARM_AT_TX_DONE
  ; Logging only: names any thread that holds the main loop 10 ms or more, against the TX timeline's rx>thr.
  -DMESHTASTIC_SLOW_THREAD_MS=10

; The same image without the TX_DONE re-arm, for a same-session A/B. A re-armed run logs "Radio back in RX at TX_DONE".
[env:tbeam-s3-core-dmshell-bench-norearm]
extends = env:tbeam-s3-core
board_level = extra
build_flags = ${env:tbeam-s3-core.build_flags}
  ${dmshell_bench.build_flags}
  -DSX126X_TCXO_DELAY_US=1000
  -DSX126X_STANDBY_XOSC
  -DSX126X_RESUME_CONTINUOUS_RX

; Diagnostic only: tbeam-s3-core-dmshell-bench plus a 1 ms chip-state look (GetIrqStatus) from a FreeRTOS task above
; the main loop, logging each change of chip mode or IRQ flags: is the chip in RX when the firmware believes it is?
[env:tbeam-s3-core-dmshell-bench-sampler]
extends = env:tbeam-s3-core-dmshell-bench
board_level = extra
build_flags = ${env:tbeam-s3-core-dmshell-bench.build_flags}
  -DSX126X_STATE_SAMPLER_MS=1
  -DSX126X_STATE_SAMPLER_TASK

; Round 84 arms, against tbeam-s3-core-dmshell-bench (A). After a clear CAD the SX1262 sits deaf in STBY_RC until SET_TX.
; L prints the "CAD free" line after the launch instead of inside that window.
[env:tbeam-s3-core-dmshell-bench-cadlog]
extends = env:tbeam-s3-core-dmshell-bench
board_level = extra
build_flags = ${env:tbeam-s3-core-dmshell-bench.build_flags}
  -DMESHTASTIC_LOG_CAD_FREE_AFTER_TX

; LS: L, plus the payload written while RX still runs, so the launch after the verdict is four commands. When a frame
; is in the buffer it falls back to writing in the scan's standby (SX126X_TX_PRESTAGE).
[env:tbeam-s3-core-dmshell-bench-stage]
extends = env:tbeam-s3-core-dmshell-bench
board_level = extra
build_flags = ${env:tbeam-s3-core-dmshell-bench.build_flags}
  -DMESHTASTIC_LOG_CAD_FREE_AFTER_TX
  -DSX126X_TX_PRESTAGE
  -DSX126X_TX_STAGE_IN_RX

; R: LS, plus the task re-arms RX with the four commands the nRF52 interrupt sends, as RadioLib module calls,
; instead of startReceive()'s seven or so (round 84: 1819 us against the interrupt's 215 us on the same chip).
[env:tbeam-s3-core-dmshell-bench-rawrearm]
extends = env:tbeam-s3-core-dmshell-bench
board_level = extra
build_flags = ${env:tbeam-s3-core-dmshell-bench-stage.build_flags}
  -DSX126X_REARM_RAW_FROM_TASK

; R plus the 1 ms chip-state task, to measure the deaf stretch the short re-arm leaves
[env:tbeam-s3-core-dmshell-bench-rawrearm-sampler]
extends = env:tbeam-s3-core-dmshell-bench
board_level = extra
build_flags = ${env:tbeam-s3-core-dmshell-bench-rawrearm.build_flags}
  -DSX126X_STATE_SAMPLER_MS=1
  -DSX126X_STATE_SAMPLER_TASK

; Diagnostic: LS with the 1 ms chip-state task, to measure the deaf stretch it leaves
[env:tbeam-s3-core-dmshell-bench-stage-sampler]
extends = env:tbeam-s3-core-dmshell-bench
board_level = extra
build_flags = ${env:tbeam-s3-core-dmshell-bench-stage.build_flags}
  -DSX126X_STATE_SAMPLER_MS=1
  -DSX126X_STATE_SAMPLER_TASK

; G: LS, plus the slot parity gate. The backoff fires two slots early and the radio thread waits until a slot of its
; parity has begun at most 1 ms ago, so a main-loop hold can no longer put the scan in the server's slot.
[env:tbeam-s3-core-dmshell-bench-gate]
extends = env:tbeam-s3-core-dmshell-bench
board_level = extra
build_flags = ${env:tbeam-s3-core-dmshell-bench-stage.build_flags}
  -DMESHTASTIC_TX_SLOT_GATE_MS=1

; G as round 86 ran it: a timer firing further ahead than the early window plus two slots scans at once, instead of
; being set again for its slot
[env:tbeam-s3-core-dmshell-bench-gate-norearm]
extends = env:tbeam-s3-core-dmshell-bench
board_level = extra
build_flags = ${env:tbeam-s3-core-dmshell-bench-gate.build_flags}
  -DMESHTASTIC_TX_SLOT_GATE_REARM=0

; T: LS with the radio thread run by its own FreeRTOS task, one above the main loop, so a loop hold can't make the scan
; late. Logs "Radio task started" at boot and "Radio task stack" every minute.
[env:tbeam-s3-core-dmshell-bench-task]
extends = env:tbeam-s3-core-dmshell-bench
board_level = extra
build_flags = ${env:tbeam-s3-core-dmshell-bench-stage.build_flags}
  -DMESHTASTIC_RADIO_TASK

; TG: G in the radio task. The gate's wait now holds only the radio, not the loop.
[env:tbeam-s3-core-dmshell-bench-task-gate]
extends = env:tbeam-s3-core-dmshell-bench
board_level = extra
build_flags = ${env:tbeam-s3-core-dmshell-bench-gate.build_flags}
  -DMESHTASTIC_RADIO_TASK

; TL: TG with measured leads in place of the gate's fixed 16 ms: SET_TX aimed 1 ms into the slot, the scan started the
; measured scan-to-SET_TX time before it, and the timer fired the measured wake latency (plus 1 ms) before the scan.
; Logs a "TX lead" line after each TX.
[env:tbeam-s3-core-dmshell-bench-task-lead]
extends = env:tbeam-s3-core-dmshell-bench
board_level = extra
build_flags = ${env:tbeam-s3-core-dmshell-bench-task-gate.build_flags}
  -DMESHTASTIC_TX_SLOT_LEAD

; TL3: TL with SET_TX aimed 3 ms into the slot, clear of the boundary the lead's sub-ms over-lead reaches at 1 ms
[env:tbeam-s3-core-dmshell-bench-task-lead3]
extends = env:tbeam-s3-core-dmshell-bench
board_level = extra
build_flags = ${env:tbeam-s3-core-dmshell-bench-task-lead.build_flags}
  -DMESHTASTIC_TX_SLOT_SET_TX_AT_MS=3

; TL3D: TL3 with the radio task writing its own log lines to the console, as before 1aa639b3b, to A/B the log queue
[env:tbeam-s3-core-dmshell-bench-task-lead3-logdirect]
extends = env:tbeam-s3-core-dmshell-bench
board_level = extra
build_flags = ${env:tbeam-s3-core-dmshell-bench-task-lead3.build_flags}
  -DMESHTASTIC_RADIO_TASK_LOG_DIRECT

; TL3U: TL3 with a "USB stats 10 s" line: console write times, lock waits, and why log records drop
[env:tbeam-s3-core-dmshell-bench-task-lead3-usbstats]
extends = env:tbeam-s3-core-dmshell-bench
board_level = extra
build_flags = ${env:tbeam-s3-core-dmshell-bench-task-lead3.build_flags}
  -DMESHTASTIC_LOG_USB_STATS

; TL3K: TL3U with a 1 KB HWCDC TX ring in place of the 256 B default
[env:tbeam-s3-core-dmshell-bench-task-lead3-usb1k]
extends = env:tbeam-s3-core-dmshell-bench
board_level = extra
build_flags = ${env:tbeam-s3-core-dmshell-bench-task-lead3-usbstats.build_flags}
  -DMESHTASTIC_HWCDC_TX_BUFFER=1024

; TL3N: TL3U, plus a refused log record re-runs HWCDC's connection check, which re-arms its TX interrupt if the driver has
; marked the host gone. Only HWCDC::write() runs that check, and a refused record never reaches it.
[env:tbeam-s3-core-dmshell-bench-task-lead3-usbnudge]
extends = env:tbeam-s3-core-dmshell-bench
board_level = extra
build_flags = ${env:tbeam-s3-core-dmshell-bench-task-lead3-usbstats.build_flags}
  -DMESHTASTIC_HWCDC_NUDGE

; TL3W: TL3U, plus a log record takes the stream lock only if it is free now, so it is dropped rather than wait behind a
; packet frame's write
[env:tbeam-s3-core-dmshell-bench-task-lead3-lognowait]
extends = env:tbeam-s3-core-dmshell-bench
board_level = extra
build_flags = ${env:tbeam-s3-core-dmshell-bench-task-lead3-usbstats.build_flags}
  -DMESHTASTIC_LOG_NEVER_WAIT

; Round 96: does the loop's 60 s radio upkeep (noise floor, AGC reset) start the console stalls? All four are TL3D (the
; radio task writes its own lines, the build that stalled most) with the USB stats, which now count plain-text output.
; A60: the stock 60 s upkeep
[env:tbeam-s3-core-dmshell-bench-task-lead3-logdirect-usbstats]
extends = env:tbeam-s3-core-dmshell-bench
board_level = extra
build_flags = ${env:tbeam-s3-core-dmshell-bench-task-lead3-logdirect.build_flags}
  -DMESHTASTIC_LOG_USB_STATS

; A30: upkeep every 30 s
[env:tbeam-s3-core-dmshell-bench-task-lead3-logdirect-agc30]
extends = env:tbeam-s3-core-dmshell-bench
board_level = extra
build_flags = ${env:tbeam-s3-core-dmshell-bench-task-lead3-logdirect-usbstats.build_flags}
  -DAGC_RESET_INTERVAL_MS=30000

; A120: upkeep every 120 s
[env:tbeam-s3-core-dmshell-bench-task-lead3-logdirect-agc120]
extends = env:tbeam-s3-core-dmshell-bench
board_level = extra
build_flags = ${env:tbeam-s3-core-dmshell-bench-task-lead3-logdirect-usbstats.build_flags}
  -DAGC_RESET_INTERVAL_MS=120000

; AX: the 60 s upkeep without resetAGC() (noise floor and the rest still run)
[env:tbeam-s3-core-dmshell-bench-task-lead3-logdirect-noagc]
extends = env:tbeam-s3-core-dmshell-bench
board_level = extra
build_flags = ${env:tbeam-s3-core-dmshell-bench-task-lead3-logdirect-usbstats.build_flags}
  -DMESHTASTIC_SKIP_AGC_RESET

; Round 97: is the stall a latched HWCDC TX interrupt, and does a byte written straight into the FIFO clear it? Both are
; A60 with trace logging on for more stalls. T: counts the latch only
[env:tbeam-s3-core-dmshell-bench-task-lead3-logdirect-trace]
extends = env:tbeam-s3-core-dmshell-bench
board_level = extra
build_flags = ${env:tbeam-s3-core-dmshell-bench-task-lead3-logdirect-usbstats.build_flags}
  -DMESHTASTIC_TRACE_LOGGING=1

; K: T, plus the kick
[env:tbeam-s3-core-dmshell-bench-task-lead3-logdirect-kick]
extends = env:tbeam-s3-core-dmshell-bench
board_level = extra
build_flags = ${env:tbeam-s3-core-dmshell-bench-task-lead3-logdirect-trace.build_flags}
  -DMESHTASTIC_HWCDC_KICK

; Round 98: induce the latch once a minute instead of waiting for it. Both are A60 without trace logging. I: induces only
[env:tbeam-s3-core-dmshell-bench-task-lead3-logdirect-induce]
extends = env:tbeam-s3-core-dmshell-bench
board_level = extra
build_flags = ${env:tbeam-s3-core-dmshell-bench-task-lead3-logdirect-usbstats.build_flags}
  -DMESHTASTIC_HWCDC_INDUCE

; IK: I, plus the kick
[env:tbeam-s3-core-dmshell-bench-task-lead3-logdirect-induce-kick]
extends = env:tbeam-s3-core-dmshell-bench
board_level = extra
build_flags = ${env:tbeam-s3-core-dmshell-bench-task-lead3-logdirect-induce.build_flags}
  -DMESHTASTIC_HWCDC_KICK
