; DMShell loss bench, arm R: 2.8.1's radio path plus the on-board test client, under the env names claude/dmshell-final
; uses. DMSHELL_TEST_PEER is the server's node number. Not built by CI.

[env:tbeam-s3-core-dmshell-final]
extends = env:tbeam-s3-core
board_level = extra
build_flags = ${env:tbeam-s3-core.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
