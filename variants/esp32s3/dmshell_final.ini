; DMShell loss bench on claude/dmshell-final. Each board's A env has every fix on; each -noqN env is A with quantum N
; left out, so the pair differs by that quantum alone. DMSHELL_TEST_PEER is the server's node number. Not built by CI.
; T-Beam Supreme (SX1262, ESP32-S3). The TX_DONE re-arm runs from the readout task.

; A: every fix on. The readout task and the TX_DONE re-arm are defaults here; TCXO 1 ms and the SX126x XOSC standby
; now come from develop, so they have no arm
[env:tbeam-s3-core-dmshell-final]
extends = env:tbeam-s3-core
board_level = extra
build_flags = ${env:tbeam-s3-core.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DRADIOLIB_GODMODE=1
  -DMESHTASTIC_BENCH_INSTRUMENTATION=1
  -DDMSHELL_TEST_SLOT_PARITY=1
  -DMESHTASTIC_RX_RETRY_WRONG_MODEM=1
  -DMESHTASTIC_RADIO_TASK
  -DMESHTASTIC_TX_SLOT_GATE_MS=1
  -DMESHTASTIC_TX_SLOT_LEAD
  -DMESHTASTIC_TX_SLOT_SET_TX_AT_MS=3

; Q3 out: readout on the radio thread. The SX126x continuous-RX resume has no switch and stays. The TX_DONE re-arm runs
; from the task here, so Q4 goes too
[env:tbeam-s3-core-dmshell-final-noq3]
extends = env:tbeam-s3-core
board_level = extra
build_flags = ${env:tbeam-s3-core.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DRADIOLIB_GODMODE=1
  -DMESHTASTIC_BENCH_INSTRUMENTATION=1
  -DDMSHELL_TEST_SLOT_PARITY=1
  -DMESHTASTIC_RX_RETRY_WRONG_MODEM=1
  -DMESHTASTIC_RADIO_TASK
  -DMESHTASTIC_TX_SLOT_GATE_MS=1
  -DMESHTASTIC_TX_SLOT_LEAD
  -DMESHTASTIC_TX_SLOT_SET_TX_AT_MS=3
  -DMESHTASTIC_EXCLUDE_READOUT_TASK=1

; Q4 out: no RX re-arm at TX_DONE
[env:tbeam-s3-core-dmshell-final-noq4]
extends = env:tbeam-s3-core
board_level = extra
build_flags = ${env:tbeam-s3-core.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DRADIOLIB_GODMODE=1
  -DMESHTASTIC_BENCH_INSTRUMENTATION=1
  -DDMSHELL_TEST_SLOT_PARITY=1
  -DMESHTASTIC_RX_RETRY_WRONG_MODEM=1
  -DMESHTASTIC_RADIO_TASK
  -DMESHTASTIC_TX_SLOT_GATE_MS=1
  -DMESHTASTIC_TX_SLOT_LEAD
  -DMESHTASTIC_TX_SLOT_SET_TX_AT_MS=3
  -DSX126X_RX_REARM_AT_TX_DONE=0

[env:tbeam-s3-core-dmshell-final-noq10]
extends = env:tbeam-s3-core
board_level = extra
build_flags = ${env:tbeam-s3-core.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DRADIOLIB_GODMODE=1
  -DMESHTASTIC_BENCH_INSTRUMENTATION=1
  -DMESHTASTIC_RX_RETRY_WRONG_MODEM=1
  -DMESHTASTIC_RADIO_TASK
  -DMESHTASTIC_TX_SLOT_GATE_MS=1
  -DMESHTASTIC_TX_SLOT_LEAD
  -DMESHTASTIC_TX_SLOT_SET_TX_AT_MS=3

; Q11 out: no RX hold before a due TX
[env:tbeam-s3-core-dmshell-final-noq11]
extends = env:tbeam-s3-core
board_level = extra
build_flags = ${env:tbeam-s3-core.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DRADIOLIB_GODMODE=1
  -DMESHTASTIC_BENCH_INSTRUMENTATION=1
  -DDMSHELL_TEST_SLOT_PARITY=1
  -DMESHTASTIC_RX_RETRY_WRONG_MODEM=1
  -DMESHTASTIC_RADIO_TASK
  -DMESHTASTIC_TX_SLOT_GATE_MS=1
  -DMESHTASTIC_TX_SLOT_LEAD
  -DMESHTASTIC_TX_SLOT_SET_TX_AT_MS=3
  -DMESHTASTIC_RX_DEFER_FOR_TX_MS=0

; Q12-Q14 out: no radio task, slot gate or measured lead
[env:tbeam-s3-core-dmshell-final-noq12q14]
extends = env:tbeam-s3-core
board_level = extra
build_flags = ${env:tbeam-s3-core.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DRADIOLIB_GODMODE=1
  -DMESHTASTIC_BENCH_INSTRUMENTATION=1
  -DDMSHELL_TEST_SLOT_PARITY=1
  -DMESHTASTIC_RX_RETRY_WRONG_MODEM=1
