; DMShell loss bench r135, arm D: develop. Both arms carry the same DMShell server and test client, so
; only the radio and router stack differs. Each run ends when the output is complete (DMSHELL_TEST_UNTIL_DONE).
; -lt envs are for LONG_TURBO: a 30000-byte job instead of 120000. Pair with native-r135-d. Not built by CI.

[env:tbeam-s3-core-r135-d]
extends = env:tbeam-s3-core
board_level = extra
build_flags = ${env:tbeam-s3-core.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DDMSHELL_TEST_UNTIL_DONE=1

[env:tbeam-s3-core-r135-d-lt]
extends = env:tbeam-s3-core
board_level = extra
build_flags = ${env:tbeam-s3-core.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DDMSHELL_TEST_UNTIL_DONE=1
  -DDMSHELL_TEST_OUTPUT_BYTES=30000
