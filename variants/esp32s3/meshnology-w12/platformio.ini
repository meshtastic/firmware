; Meshnology W12 "WiFi LoRa 32 V5" - ESP32-S3R8 + LR2021 dual-band LoRa + SSD1315 OLED
; No MESHNOLOGY_W12 hardware model exists in the protobufs yet, so this reports PRIVATE_HW.
[env:meshnology_w12]
custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = MESHNOLOGY_W12
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Meshnology W12
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 16MB

extends = esp32s3_base
board_level = release
board = esp32-s3-devkitc-1
; ESP32-S3R8: 8 MB OPI PSRAM, 16 MB QIO flash
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
build_flags =
  ${esp32s3_base.build_flags}
  -D MESHNOLOGY_W12
  -D ARDUINO_USB_CDC_ON_BOOT=1
  ; Without this define the 8MB PSRAM silently never joins the heap:
  ; the framework compiles everything with -DESP32_ARDUINO_LIB_BUILDER, and
  ; esp32-hal-psram.h then UNDEFINES CONFIG_SPIRAM unless BOARD_HAS_PSRAM is
  ; set - psramInit() becomes a return-false stub and psramAddToHeap() is
  ; never called, regardless of what the sdkconfig says. The node then runs
  ; entirely on ~390KB internal SRAM and the phone API's connect-time manifest
  ; allocation (~15KB contiguous) aborts the node with std::bad_alloc.
  -D BOARD_HAS_PSRAM
  -I variants/esp32s3/meshnology-w12

; ---------------------------------------------------------------------------
; USB-Ethernet (CDC-NCM) gadget target - reference consumer of the shared
; [usbnet] fragment (variants/esp32/usbnet.ini; requirements and the adoption
; recipe are documented there).
;
; The W12 qualifies: native S3 USB on the connector (ARDUINO_USB_CDC_ON_BOOT=1
; above), PSRAM (BOARD_HAS_PSRAM above), and it is already requires_dfu = true,
; so taking over USB-OTG regresses no auto-reset circuit.
; ---------------------------------------------------------------------------
[env:meshnology_w12_usbnet]
extends = env:meshnology_w12
board_level = extra
extra_scripts =
  ${esp32_common.extra_scripts}
  ${usbnet.extra_scripts}
custom_meshtastic_hw_model_slug = MESHNOLOGY_W12_USBNET
custom_meshtastic_display_name = Meshnology W12 (USB-NCM)
custom_meshtastic_actively_supported = false
build_flags =
  ${env:meshnology_w12.build_flags}
  ${usbnet.build_flags}
  ; 30s, not the 8s code default: once the gadget claims the USB pads the serial
  ; port disappears and esptool has no RTS line to auto-reset with, so every
  ; reflash would need a manual BOOT+RST. A 30s window is long enough to start
  ; `pio run -t upload` after a reset and keep the dev loop self-service.
  ; Lower it for a real build.
  -D USB_NET_START_DELAY_MS=30000
custom_component_add = ${usbnet.custom_component_add}
custom_sdkconfig =
  ${esp32s3_base.custom_sdkconfig}
  ${usbnet.custom_sdkconfig}
  ; Panic backtraces are otherwise unrecoverable on this build: the console is
  ; HWCDC on USB-Serial-JTAG, and the gadget takes those pads, so a crash after
  ; the 30s mark prints into the void. default_16MB.csv already carries a 64KB
  ; coredump partition at 0xFF0000; dump there and read it back over the ROM
  ; bootloader with espcoredump.py.
  ; TO_NONE must be unset EXPLICITLY: the platform's sdkconfig merge only
  ; rewrites template lines whose flag name appears here, and the template has
  ; CONFIG_ESP_COREDUMP_ENABLE_TO_NONE=y. TO_FLASH and TO_NONE are members of
  ; the same Kconfig choice, and with both =y in sdkconfig.defaults the later
  ; line (TO_NONE) wins - the build silently comes out with no coredump.
  CONFIG_ESP_COREDUMP_ENABLE_TO_NONE=n
  CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH=y
  CONFIG_ESP_COREDUMP_DATA_FORMAT_ELF=y
  CONFIG_ESP_COREDUMP_CHECKSUM_CRC32=y
  CONFIG_ESP_COREDUMP_MAX_TASKS_NUM=64
