[env:t-deck-pro]
custom_meshtastic_hw_model = 102
custom_meshtastic_hw_model_slug = T_DECK_PRO
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = LILYGO T-Deck Pro
custom_meshtastic_images = tdeck_pro.svg
custom_meshtastic_tags = LilyGo
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 16MB
custom_meshtastic_has_ink_hud = true
custom_meshtastic_has_mui = false

extends = esp32s3_base, niche
board_level = release
board = t-deck-pro
upload_protocol = esptool

build_src_filter =
  ${esp32s3_base.build_src_filter}
  +<../variants/esp32s3/t-deck-pro>
  ${niche.build_src_filter}
  -<graphics/EInkDisplay2.cpp> ; BaseUI drives the panel through graphics/eink/
  -<graphics/EInkDynamicDisplay.cpp>

build_flags = 
  ${esp32s3_base.build_flags} -I variants/esp32s3/t-deck-pro
  ${niche.build_flags}
  -D T_DECK_PRO
  -D USE_EINK
  -D EINK_WIDTH=240
  -D EINK_HEIGHT=320

lib_deps =
  ${esp32s3_base.lib_deps}
  # renovate: datasource=git-refs depName=CSE_Touch packageName=https://github.com/CIRCUITSTATE/CSE_Touch gitBranch=main
  https://github.com/CIRCUITSTATE/CSE_Touch/archive/b44f23b6f870b848f1fbe453c190879bc6cfaafa.zip
  # renovate: datasource=github-tags depName=CSE_CST328 packageName=CIRCUITSTATE/CSE_CST328
  https://github.com/CIRCUITSTATE/CSE_CST328/archive/refs/tags/v0.0.4.zip
  # renovate: datasource=git-refs depName=BQ27220 packageName=https://github.com/mverch67/BQ27220 gitBranch=main
  https://github.com/mverch67/BQ27220/archive/07d92be846abd8a0258a50c23198dac0858b22ed.zip
  # renovate: datasource=custom.pio depName=Adafruit DRV2605 packageName=adafruit/library/Adafruit DRV2605 Library
  adafruit/Adafruit DRV2605 Library@1.2.4

[env:t-deck-pro-inkhud]
extends = env:t-deck-pro, inkhud
board_build.partitions = default_16MB.csv
lib_ignore = GxEPD2
build_flags =
  ${env:t-deck-pro.build_flags}
  ${inkhud.build_flags}
  -D INKHUD_USE_SDCARD_MAP_TILES
  -D HAS_BHI260AP
  -D BHI260AP_INT=21
  -D T_DECK_PRO_AUDIO
build_src_filter =
  ${env:t-deck-pro.build_src_filter}
  ${inkhud.build_src_filter}
  -<graphics/niche/Drivers/EInk/> ; Panel drivers come from graphics/eink/, shared with BaseUI
lib_deps =
  ${inkhud.lib_deps}
  ${env:t-deck-pro.lib_deps}
  lewisxhe/SensorLib@0.4.1
  https://github.com/meshtastic/ESP8266Audio/archive/343024632ee78d6216907b2353fc943a62422d80.zip
  earlephilhower/ESP8266SAM@1.1.0
