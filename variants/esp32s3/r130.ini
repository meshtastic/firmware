; Shared-SPI sweep r130, arm C: develop plus the five open bugfix PRs merged
; (plus the bench TFT-task flag, which is undefined in -r130-c and so compiles to nothing).
; The Axiometa Genesis Mini is the client:
; its ST7735S panel shares SCK/MOSI/MISO with the SX1262 on SPI2_HOST.
;
; DMSHELL_TEST_PEER is deliberately NOT set here. Pass it on the build command line against the
; Beelink server's own node id, e.g.
;   PLATFORMIO_BUILD_FLAGS=-DDMSHELL_TEST_PEER=0x1a2b3c4d pio run -e axiometa-genesis-mini-r130-c
; Forgetting it leaves the test client out of the image entirely, which fails loudly at boot
; rather than producing a silent null.
;
; Not built by CI.

[env:axiometa-genesis-mini-r130-c]
extends = env:axiometa-genesis-mini
board_level = extra

; Same arm, same image, with the display's render loop suppressed: the panel is initialized but
; nothing draws to it, so display SPI traffic is the only thing that differs from -r130-c.
[env:axiometa-genesis-mini-r130-cq]
extends = env:axiometa-genesis-mini
board_level = extra
build_flags = ${env:axiometa-genesis-mini.build_flags}
  -DMESHTASTIC_BENCH_NO_TFT_TASK
