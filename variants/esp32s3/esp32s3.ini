[esp32s3_base]
extends = esp32_common
custom_esp32_kind = esp32s3

monitor_speed = 115200

build_flags =
  ${esp32_common.build_flags}
  -mtext-section-literals
  -DHAS_BLE_MESH=1
  ; Gated on our own flag, NOT MYNEWT_VAL(BLE_EXT_ADV). That macro resolves from the *prebuilt*
  ; esp_nimble_cfg.h in the framework's include tree, which does not reflect custom_sdkconfig - so it
  ; reads 0 even in a build whose rebuilt NimBLE library does have extended advertising. Gating on it
  ; silently compiles the extended path out and drops the transport to the legacy 31-byte branch,
  ; which cannot carry a mesh frame at all: the symptom is a node that looks healthy and never emits
  ; anything.
  -DBLE_MESH_USE_EXT_ADV=1

custom_sdkconfig =
  ${esp32_common.custom_sdkconfig}
  CONFIG_BT_NIMBLE_EXT_ADV=y
  CONFIG_BT_NIMBLE_TRANSPORT_EVT_SIZE=257
  CONFIG_BT_NIMBLE_MAX_EXT_ADV_INSTANCES=2
  ; Scanning is a *role*, and the stock Arduino NimBLE build compiles it out:
  ; framework-arduinoespressif32-libs/esp32s3/sdkconfig has ROLE_BROADCASTER=y but
  ; "# CONFIG_BT_NIMBLE_ROLE_OBSERVER is not set". Without this, ble_gap_ext_disc()
  ; returns BLE_HS_ENOTSUP (8) and the mesh transport can advertise but never receive.
  CONFIG_BT_NIMBLE_ROLE_OBSERVER=y

lib_deps =
  ${esp32_common.lib_deps}
  # renovate: datasource=git-refs depName=meshtastic-ESP32_Codec2 packageName=https://github.com/meshtastic/ESP32_Codec2 gitBranch=master
  https://github.com/meshtastic/ESP32_Codec2/archive/633326c78ac251c059ab3a8c430fcdf25b41672f.zip
