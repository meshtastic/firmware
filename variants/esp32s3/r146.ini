; DMShell loss bench r146, arm 282: v2.8.2 (tag v2.8.2.d5f1619), plus the until-done test client.
; The DMShell server and test client are the same code in both arms and in r135, so only the radio and router
; stack differs. -lt envs are for LONG_TURBO: a 15000-byte job, as r135 ran it. Pair with native-r146-282. Not built by CI.

[env:tbeam-s3-core-r146-282]
extends = env:tbeam-s3-core
board_level = extra
build_flags = ${env:tbeam-s3-core.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DDMSHELL_TEST_UNTIL_DONE=1

[env:tbeam-s3-core-r146-282-lt]
extends = env:tbeam-s3-core
board_level = extra
build_flags = ${env:tbeam-s3-core.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DDMSHELL_TEST_UNTIL_DONE=1
  -DDMSHELL_TEST_OUTPUT_BYTES=15000
