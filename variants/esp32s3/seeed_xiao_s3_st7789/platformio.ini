[env:seeed-xiao-s3-st7789]
extends = env:seeed-xiao-s3
board_level = extra
custom_meshtastic_display_name = Seeed XIAO S3 with ST7789
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 1
build_flags =
  ${esp32s3_base.build_flags}
  -D SEEED_XIAO_S3
  -D SEEED_XIAO_S3_ST7789
  -I variants/esp32s3/seeed_xiao_s3_st7789
  -DBOARD_HAS_PSRAM
lib_deps =
  ${esp32s3_base.lib_deps}
  https://github.com/AmeliaOramous/st7789/archive/d14f52bb8e6ce2f3b842197a06c75e093cf5912f.zip
