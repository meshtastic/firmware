; ESP32-S3 Super Mini + Wio-SX1262 V1.0 Custom Variant
[env:esp32s3_super_mini_wio_sx1262]
custom_meshtastic_hw_model = 100
custom_meshtastic_hw_model_slug = ESP32S3_SUPER_MINI_WIO_SX1262
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = ESP32-S3 Super Mini + Wio-SX1262
custom_meshtastic_tags = Custom,DIY
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 8MB

extends = esp32s3_base
board_level = release
board = esp32-s3-super-mini-wio-sx1262
board_build.variant = ${PROJECT_DIR}/variants/esp32s3/esp32s3_super_mini_wio_sx1262
board_build.partitions = default_8MB.csv
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.arduino.memory_type = opi_opi
board_build.arduino.ldscript = esp32s3_out.ld
board_build.core = esp32
board_build.extra_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_RUNNING_CORE=1
  -DARDUINO_EVENT_RUNNING_CORE=1

lib_deps =
  ${esp32s3_base.lib_deps}

build_flags =
  ${esp32s3_base.build_flags}
  -I ${PROJECT_DIR}/variants/esp32s3/esp32s3_super_mini_wio_sx1262