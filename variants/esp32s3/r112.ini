; DMShell loss bench r112, arms A and Anp, on claude/dmshell-on-develop. See variants/nrf52840/r112.ini for the arms.
; Not built by CI.

[env:tbeam-s3-core-r112-a]
extends = env:tbeam-s3-core
board_level = extra
build_flags = ${env:tbeam-s3-core.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DRADIOLIB_GODMODE=1
  -DDMSHELL_TEST_SLOT_PARITY=1
  -DMESHTASTIC_RADIO_TASK
  -DMESHTASTIC_TX_SLOT_GATE_MS=1
  -DMESHTASTIC_TX_SLOT_LEAD
  -DMESHTASTIC_TX_SLOT_SET_TX_AT_MS=3

[env:tbeam-s3-core-r112-anp]
extends = env:tbeam-s3-core
board_level = extra
build_flags = ${env:tbeam-s3-core.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DRADIOLIB_GODMODE=1
  -DMESHTASTIC_RADIO_TASK
  -DMESHTASTIC_TX_SLOT_GATE_MS=1
  -DMESHTASTIC_TX_SLOT_LEAD
  -DMESHTASTIC_TX_SLOT_SET_TX_AT_MS=3
