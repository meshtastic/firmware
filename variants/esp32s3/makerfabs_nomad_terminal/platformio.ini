; Makerfabs Nomad Terminal: ESP32-S3 N16R8 + LR1121, 3.5" ILI9488 SPI TFT + FT6236 touch
; https://github.com/Makerfabs/Nomad-Terminal
[env:makerfabs_nomad_terminal]
custom_meshtastic_hw_model = 149
custom_meshtastic_hw_model_slug = MAKERFABS_NOMAD_TERMINAL
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 2
custom_meshtastic_display_name = Makerfabs Nomad Terminal
custom_meshtastic_tags = Makerfabs
custom_meshtastic_requires_dfu = false
custom_meshtastic_partition_scheme = 16MB
custom_meshtastic_has_mui = true

extends = esp32s3_base
board = crowpanel
board_level = release
board_build.partitions = default_16MB.csv
upload_protocol = esptool

build_src_filter =
  ${esp32s3_base.build_src_filter}
  +<../variants/esp32s3/makerfabs_nomad_terminal>

build_flags =
  ${esp32s3_base.build_flags}
  -I variants/esp32s3/makerfabs_nomad_terminal
  -D MAKERFABS_NOMAD_TERMINAL
  -D USE_PIN_BUZZER=PIN_BUZZER

lib_deps =
  ${esp32s3_base.lib_deps}
  # renovate: datasource=custom.pio depName=LovyanGFX packageName=lovyan03/library/LovyanGFX
  lovyan03/LovyanGFX@1.2.28
  # renovate: datasource=git-refs depName=meshtastic-PCF8xRTC packageName=https://github.com/meshtastic/PCF8xRTC gitBranch=main
  https://github.com/meshtastic/PCF8xRTC/archive/efe1d9c92f79d8413f8ac4e9bdce0c48410600de.zip

[env:makerfabs_nomad_terminal-tft]
extends = env:makerfabs_nomad_terminal

build_flags =
  ${env:makerfabs_nomad_terminal.build_flags}
  -D CONFIG_ARDUHAL_ESP_LOG
  -D CONFIG_ARDUHAL_LOG_COLORS=1
  -D CONFIG_DISABLE_HAL_LOCKS=1
  -D MESHTASTIC_EXCLUDE_WEBSERVER=1
  -D RADIOLIB_SPI_PARANOID=0
  -D HAS_SCREEN=0
  -D HAS_TFT=1
  -D USE_PACKET_API
  -D RAM_SIZE=5120
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_COMP_CONF_INCLUDE_SIMPLE
  -D LV_USE_SYSMON=0
  -D LV_USE_PROFILER=0
  -D LV_USE_PERF_MONITOR=0
  -D LV_USE_MEM_MONITOR=0
  -D LV_USE_LOG=0
  -D LV_BUILD_TEST=0
  -D USE_LOG_DEBUG
  -D LOG_DEBUG_INC=\"DebugConfiguration.h\"
  -D LGFX_DRIVER_TEMPLATE
  -D LGFX_DRIVER=LGFX_GENERIC
  -D GFX_DRIVER_INC=\"graphics/LGFX/LGFX_GENERIC.h\"
  -D VIEW_320x240
  -D DISPLAY_SET_RESOLUTION
  -D DISPLAY_SIZE=320x480 ; portrait mode
  -D SPI_FREQUENCY=40000000
  -D LGFX_PANEL=ILI9488
  -D LGFX_INVERT_COLOR=false
  -D LGFX_SCREEN_WIDTH=320
  -D LGFX_SCREEN_HEIGHT=480
  -D LGFX_ROTATION=2
  -D LGFX_CFG_HOST=SPI3_HOST
  -D LGFX_PIN_SCK=16
  -D LGFX_PIN_MOSI=10
  -D LGFX_PIN_MISO=12
  -D LGFX_PIN_DC=5
  -D LGFX_PIN_CS=4
  -D LGFX_PIN_RST=7
  -D LGFX_PIN_BL=9
  -D LGFX_TOUCH=FT5x06
  -D LGFX_TOUCH_I2C_PORT=0
  -D LGFX_TOUCH_I2C_ADDR=0x38
  -D LGFX_TOUCH_I2C_SDA=39
  -D LGFX_TOUCH_I2C_SCL=38
  -D LGFX_TOUCH_INT=41
  -D LGFX_TOUCH_RST=42
  -D LGFX_TOUCH_X_MIN=0
  -D LGFX_TOUCH_X_MAX=319
  -D LGFX_TOUCH_Y_MIN=0
  -D LGFX_TOUCH_Y_MAX=479
  -D LGFX_TOUCH_ROTATION=0
  -D MAP_FULL_REDRAW

lib_deps =
  ${env:makerfabs_nomad_terminal.lib_deps}
  ${device-ui_base.lib_deps}

custom_sdkconfig =
  ${esp32s3_base.custom_sdkconfig}
  ${device-ui_base.custom_sdkconfig}
