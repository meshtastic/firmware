; M5Stack SolarNode - ESP32-S3R8 + Stamp LoRa-1262 I (SX1262) + ATGM336H GNSS, solar powered
[env:m5stack_solar_node]
custom_meshtastic_hw_model = 154
custom_meshtastic_hw_model_slug = M5STACK_SOLAR_NODE
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = M5Stack SolarNode
custom_meshtastic_images = m5stack_solar_node.svg
custom_meshtastic_tags = M5Stack
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 16MB
custom_meshtastic_has_mui = false

extends = esp32s3_base
board_level = release
board = esp32-s3-devkitc-1
; ESP32-S3R8: 8 MB OPI PSRAM, 16 MB QIO flash
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
build_src_filter =
  ${esp32s3_base.build_src_filter}
  +<../variants/esp32s3/m5stack_solar_node>
build_flags =
  ${esp32s3_base.build_flags}
  -D M5STACK_SOLAR_NODE
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -I variants/esp32s3/m5stack_solar_node
