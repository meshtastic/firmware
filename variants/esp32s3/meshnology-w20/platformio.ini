[env:meshnology_w20]
custom_meshtastic_hw_model = 155
custom_meshtastic_hw_model_slug = MESHNOLOGY_W20
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Meshnology W20
custom_meshtastic_tags = Meshnology
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 16MB
custom_meshtastic_url = https://wiki.meshnology.com/W20/W20_LoRa_GPS_Tracker/

extends = esp32s3_base
board = esp32-s3-devkitc1-n16r8
board_level = release
board_build.partitions = default_16MB.csv
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_opi

build_src_filter =
  ${esp32s3_base.build_src_filter}
  +<../variants/esp32s3/meshnology-w20>

build_flags =
  ${esp32s3_base.build_flags}
  -D MESHNOLOGY_W20
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D USE_EINK
  -D EINK_DISPLAY_MODEL=W20EInkPanel
  -D EINK_WIDTH=240
  -D EINK_HEIGHT=320
  -I variants/esp32s3/meshnology-w20

lib_deps =
  ${esp32s3_base.lib_deps}
  # renovate: datasource=custom.pio depName=GxEPD2 packageName=zinggjm/library/GxEPD2
  zinggjm/GxEPD2@1.6.9
  # renovate: datasource=custom.pio depName=SensorLib packageName=lewisxhe/library/SensorLib
  lewisxhe/SensorLib@0.5.2
