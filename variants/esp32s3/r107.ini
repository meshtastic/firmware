; DMShell loss bench, round 107, arm T: claude/rx-readout-task as the PR stands, plus the on-board test client.
; On the T-Beam the PR gives the readout task and the SX126x TX_DONE re-arm from that task; -norearm takes the re-arm
; back out, so the readout task can be read on its own. Not built by CI.

[env:tbeam-s3-core-r107-t]
extends = env:tbeam-s3-core
board_level = extra
build_flags = ${env:tbeam-s3-core.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2

[env:tbeam-s3-core-r107-t-norearm]
extends = env:tbeam-s3-core
board_level = extra
build_flags = ${env:tbeam-s3-core.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DSX126X_RX_REARM_AT_TX_DONE=0
