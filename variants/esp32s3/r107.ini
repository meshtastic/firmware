
; T-resume: the T-Beam's arm T build plus SX126X_RX_KNOWN_CONTINUOUS. Nothing on this branch changes the ESP32's
; re-arm path, so this is arm T plus the resume, and it reads against tbeam-s3-core-r107-t.
[env:tbeam-s3-core-r107-t-resume]
extends = env:tbeam-s3-core
board_level = extra
build_flags = ${env:tbeam-s3-core.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DSX126X_RX_KNOWN_CONTINUOUS=1

; T-resume on the X1: the LR2021 re-arms from the readout task on every arm here, so this is that arm plus
; LR2021_RESUME_CONTINUOUS_RX, the same resume as the T1000-E's. Reads against seeed_mesh_tracker_X1-r107-t.
[env:seeed_mesh_tracker_X1-r107-t-resume]
extends = env:seeed_mesh_tracker_X1
board_level = extra
build_flags = ${env:seeed_mesh_tracker_X1.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DLR2021_RESUME_CONTINUOUS_RX=1
