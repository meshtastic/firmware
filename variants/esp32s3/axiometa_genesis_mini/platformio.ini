; Axiometa Genesis Mini - ESP32-S3-MINI-1-N4R2 + Elecrow LR1262 (SX1262) on AX22 Port 2.
[env:axiometa-genesis-mini]
custom_meshtastic_hw_model = 148
custom_meshtastic_hw_model_slug = AXIOMETA_GENESIS_MINI
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Axiometa Genesis Mini
custom_meshtastic_url = https://www.axiometa.io/products/axiometa-genesis-mini
custom_meshtastic_partition_scheme = 4MB

extends = esp32s3_base
board = axiometa-genesis-mini
board_check = true
board_level = pr
; Same ESP32-S3 memory config as the LILYGO T3-S3 (4 MB flash / 2 MB quad PSRAM),
; so it reuses that table's larger app slot.
board_build.partitions = partition-table-t3s3.csv
upload_protocol = esptool

build_src_filter =
  ${esp32s3_base.build_src_filter}
  +<../variants/esp32s3/axiometa_genesis_mini>

build_flags =
  ${esp32s3_base.build_flags}
  -D AXIOMETA_GENESIS_MINI
  -I variants/esp32s3/axiometa_genesis_mini

lib_deps =
  ${esp32s3_base.lib_deps}
  # renovate: datasource=custom.pio depName=LovyanGFX packageName=lovyan03/library/LovyanGFX
  lovyan03/LovyanGFX@1.2.26
