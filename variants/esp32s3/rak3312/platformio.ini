[env:rak3312]
custom_meshtastic_hw_model = 106
custom_meshtastic_hw_model_slug = RAK3312
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = RAK3312
custom_meshtastic_images = rak_3312.svg
custom_meshtastic_tags = RAK
custom_meshtastic_requires_dfu = false
custom_meshtastic_partition_scheme = 16MB
custom_meshtastic_has_mui = false

extends = esp32s3_base
board_level = release
board = wiscore_rak3312
upload_protocol = esptool

build_flags = 
  ${esp32s3_base.build_flags}
  -D RAK3312
  -I variants/esp32s3/rak3312

; RAK3312 + RAK13800 (WIZnet W5100S-L) Ethernet module, optionally powered via RAK19018 PoE.
; Separate env (like rak4631_eth_gw) so the plain rak3312 build is unchanged.
[env:rak3312_eth_gw]
extends = env:rak3312
board_level = release

build_flags =
  ${env:rak3312.build_flags}
  -D RAK3312_ETH_GW

custom_sdkconfig =
  ${esp32s3_base.custom_sdkconfig}
  CONFIG_ETH_ENABLED=y
  CONFIG_ARDUINO_SELECTIVE_Ethernet=y

build_src_filter =
  ${esp32s3_base.build_src_filter}
  +<mesh/eth/>

lib_deps =
  ${esp32s3_base.lib_deps}
  # renovate: datasource=github-tags depName=RAK13800-W5100S packageName=RAKWireless/RAK13800-W5100S
  https://github.com/RAKWireless/RAK13800-W5100S/archive/1.0.4.zip

[env:rak3112]
extends = esp32s3_base
board = wiscore_rak3312
board_level = extra
upload_protocol = esptool

build_flags =
  ${esp32s3_base.build_flags}
  -D RAK3312 
  -D _VARIANT_RAK3112_
  -I variants/esp32s3/rak3312
