; The 1.0 release of the LilyGo TBEAM-S3-Core board 
[env:tbeam-s3-core]
custom_meshtastic_hw_model = 12
custom_meshtastic_hw_model_slug = LILYGO_TBEAM_S3_CORE
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = LILYGO T-Beam Supreme
custom_meshtastic_images = tbeam-s3-core.svg
custom_meshtastic_tags = LilyGo
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 8MB

extends = esp32s3_base
board_level = release
board = tbeam-s3-core
board_build.partitions = default_8MB.csv

lib_deps =
  ${esp32s3_base.lib_deps}
  # renovate: datasource=git-refs depName=meshtastic-PCF8xRTC packageName=https://github.com/meshtastic/PCF8xRTC gitBranch=main
  https://github.com/meshtastic/PCF8xRTC/archive/efe1d9c92f79d8413f8ac4e9bdce0c48410600de.zip

build_flags = 
  ${esp32s3_base.build_flags} 
  -I variants/esp32s3/tbeam-s3-core

; r123 bench arm: the deep-sleep wake-pad fix (in the tree, not flag-gated) plus the wake-pin probe,
; which is. Not a release env - board_level keeps it out of the release matrix.
[env:tbeam-s3-core-r123]
extends = env:tbeam-s3-core
board_level = extra
build_flags =
  ${env:tbeam-s3-core.build_flags}
  -D MESHTASTIC_WAKE_PIN_PROBE=1
  -D MESHTASTIC_NO_LIGHT_SLEEP=1
  -D MESHTASTIC_FORCE_DEEP_SLEEP_SECS=20
  -D MESHTASTIC_FORCE_DEEP_SLEEP_AWAKE_SECS=30

; r124 bench arm: the light-sleep-under-USB fix, with a counter so the sleeps can be counted across an
; unplugged window. Deliberately does NOT define MESHTASTIC_NO_LIGHT_SLEEP or the deep-sleep forcer -
; this arm needs light sleep to be reachable. Not a release env.
[env:tbeam-s3-core-r124]
extends = env:tbeam-s3-core
board_level = extra
build_flags =
  ${env:tbeam-s3-core.build_flags}
  -D MESHTASTIC_LIGHT_SLEEP_COUNT=1

; r125 bench arms: the GPIO interrupt storm at the first attachInterrupt() of the boot. The probe is
; read-only and additive; the arms change what attachPowerInterrupts() does with PMU_IRQ.
;   D  = stock, probe only
;   C1 = clear the AXP IRQ status immediately before the attach
;   C2 = do not attach PMU_IRQ at all (the 20 s poll keeps working)
;   C3 = give the open-drain pad an internal pull-up before the attach
; Not release envs.
[env:tbeam-s3-core-r125d]
extends = env:tbeam-s3-core
board_level = extra
build_flags =
  ${env:tbeam-s3-core.build_flags}
  -D MESHTASTIC_PMU_IRQ_PROBE=1

[env:tbeam-s3-core-r125c1]
extends = env:tbeam-s3-core-r125d
build_flags =
  ${env:tbeam-s3-core-r125d.build_flags}
  -D MESHTASTIC_PMU_IRQ_ARM=1

[env:tbeam-s3-core-r125c2]
extends = env:tbeam-s3-core-r125d
build_flags =
  ${env:tbeam-s3-core-r125d.build_flags}
  -D MESHTASTIC_PMU_IRQ_ARM=2

[env:tbeam-s3-core-r125c3]
extends = env:tbeam-s3-core-r125d
build_flags =
  ${env:tbeam-s3-core-r125d.build_flags}
  -D MESHTASTIC_PMU_IRQ_ARM=3
