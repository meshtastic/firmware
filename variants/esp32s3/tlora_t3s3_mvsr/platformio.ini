[env:tlora-t3s3-mvsr]
custom_meshtastic_hw_model = 16
custom_meshtastic_hw_model_slug = TLORA_T3_S3
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = LILYGO T-LoRa T3-S3 MVSR
custom_meshtastic_images = tlora-t3s3-v1.svg
custom_meshtastic_tags = LilyGo, 2.4GHz, Audio
custom_meshtastic_requires_dfu = true

extends = esp32s3_base
board_level = extra
board = tlora-t3s3-v1
board_build.partitions = partition-table-t3s3.csv
upload_protocol = esptool

lib_deps =
  ${esp32s3_base.lib_deps}
  # renovate: datasource=github-tags depName=meshtastic-codec2 packageName=meshtastic/codec2
  https://github.com/meshtastic/codec2/archive/refs/tags/v1.1.0.zip
  # renovate: datasource=custom.pio depName=SensorLib packageName=lewisxhe/library/SensorLib
  lewisxhe/SensorLib@0.3.4

build_flags =
  ${esp32s3_base.build_flags}
  -D TLORA_T3S3_V1
  ; newlib powf costs ~2400 cycles and lpc_post_filter calls it 256 times
  ; per subframe. The approximation is 0.008% worst case, 81 dB below the
  ; signal after decode, and inaudible.
  -D CODEC2_FAST_MATH
  ; Stage two of the newamp1 VQ runs one 512 entry search per survivor, so
  ; cost is linear in depth. Measured on an nRF52840: depth 5 puts 700C
  ; encode at 118% of frame budget, depth 2 at about 92%, for 0.025 dB more
  ; VQ error against an inherent 3.2 dB. Encoder side only, the bitstream
  ; and any stock decoder are unaffected.
  -D NEWAMP1_VQ_MBEST_DEPTH=2
  -D TLORA_T3S3_MVSR
  -I variants/esp32s3/tlora_t3s3_mvsr
  ; after ours, so our variant.h wins but pins_arduino.h resolves from the base
  -I variants/esp32s3/tlora_t3s3_v1
  ; Shipped codec2 rates. Each newamp mode costs ~20 KB of int8 codebook.
  ; Audio is excluded by default; this board has the mic and amplifier for it.
  -DMESHTASTIC_EXCLUDE_AUDIO=0
  -D CODEC2_MODE_EN_DEFAULT=0
  -D CODEC2_MODE_2400_EN=1
  -D CODEC2_MODE_1400_EN=1
  -D CODEC2_MODE_700C_EN=1
  -D CODEC2_MODE_450_EN=1
  ; A small OLED audio board has no use for the web UI, and the app slot is tight.
  -D MESHTASTIC_EXCLUDE_WEBSERVER=1
