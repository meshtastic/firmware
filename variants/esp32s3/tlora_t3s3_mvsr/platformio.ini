[env:tlora-t3s3-mvsr]
custom_meshtastic_hw_model = 16
custom_meshtastic_hw_model_slug = TLORA_T3_S3
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = LILYGO T-LoRa T3-S3 MVSR
custom_meshtastic_images = tlora-t3s3-v1.svg
custom_meshtastic_tags = LilyGo, 2.4GHz, Audio
custom_meshtastic_requires_dfu = true

extends = esp32s3_base
board_level = extra
board = tlora-t3s3-v1
board_build.partitions = partition-table-t3s3.csv
upload_protocol = esptool

lib_deps =
  ${esp32s3_base.lib_deps}
  # renovate: datasource=git-refs depName=meshtastic-codec2 packageName=https://github.com/meshtastic/codec2 gitBranch=main
  https://github.com/meshtastic/codec2/archive/refs/heads/main.zip

build_flags =
  ${esp32s3_base.build_flags}
  -D TLORA_T3S3_V1
  -D TLORA_T3S3_MVSR
  -I variants/esp32s3/tlora_t3s3_mvsr
  ; Shipped codec2 rates. Each newamp mode costs ~20 KB of int8 codebook.
  -D CODEC2_MODE_EN_DEFAULT=0
  -D CODEC2_MODE_2400_EN=1
  -D CODEC2_MODE_1400_EN=1
  -D CODEC2_MODE_700C_EN=1
  -D CODEC2_MODE_450_EN=1
  ; A small OLED audio board has no use for the web UI, and the app slot is tight.
  -D MESHTASTIC_EXCLUDE_WEBSERVER=1
