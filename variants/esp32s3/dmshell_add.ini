; DMShell loss bench, add-one-in run on claude/dmshell-final. The baseline is develop's behaviour: the -base env has
; every quantum's switch off, and each -q* env adds one back. Server and client run the arm of the same name, so a run is
; a matched pair. Some quanta cannot be added alone - the note on each env says what it carries and which arm to compare
; it against. DMSHELL_TEST_PEER is the server's node number. Not built by CI.

; every quantum off: develop's behaviour plus the harness
[env:tbeam-s3-core-dmshell-add]
extends = env:tbeam-s3-core
board_level = extra
build_flags = ${env:tbeam-s3-core.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DRADIOLIB_GODMODE=1
  -DMESHTASTIC_BENCH_INSTRUMENTATION=1
  -DMESHTASTIC_EXCLUDE_READOUT_TASK=1
  -DSX126X_RX_REARM_AT_TX_DONE=0
  -DMESHTASTIC_RX_DEFER_FOR_TX_MS=0
  -DMESHTASTIC_REARM_HOLD_FIX=0
  -DMESHTASTIC_RADIOLIB_SPI_TIMEOUT_MS=0

; Q3 readout task (with the chip's continuous-RX resume)
[env:tbeam-s3-core-dmshell-add-q3]
extends = env:tbeam-s3-core
board_level = extra
build_flags = ${env:tbeam-s3-core.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DRADIOLIB_GODMODE=1
  -DMESHTASTIC_BENCH_INSTRUMENTATION=1
  -DSX126X_RX_REARM_AT_TX_DONE=0
  -DMESHTASTIC_RX_DEFER_FOR_TX_MS=0
  -DMESHTASTIC_REARM_HOLD_FIX=0
  -DMESHTASTIC_RADIOLIB_SPI_TIMEOUT_MS=0

; Q4 needs the readout task to re-arm from: Q3 + Q4, so compare against the q3 arm
[env:tbeam-s3-core-dmshell-add-q4]
extends = env:tbeam-s3-core
board_level = extra
build_flags = ${env:tbeam-s3-core.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DRADIOLIB_GODMODE=1
  -DMESHTASTIC_BENCH_INSTRUMENTATION=1
  -DMESHTASTIC_RX_DEFER_FOR_TX_MS=0
  -DMESHTASTIC_REARM_HOLD_FIX=0
  -DMESHTASTIC_RADIOLIB_SPI_TIMEOUT_MS=0

; Q10 slot parity stamped on the packet
[env:tbeam-s3-core-dmshell-add-q10]
extends = env:tbeam-s3-core
board_level = extra
build_flags = ${env:tbeam-s3-core.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DRADIOLIB_GODMODE=1
  -DMESHTASTIC_BENCH_INSTRUMENTATION=1
  -DMESHTASTIC_EXCLUDE_READOUT_TASK=1
  -DSX126X_RX_REARM_AT_TX_DONE=0
  -DMESHTASTIC_RX_DEFER_FOR_TX_MS=0
  -DMESHTASTIC_REARM_HOLD_FIX=0
  -DDMSHELL_TEST_SLOT_PARITY=1
  -DMESHTASTIC_RADIOLIB_SPI_TIMEOUT_MS=0

; Q11 holds RX for a due slotted TX, so it needs Q10's grid: Q10 + Q11, compare against the q10 arm
[env:tbeam-s3-core-dmshell-add-q11]
extends = env:tbeam-s3-core
board_level = extra
build_flags = ${env:tbeam-s3-core.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DRADIOLIB_GODMODE=1
  -DMESHTASTIC_BENCH_INSTRUMENTATION=1
  -DMESHTASTIC_EXCLUDE_READOUT_TASK=1
  -DSX126X_RX_REARM_AT_TX_DONE=0
  -DMESHTASTIC_REARM_HOLD_FIX=0
  -DDMSHELL_TEST_SLOT_PARITY=1
  -DMESHTASTIC_RX_DEFER_FOR_TX_MS=30
  -DMESHTASTIC_RADIOLIB_SPI_TIMEOUT_MS=0

; Q12 radio thread in its own task
[env:tbeam-s3-core-dmshell-add-q12]
extends = env:tbeam-s3-core
board_level = extra
build_flags = ${env:tbeam-s3-core.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DRADIOLIB_GODMODE=1
  -DMESHTASTIC_BENCH_INSTRUMENTATION=1
  -DMESHTASTIC_EXCLUDE_READOUT_TASK=1
  -DSX126X_RX_REARM_AT_TX_DONE=0
  -DMESHTASTIC_RX_DEFER_FOR_TX_MS=0
  -DMESHTASTIC_REARM_HOLD_FIX=0
  -DMESHTASTIC_RADIO_TASK
  -DMESHTASTIC_RADIOLIB_SPI_TIMEOUT_MS=0

; Q12-Q14 bundle. The gate needs a parity to gate on and the lead needs the gate, so Q10 comes with it; compare against the q10 arm
[env:tbeam-s3-core-dmshell-add-q1214]
extends = env:tbeam-s3-core
board_level = extra
build_flags = ${env:tbeam-s3-core.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DRADIOLIB_GODMODE=1
  -DMESHTASTIC_BENCH_INSTRUMENTATION=1
  -DMESHTASTIC_EXCLUDE_READOUT_TASK=1
  -DSX126X_RX_REARM_AT_TX_DONE=0
  -DMESHTASTIC_RX_DEFER_FOR_TX_MS=0
  -DMESHTASTIC_REARM_HOLD_FIX=0
  -DDMSHELL_TEST_SLOT_PARITY=1
  -DMESHTASTIC_RADIO_TASK
  -DMESHTASTIC_TX_SLOT_GATE_MS=1
  -DMESHTASTIC_TX_SLOT_LEAD
  -DMESHTASTIC_TX_SLOT_SET_TX_AT_MS=3
  -DMESHTASTIC_RADIOLIB_SPI_TIMEOUT_MS=0

; The 50 ms BUSY bound, which develop does not have: RadioLib waits its own 1000 ms instead
[env:tbeam-s3-core-dmshell-add-qbusy]
extends = env:tbeam-s3-core
board_level = extra
build_flags = ${env:tbeam-s3-core.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DRADIOLIB_GODMODE=1
  -DMESHTASTIC_BENCH_INSTRUMENTATION=1
  -DMESHTASTIC_EXCLUDE_READOUT_TASK=1
  -DSX126X_RX_REARM_AT_TX_DONE=0
  -DMESHTASTIC_RX_DEFER_FOR_TX_MS=0
  -DMESHTASTIC_REARM_HOLD_FIX=0
  -DMESHTASTIC_RADIOLIB_SPI_TIMEOUT_MS=50
