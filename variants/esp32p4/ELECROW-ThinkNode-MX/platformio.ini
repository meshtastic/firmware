[env:ELECROW-ThinkNode-MX]
extends = esp32p4_base
board = esp32-p4-evboard
board_check = true
board_build.partitions = default_16MB.csv

build_src_filter =
  ${esp32p4_base.build_src_filter}
  +<../variants/esp32p4/ELECROW-ThinkNode-MX>

build_flags =
  ${esp32p4_base.build_flags}
  -I variants/esp32p4/ELECROW-ThinkNode-MX
  -D ELECROW_MX
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D ARDUINO_USB_MODE=1
  -D MESHTASTIC_EXCLUDE_WEBSERVER=1
  -D MESHTASTIC_EXCLUDE_CANNEDMESSAGES=1
  -D MESHTASTIC_EXCLUDE_INPUTBROKER=1
  -D MAX_NUM_NODES=500
  -D MAX_NUM_NODES_VIEW=500
;  -DSOC_USB_OTG_SUPPORTED=1
  -D CONFIG_DISABLE_HAL_LOCKS=1 ; "feels" to be a bit more stable without locks
;  -D INPUTDRIVER_BUTTON_TYPE=0
  -D HAS_SDCARD
  -D HAS_SD_MMC
  -D BOARD_MAX_SDMMC_FREQ=40000
  -D BOARD_HAS_1BIT_SDMMC
  -D SD_SCLK_PIN=43
  -D SD_MISO_PIN=39
  -D SD_MOSI_PIN=44
  -D SD_MMC_HOST_SLOT=SDMMC_HOST_SLOT_0
  -D HAS_SCREEN=1
  -D HAS_TFT=1
  -D USE_I2S_BUZZER
  -D RAM_SIZE=12288
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_COMP_CONF_INCLUDE_SIMPLE
  -D LV_USE_SYSMON=0
  -D LV_USE_PROFILER=0
  -D LV_USE_PERF_MONITOR=0
  -D LV_USE_MEM_MONITOR=0
  -D LV_USE_LOG=0
  -D USE_LOG_DEBUG
  -D LOG_DEBUG_INC=\"DebugConfiguration.h\"
  -D LORA_SPI_FREQUENCY=1000000
  -D BOARD_LORA_MAX_TX_POWER=17
  -D SX126X_CURRENT_LIMIT_MA=100
  -D RADIOLIB_SPI_PARANOID=0
  -D LGFX_SCREEN_WIDTH=1024
  -D LGFX_SCREEN_HEIGHT=600
  -D DISPLAY_SIZE=1024x600 ; landscape mode
  -D LGFX_DRIVER=LGFX_ELECROW_MX
  -D GFX_DRIVER_INC=\"graphics/LGFX/LGFX_ELECROW_MX.h\"
  -D USE_FULL_DOUBLE_BUFFER
  -D LV_COLOR_FORMAT_NO_RGB_SWAP
  -D VIEW_320x240
  -D DISPLAY_SET_RESOLUTION
  -D USE_PACKET_API
;  -D MAP_FULL_REDRAW

lib_deps =
  ${esp32p4_base.lib_deps}
  ;${device-ui_base.lib_deps}
  https://github.com/meshtastic/device-ui/archive/c6130f00813de06ad9412958f6be8aa4b8154bf5.zip ; until merged
  # renovate: datasource=github-tags depName=LovyanGFX packageName=lovyan03/LovyanGFX
  https://github.com/lovyan03/LovyanGFX/archive/1.2.28.zip
  # renovate: datasource=git-refs depName=ESP8266Audio packageName=https://github.com/meshtastic/ESP8266Audio gitBranch=meshtastic-2.0.0-dacfix
  https://github.com/meshtastic/ESP8266Audio/archive/343024632ee78d6216907b2353fc943a62422d80.zip
  # renovate: datasource=custom.pio depName=ESP8266SAM packageName=earlephilhower/library/ESP8266SAM
  earlephilhower/ESP8266SAM@1.1.0

; twice on purpose: the pre pass patches framework-espidf before the IDF-libs
; rebuild, the post pass re-patches the -libs headers a reinstall just wiped
extra_scripts =
  ${esp32p4_base.extra_scripts}
  pre:extra_scripts/esp32_fatfs_exfat.py
  post:extra_scripts/esp32_fatfs_exfat.py

custom_sdkconfig =
  ${esp32p4_base.custom_sdkconfig}
  ${device-ui_base.custom_sdkconfig}
  CONFIG_SOC_SDMMC_IO_POWER_EXTERNAL=n
  # CONFIG_BT_BLE_50_FEATURES_SUPPORTED is not set
  CONFIG_BT_BLE_42_FEATURES_SUPPORTED=y

  # Force hosted transport/target selection for this env.
  CONFIG_ESP_HOSTED_SDIO_SLOT=1
  CONFIG_ESP_HOSTED_SDIO_4_BIT_BUS=y
  CONFIG_ESP_HOSTED_SDIO_BUS_WIDTH=4
  CONFIG_ESP_HOSTED_SDIO_CLOCK_FREQ_KHZ=40000
  CONFIG_ESP_HOSTED_SDIO_TX_Q_SIZE=20
  CONFIG_ESP_HOSTED_SDIO_RX_Q_SIZE=20
  # CrowPanel SDIO pins
  CONFIG_ESP_HOSTED_PRIV_SDIO_PIN_CMD_SLOT_1=19
  CONFIG_ESP_HOSTED_PRIV_SDIO_PIN_CLK_SLOT_1=18
  CONFIG_ESP_HOSTED_PRIV_SDIO_PIN_D0_SLOT_1=17
  CONFIG_ESP_HOSTED_PRIV_SDIO_PIN_D1_4BIT_BUS_SLOT_1=16
  CONFIG_ESP_HOSTED_PRIV_SDIO_PIN_D2_4BIT_BUS_SLOT_1=15
  CONFIG_ESP_HOSTED_PRIV_SDIO_PIN_D3_4BIT_BUS_SLOT_1=14
  # Also set resolved SDIO pins explicitly so generated sdkconfig does not
  # retain stale template values from framework sdkconfig.
  CONFIG_ESP_HOSTED_SDIO_PIN_CMD=19
  CONFIG_ESP_HOSTED_SDIO_PIN_CLK=18
  CONFIG_ESP_HOSTED_SDIO_PIN_D0=17
  CONFIG_ESP_HOSTED_SDIO_PIN_D1=16
  CONFIG_ESP_HOSTED_SDIO_PIN_D2=15
  CONFIG_ESP_HOSTED_SDIO_PIN_D3=14
  CONFIG_ESP_HOSTED_SDIO_PRIV_PIN_D1_4BIT_BUS=16
  # SDIO Slot 1 via GPIO matrix
  CONFIG_ESP_HOSTED_SDIO_SLOT_1=y
  CONFIG_ESP_HOSTED_SDIO_RESET_ACTIVE_HIGH=y
  CONFIG_ESP_HOSTED_SDIO_GPIO_RESET_SLAVE=7
  CONFIG_ESP_HOSTED_GPIO_SLAVE_RESET_SLAVE=7

  CONFIG_ESP32P4_SELECTS_REV_LESS_V3=y
  CONFIG_ESP32P4_REV_MIN_100=y
  CONFIG_LCD_RGB_RESTART_IN_VSYNC=n

  CONFIG_LCD_DSI_ISR_HANDLER_IN_IRAM=y
  CONFIG_LCD_DSI_ISR_CACHE_SAFE=y