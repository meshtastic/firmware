; LilyGO T-Display-P4 V1.0, AMOLED assembly (RM69A10 568x1232 MIPI-DSI, GT9895 touch). MUI only.
[env:t-display-p4-tft]
custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = T_DISPLAY_P4
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = LILYGO T-Display-P4
custom_meshtastic_tags = LilyGo
custom_meshtastic_requires_dfu = false
custom_meshtastic_partition_scheme = 16MB
custom_meshtastic_has_mui = true

extends = esp32p4_base
board = esp32-p4-evboard
board_level = extra
board_build.partitions = default_16MB.csv
; USB-UART bridge: RTS drives EN and DTR drives GPIO35 (BOOT) directly (SCH p8)
monitor_dtr = 0
monitor_rts = 0

build_src_filter =
  ${esp32p4_base.build_src_filter}
  +<../variants/esp32p4/t-display-p4>

build_flags =
  ${esp32p4_base.build_flags}
  -D T_DISPLAY_P4
  -I variants/esp32p4/t-display-p4
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D ARDUINO_USB_MODE=1
  -D MESHTASTIC_EXCLUDE_WEBSERVER=1
  -D MESHTASTIC_EXCLUDE_CANNEDMESSAGES=1
  -D MESHTASTIC_EXCLUDE_INPUTBROKER=1
  -D MESHTASTIC_EXCLUDE_ACCELEROMETER=1
  -D MESHTASTIC_EXCLUDE_MAGNETOMETER=1
  -D MAX_NUM_NODES=500
  -D MAX_NUM_NODES_VIEW=500
  ; device-ui reaches mesh-pb-constants.h before sdkconfig.h: the P4 is not detectable there and the cache budget assert fires
  -D MESHTASTIC_MEM_CLASS=MEM_CLASS_MEDIUM
  -D HAS_SDCARD
  -D HAS_SD_MMC
  -D BOARD_HAS_1BIT_SDMMC
  -D BOARD_MAX_SDMMC_FREQ=20000
  -D SD_SCLK_PIN=43
  -D SD_MOSI_PIN=44
  -D SD_MISO_PIN=39
  -D SD_MMC_HOST_SLOT=SDMMC_HOST_SLOT_0
  -D HAS_SCREEN=1
  -D HAS_TFT=1
  -D USE_PACKET_API
  -D RAM_SIZE=12288
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_COMP_CONF_INCLUDE_SIMPLE
  -D LV_USE_SYSMON=0
  -D LV_USE_PROFILER=0
  -D LV_USE_PERF_MONITOR=0
  -D LV_USE_MEM_MONITOR=0
  -D LV_USE_LOG=0
  -D USE_LOG_DEBUG
  -D LOG_DEBUG_INC=\"DebugConfiguration.h\"
  -D LGFX_DRIVER_TEMPLATE
  -D LGFX_DRIVER=LGFX_T_DISPLAY_P4
  ; Landscape UI: LGFX_T_DISPLAY_P4.h rotates each LVGL flush into the 568x1232 panel (T_DISPLAY_P4_ROTATION 1 or 3,
  ; T_DISPLAY_P4_UI_SCALE 1 or 2). Portrait: DISPLAY_SIZE=568x1232, VIEW_240x320 and -D USE_FULL_DOUBLE_BUFFER.
  -D LGFX_SCREEN_WIDTH=1232
  -D LGFX_SCREEN_HEIGHT=568
  -D DISPLAY_SIZE=1232x568 ; landscape mode
  -D LV_COLOR_FORMAT_NO_RGB_SWAP
  -D VIEW_320x240
  -D DISPLAY_SET_RESOLUTION
  -D MAP_FULL_REDRAW

lib_deps =
  ${esp32p4_base.lib_deps}
  ${device-ui_base.lib_deps}
  # renovate: datasource=github-tags depName=LovyanGFX packageName=lovyan03/LovyanGFX
  https://github.com/lovyan03/LovyanGFX/archive/1.3.0.zip
  # renovate: datasource=git-refs depName=meshtastic-PCF8xRTC packageName=https://github.com/meshtastic/PCF8xRTC gitBranch=main
  https://github.com/meshtastic/PCF8xRTC/archive/efe1d9c92f79d8413f8ac4e9bdce0c48410600de.zip

extra_scripts =
  ${esp32p4_base.extra_scripts}
  ${device-ui_base.extra_scripts}

custom_sdkconfig =
  ${esp32p4_base.custom_sdkconfig}
  ${device-ui_base.custom_sdkconfig}
  CONFIG_SOC_SDMMC_IO_POWER_EXTERNAL=n
  # CONFIG_BT_BLE_50_FEATURES_SUPPORTED is not set
  CONFIG_BT_BLE_42_FEATURES_SUPPORTED=y
  CONFIG_ESP_HOSTED_SDIO_SLOT_1=y
  CONFIG_ESP_HOSTED_SDIO_1_BIT_BUS=y
  CONFIG_ESP_HOSTED_SDIO_BUS_WIDTH=1
  CONFIG_ESP_HOSTED_SDIO_CLOCK_FREQ_KHZ=10000
  CONFIG_ESP_HOSTED_PRIV_SDIO_PIN_CLK_SLOT_1=18
  CONFIG_ESP_HOSTED_PRIV_SDIO_PIN_CMD_SLOT_1=19
  CONFIG_ESP_HOSTED_PRIV_SDIO_PIN_D0_SLOT_1=14
  CONFIG_ESP_HOSTED_PRIV_SDIO_PIN_D1_1BIT_BUS_SLOT_1=15
  CONFIG_ESP_HOSTED_SDIO_RESET_ACTIVE_HIGH=y
  CONFIG_ESP_HOSTED_SDIO_GPIO_RESET_SLAVE=31
  CONFIG_ESP_HOSTED_GPIO_SLAVE_RESET_SLAVE=31
  CONFIG_ESP_HOSTED_TRANSPORT_RESTART_ON_FAILURE=n
  CONFIG_LCD_DSI_ISR_HANDLER_IN_IRAM=y
  CONFIG_LCD_DSI_ISR_CACHE_SAFE=y
