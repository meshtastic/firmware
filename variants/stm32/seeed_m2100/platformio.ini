; Seeed SenseCAP S2100 data logger, Meshtastic edition: RS485 Modbus sensor -> telemetry
[env:seeed-m2100]
extends = stm32_base
board = lora_e5_dev_board
board_level = extra
board_upload.maximum_size = 247808 ; reserve the last 14KB for filesystem (reduced from 20KB in LittleFS.cpp)
build_flags =
  ${stm32_base.build_flags}
  -Ivariants/stm32/seeed_m2100
  -DPRIVATE_HW
  -DSERIAL_UART_INSTANCE=1
  -DPIN_SERIAL_RX=PB7
  -DPIN_SERIAL_TX=PB6
  ; TODO(S2100 schematic): RS485 UART pins are Wio-E5 dev board placeholders
  -DENABLE_HWSERIAL2
  -DPIN_SERIAL2_TX=PA2
  -DPIN_SERIAL2_RX=PA3
  -DMESHTASTIC_EXCLUDE_GPS=1
  -DMESHTASTIC_EXCLUDE_I2C=1
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR=1
  -DMESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR=1

upload_port = stlink
