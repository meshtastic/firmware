; Crypto test vectors on hardware: pio test -e crypto-stm32wl -f test_crypto_vectors
; Nucleo-WL55JC: Unity output goes to Serial, the ST-Link virtual COM port.
[env:crypto-stm32wl]
extends = stm32_base
board = nucleo_wl55jc
board_level = extra
board_upload.maximum_size = 247808
build_flags =
  ${stm32_base.build_flags}
  -Ivariants/stm32/nucleo_wl55jc
  -DPRIVATE_HW
  -D CRYPTO_TEST_MINIMAL
build_src_filter =
  -<*>
  +<mesh/CryptoEngine.cpp>
  +<mesh/aes-ccm.cpp>
  +<mesh/HardwareRNG.cpp>
  +<meshUtils.cpp>
  +<concurrency/Lock.cpp>
upload_port = stlink
