; Crypto test vectors on hardware: pio test -e crypto-stm32wl -f test_crypto_vectors
; Nucleo-WL55JC: Unity output goes to Serial, the ST-Link virtual COM port.
[env:crypto-stm32wl]
extends = stm32_base
board = nucleo_wl55jc
board_level = extra
board_upload.maximum_size = 247808
build_flags =
  ${stm32_base.build_flags}
  -Ivariants/stm32/nucleo_wl55jc
  -DPRIVATE_HW
  -D CRYPTO_TEST_MINIMAL
build_src_filter =
  -<*>
  +<crypto/>
  +<mesh/HardwareRNG.cpp>
  +<meshUtils.cpp>
  +<mesh/CryptoEngine.cpp>
  +<concurrency/Lock.cpp>
  +<concurrency/LockGuard.cpp>
upload_port = stlink
test_filter =
  test_crypto_vectors

; Backend suite only: no CryptoEngine.
[env:crypto-stm32wl-backend]
extends = env:crypto-stm32wl
; LTO would bind the calls inside src/crypto before --wrap applies, so the suite would count nothing.
build_unflags = -flto
; --wrap lets the suite count the backend each public call really reached.
build_flags = ${env:crypto-stm32wl.build_flags}
  -D CRYPTO_TEST_WRAP_DISPATCH
  -Wl,--wrap=crypto_stm32wl_aes_ctr
  -Wl,--wrap=crypto_stm32wl_aes_ccm_seal
  -Wl,--wrap=crypto_stm32wl_aes_ccm_open
  -Wl,--wrap=crypto_lib_aes_ctr
  -Wl,--wrap=crypto_lib_aes_ccm_seal
  -Wl,--wrap=crypto_lib_aes_ccm_open
  -Wl,--wrap=crypto_lib_sha256
  -Wl,--wrap=crypto_lib_sha512
  -Wl,--wrap=crypto_lib_hmac_sha256
  -Wl,--wrap=crypto_lib_x25519
build_src_filter =
  -<*>
  +<crypto/>
  +<mesh/HardwareRNG.cpp>
  +<concurrency/Lock.cpp>
  +<concurrency/LockGuard.cpp>
test_filter =
  test_crypto_backend
