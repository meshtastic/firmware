; Crypto test vectors on hardware: pio test -e crypto-esp32 -f test_crypto_vectors
[env:crypto-esp32]
extends = esp32_base
board = esp32doit-devkit-v1
board_level = extra
build_flags =
  ${esp32_base.build_flags}
  -D DIY_V1
  -D EBYTE_E22
  -I variants/esp32/diy/v1
  -D CRYPTO_TEST_MINIMAL
build_src_filter =
  -<*>
  +<crypto/>
  +<mesh/CryptoEngine.cpp>
  +<mesh/aes-ccm.cpp>
  +<mesh/HardwareRNG.cpp>
  +<platform/esp32/ESP32CryptoEngine.cpp>
  +<platform/esp32/IramMemcpy.c>
  +<platform/esp32/IramMemset.c>
  +<meshUtils.cpp>
  +<concurrency/Lock.cpp>

; Backend suite only: no CryptoEngine. Link not build-verified.
[env:crypto-esp32-backend]
extends = env:crypto-esp32
build_src_filter =
  -<*>
  +<crypto/>
  +<mesh/HardwareRNG.cpp>
  +<concurrency/Lock.cpp>
  +<concurrency/LockGuard.cpp>
  +<platform/esp32/IramMemcpy.c>
  +<platform/esp32/IramMemset.c>
test_filter =
  test_crypto_backend
