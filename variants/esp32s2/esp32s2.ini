[esp32s2_base]
extends = esp32_common
custom_esp32_kind = esp32s2

build_src_filter = 
 ${esp32_common.build_src_filter} - <libpax/> -<nimble/> -<mesh/raspihttp>

monitor_speed = 115200

build_flags =
  ${esp32_common.build_flags}
  -DHAS_BLUETOOTH=0
  -DMESHTASTIC_EXCLUDE_PAXCOUNTER
  -DMESHTASTIC_EXCLUDE_BLUETOOTH
  -mtext-section-literals

custom_sdkconfig =
  ${esp32_common.custom_sdkconfig}
  ; ESP32-S2 has no USB-Serial-JTAG peripheral (issue #10799)
 CONFIG_TINYUSB_ENABLED=y
  CONFIG_TINYUSB_CDC_ENABLED=y

lib_ignore = 
  ${esp32_common.lib_ignore}
  NimBLE-Arduino
  libpax

lib_deps =
  ${esp32_common.lib_deps}
  # renovate: datasource=git-refs depName=meshtastic/codec2 packageName=https://github.com/meshtastic/codec2 gitBranch=main
  https://github.com/meshtastic/codec2/archive/3e347e0b70fc72af9357fbbd32b10a125321d6c5.zip
  