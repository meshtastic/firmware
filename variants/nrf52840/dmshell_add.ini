; DMShell loss bench, add-one-in run on claude/dmshell-final. The baseline is develop's behaviour: the -base env has
; every quantum's switch off, and each -q* env adds one back. Server and client run the arm of the same name, so a run is
; a matched pair. Some quanta cannot be added alone - the note on each env says what it carries and which arm to compare
; it against. DMSHELL_TEST_PEER is the server's node number. Not built by CI.

; every quantum off: develop's behaviour plus the harness
[env:rak_wismesh_pocket-dmshell-add]
extends = env:rak_wismesh_pocket
board_level = extra
build_flags = ${env:rak_wismesh_pocket.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DRADIOLIB_GODMODE=1
  -DMESHTASTIC_BENCH_INSTRUMENTATION=1
  -DMESHTASTIC_EXCLUDE_READOUT_TASK=1
  -DSX126X_RX_REARM_AT_TX_DONE=0
  -DMESHTASTIC_RX_DEFER_FOR_TX_MS=0
  -DMESHTASTIC_REARM_HOLD_FIX=0

; Q3 readout task (with the chip's continuous-RX resume)
[env:rak_wismesh_pocket-dmshell-add-q3]
extends = env:rak_wismesh_pocket
board_level = extra
build_flags = ${env:rak_wismesh_pocket.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DRADIOLIB_GODMODE=1
  -DMESHTASTIC_BENCH_INSTRUMENTATION=1
  -DSX126X_RX_REARM_AT_TX_DONE=0
  -DMESHTASTIC_RX_DEFER_FOR_TX_MS=0
  -DMESHTASTIC_REARM_HOLD_FIX=0

; Q4 SX126x RX re-arm at TX_DONE, in the ISR
[env:rak_wismesh_pocket-dmshell-add-q4]
extends = env:rak_wismesh_pocket
board_level = extra
build_flags = ${env:rak_wismesh_pocket.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DRADIOLIB_GODMODE=1
  -DMESHTASTIC_BENCH_INSTRUMENTATION=1
  -DMESHTASTIC_EXCLUDE_READOUT_TASK=1
  -DMESHTASTIC_RX_DEFER_FOR_TX_MS=0
  -DMESHTASTIC_REARM_HOLD_FIX=0

; Q10 slot parity stamped on the packet
[env:rak_wismesh_pocket-dmshell-add-q10]
extends = env:rak_wismesh_pocket
board_level = extra
build_flags = ${env:rak_wismesh_pocket.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DRADIOLIB_GODMODE=1
  -DMESHTASTIC_BENCH_INSTRUMENTATION=1
  -DMESHTASTIC_EXCLUDE_READOUT_TASK=1
  -DSX126X_RX_REARM_AT_TX_DONE=0
  -DMESHTASTIC_RX_DEFER_FOR_TX_MS=0
  -DMESHTASTIC_REARM_HOLD_FIX=0
  -DDMSHELL_TEST_SLOT_PARITY=1

; Q11 holds RX for a due slotted TX, so it needs Q10's grid: Q10 + Q11, compare against the q10 arm
