; DMShell loss bench r116, arm D: develop, nothing added but the test client's peer.
; Run against native-r116-d, built from the same branch, with DMSHELL_SLOT_PARITY unset. Not built by CI.

[env:rak_wismesh_pocket-r116-d]
extends = env:rak_wismesh_pocket
board_level = extra
build_flags = ${env:rak_wismesh_pocket.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2

[env:tracker-t1000-e-r116-d]
extends = env:tracker-t1000-e
board_level = extra
build_flags = ${env:tracker-t1000-e.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2

[env:seeed_mesh_tracker_X1-r116-d]
