; DMShell loss bench r116, arm P: #12125 (preamble hold sized for CR 4/8, CAD may settle an old bare preamble), nothing else added.
; Run against native-r116-p, built from the same branch, with DMSHELL_SLOT_PARITY unset. Not built by CI.

[env:rak_wismesh_pocket-r116-p]
extends = env:rak_wismesh_pocket
board_level = extra
build_flags = ${env:rak_wismesh_pocket.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2

[env:tracker-t1000-e-r116-p]
extends = env:tracker-t1000-e
board_level = extra
build_flags = ${env:tracker-t1000-e.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2

[env:seeed_mesh_tracker_X1-r116-p]
extends = env:seeed_mesh_tracker_X1
board_level = extra
build_flags = ${env:seeed_mesh_tracker_X1.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2

; Probe envs, not scored: LOG_TRACE on, so the hold line 'Preamble seen, cleared, holding TX' prints.

[env:rak_wismesh_pocket-r116-pt]
extends = env:rak_wismesh_pocket
board_level = extra
build_flags = ${env:rak_wismesh_pocket.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DMESHTASTIC_TRACE_LOGGING=1

[env:tracker-t1000-e-r116-pt]
extends = env:tracker-t1000-e
board_level = extra
build_flags = ${env:tracker-t1000-e.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DMESHTASTIC_TRACE_LOGGING=1

[env:seeed_mesh_tracker_X1-r116-pt]
extends = env:seeed_mesh_tracker_X1
board_level = extra
build_flags = ${env:seeed_mesh_tracker_X1.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DMESHTASTIC_TRACE_LOGGING=1
