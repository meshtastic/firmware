; MeshSmith Photon-1W nRF52 (Seeed XIAO nRF52840 + Ebyte E22-900M30S)
; Photon-specific radio pin map and conservative PA drive limit.
[env:meshsmith_photon_nrf52]
custom_meshtastic_hw_model = 88
custom_meshtastic_hw_model_slug = XIAO_NRF52_KIT
custom_meshtastic_architecture = nrf52840
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = MeshSmith Photon-1W nRF52 (TEST)
custom_meshtastic_tags = MeshSmith,DIY

extends = nrf52840_base
board_level = extra
board = xiao_ble_sense
build_flags = ${nrf52840_base.build_flags}
  -I variants/nrf52840/diy/meshsmith_photon_nrf52
  -I src/platform/nrf52/softdevice
  -I src/platform/nrf52/softdevice/nrf52
  -DSEEED_XIAO_NRF52840_KIT
  -DMESHSMITH_PHOTON_NRF52
  -DCONFIG_NFCT_PINS_AS_GPIOS=1
board_build.ldscript = src/platform/nrf52/nrf52840_s140_v7.ld
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/diy/meshsmith_photon_nrf52>
debug_tool = jlink
