; =============================================================================
; eink-ra01s-gp02  nRF52840 Build Environment
; =============================================================================
; Hardware:
;   MCU     : nRF52840 QFN48 (Normal Voltage, LDO only — no external DCDC inductor)
;   LoRa    : Ai-Thinker RA-01S (SX1262) — active
;   GPS     : Ai-Thinker GP-02 (L76K compatible) — active
;   EInk    : GDEM0213B74 (SSD1680, 2.13", 250×122) — GxEPD2 — active
;   Boot    : Adafruit_nRF52_Bootloader v0.6.x, S140 v6.1.1
;   App     : 0x26000 (ldscript: nrf52840_s140_v6.ld)
; =============================================================================
;
; Hardware pin definitions:   variant.h         (pure hardware, SSOT)
; Software configuration:     config/*.h         (module settings, calibration, UI)
;   config.h → aggregator
;   led.h, btn.h             → Meshtastic role mappings
;   lora.h                   → radio driver selection & SX126X_* aliases
;   gps.h                    → GNSS PIN_GPS_* aliases
;   display.h                → E-Ink model, rotation, refresh tuning
;   battery.h                → ADC calibration, OCV curve
;   rtc.h                    → PCF8563 address
;   nicheGraphics.h          → InkHUD UI applets & initialization
;   GpioteOverride.cpp       → GPIOTE PORT-event ISR (replaces WInterrupts.c)
; =============================================================================

[env:eink-ra01s-gp02]
extends = nrf52840_base

; -----------------------------------------------------------------------------
; Board JSON (boards/eink-ra01s-gp02.json):
;   ldscript = nrf52840_s140_v6.ld  → app ORIGIN = 0x26000
;   S140 v6.1.1, softdevice sd_fwid = 0x00B6
; -----------------------------------------------------------------------------
board = eink-ra01s-gp02

; -----------------------------------------------------------------------------
; Board metadata
; -----------------------------------------------------------------------------
custom_meshtastic_architecture = nrf52840
custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = PRIVATE_HW
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = E-Ink RA-01S GP-02 (DIY)
custom_meshtastic_tags = DIY
custom_meshtastic_requires_dfu = true
board_level = pr

; -----------------------------------------------------------------------------
; Debugger
; -----------------------------------------------------------------------------
debug_tool = jlink

; -----------------------------------------------------------------------------
; Build flags
; Software configuration macros are in config/*.h (included via variant.h).
; USE_EINK / USE_EINK_DYNAMICDISPLAY remain -D flags because the external
; GxEPD2 library never includes configuration.h / variant.h.
; -----------------------------------------------------------------------------
build_flags =
    ${nrf52840_base.build_flags}
    -I variants/nrf52840/diy/eink-ra01s-gp02
    -I variants/nrf52840/diy/eink-ra01s-gp02/config
    -I variants/nrf52840/diy/eink-ra01s-gp02/src/input
    -I variants/nrf52840/diy/eink-ra01s-gp02/src/InkHUD
    -D EINK_RA01S_GP02

    ; --- E-Ink dynamic refresh control ---
    ; These must be global -D flags: the external GxEPD2 library
    ; (GxEPD2_EPD.cpp / GxEPD2_BW.h) uses them but never includes
    ; configuration.h.  All other EINK_* tuning macros live in config/display.h.
    -D USE_EINK
    -D USE_EINK_DYNAMICDISPLAY

; -----------------------------------------------------------------------------
; Source filter: inherit nrf52_base exclusions, add variant sources (recursive)
; -----------------------------------------------------------------------------
build_src_filter =
    ${nrf52_base.build_src_filter}
    -<mqtt/>
    +<../variants/nrf52840/diy/eink-ra01s-gp02/**>

; -----------------------------------------------------------------------------
; Library dependencies
; -----------------------------------------------------------------------------
lib_deps =
    ${nrf52840_base.lib_deps}
    # renovate: datasource=git-refs depName=meshtastic-PCF8xRTC packageName=https://github.com/meshtastic/PCF8xRTC gitBranch=main
    https://github.com/meshtastic/PCF8xRTC/archive/efe1d9c92f79d8413f8ac4e9bdce0c48410600de.zip
    # renovate: datasource=git-refs depName=meshtastic-GxEPD2 packageName=https://github.com/meshtastic/GxEPD2 gitBranch=master
    https://github.com/meshtastic/GxEPD2/archive/c7eb4c3c167cf396ef4f541cc5d4c6aa42f3c46b.zip

; -----------------------------------------------------------------------------
; Upload
; UF2 via USB (nrfutil, 1200bps touch) — primary method for field updates.
; JLink SWD also supported for factory programming and debugging.
;
; boards.json -> nrf52840_s140_v6.ld : sets app ORIGIN = 0x26000, so nrfutil flash addr is 0x26000.
; -----------------------------------------------------------------------------
;upload_protocol = jlink
; upload_port    = /dev/ttyACM0
; upload_flags =
;     -SelectEmuBySN
;     123456789   ; Select Emu By SN

; -----------------------------------------------------------------------------
; Monitor (USB CDC serial from SoftDevice log output)
; -----------------------------------------------------------------------------
; monitor_speed = 115200

; =============================================================================
; eink-ra01s-gp02-inkhud  —  InkHUD UI variant
; =============================================================================
; Extends eink-ra01s-gp02 (same board / debugger / upload).
; Only the differences are listed here.
; =============================================================================

[env:eink-ra01s-gp02-inkhud]
; Follow the t-echo-inkhud pattern: extend nrf52840_base + inkhud independently,
; never inherit the Screen variant. This avoids USE_EINK / GxEPD2 contamination.
extends = nrf52840_base, inkhud
board = eink-ra01s-gp02
board_level = pr
debug_tool = jlink

build_flags =
    ${nrf52840_base.build_flags}
    ${inkhud.build_flags}
    -I variants/nrf52840/diy/eink-ra01s-gp02
    -I variants/nrf52840/diy/eink-ra01s-gp02/config
    -I variants/nrf52840/diy/eink-ra01s-gp02/src/input
    -I variants/nrf52840/diy/eink-ra01s-gp02/src/InkHUD
    -D EINK_RA01S_GP02
    -D EINK_RA01S_GP02_INKHUD
    ; InputBroker + HAS_BUTTON intentionally kept: SixKeyNavInput + Fn combos need them.
    ; Note: -U requires no space between flag and macro name in PlatformIO build_flags.
    -UMESHTASTIC_EXCLUDE_INPUTBROKER
    ; inkhud sets -DHAS_BUTTON=0; undefine it so peripherals.h can set HAS_BUTTON=1 cleanly.
    -UHAS_BUTTON

build_src_filter =
    ${nrf52_base.build_src_filter}
    ${inkhud.build_src_filter}
    +<../variants/nrf52840/diy/eink-ra01s-gp02/**>
    -<motion/>

lib_deps =
    ${inkhud.lib_deps}
    ${nrf52840_base.lib_deps}
    # renovate: datasource=git-refs depName=meshtastic-PCF8xRTC packageName=https://github.com/meshtastic/PCF8xRTC gitBranch=main
    https://github.com/meshtastic/PCF8xRTC/archive/efe1d9c92f79d8413f8ac4e9bdce0c48410600de.zip
    ; GxEPD2 NOT included: InkHUD uses graphics/niche/Drivers/EInk/GDEY0213B74
