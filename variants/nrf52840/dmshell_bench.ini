; DMShell loss bench: each client board's live configuration, so the bench and the branch build the same image.
; DMSHELL_TEST_PEER is the server's node number. Not built by CI.
[dmshell_bench]
build_flags =
  -DMESHTASTIC_RX_READOUT_TASK
  -DMESHTASTIC_TX_SLOT_PARITY=1
  -DMESHTASTIC_RX_DEFER_FOR_TX_MS=30
  -DRADIOLIB_GODMODE=1
  -DDMSHELL_TEST_PEER=0x999312f2
  -DMESHTASTIC_LOG_RECORD_MILLIS
  -DMESHTASTIC_LOG_RADIO_EDGES
  -DMESHTASTIC_TX_TIMELINE

[env:tracker-t1000-e-dmshell-bench]
extends = env:tracker-t1000-e
board_level = extra
build_flags = ${env:tracker-t1000-e.build_flags}
  ${dmshell_bench.build_flags}
  -DLR11X0_TX_PRESTAGE
  -DLR11X0_TCXO_DELAY_US=1000
  -DLR11X0_RX_REARM_AT_TX_DONE
  -DLR11X0_CAD_EXIT_LBT
  -DLR11X0_RESUME_CONTINUOUS_RX
  -DLR11X0_TX_STAGE_EARLY
  -DLR11X0_CAD_SLIM
  -DLR11X0_STANDBY_XOSC

; The X1 builds against RadioLib 7.8.1 plus #1883 (prestageTransmit), for LR2021_PRESTAGE_UPSTREAM, plus the LRxxxx bus
; lock. #1882's LR2021 CAD exit-mode constants are not in that commit; the firmware falls back to its own values, which
; are the same numbers #1882 uses (RX 0x01, LBT 0x10), so the chip sees no difference from rounds 61-70.
; The lock's HAL hooks are no-ops unless -DMESHTASTIC_SPI_CMD_ATOMIC is added, which this env does not set: the
; WRONG_MODEM retry already covers the loss, and rounds 69-70 showed the two are redundant on it.
[env:seeed_mesh_tracker_X1-dmshell-bench]
extends = env:seeed_mesh_tracker_X1
board_level = extra
build_flags = ${env:seeed_mesh_tracker_X1.build_flags}
  ${dmshell_bench.build_flags}
  -DLR2021_TX_PRESTAGE
  -DLR2021_PRESTAGE_UPSTREAM
  -DLR2021_CAD_EXIT_LBT
  -DLR2021_RESUME_CONTINUOUS_RX
  -DLR2021_RX_REARM_AT_TX_DONE
lib_deps =
  ${arduino_base.lib_deps}
  https://github.com/jp-bennett/RadioLib/archive/3d2c32bfb82014ac0a538a01b25f8f8feec2abc5.zip
  https://github.com/meshtastic/Crypto/archive/1c817c2f27aa4593e07d0f7e13b3dbf8d980bcae.zip
  ${environmental_base.lib_deps}
  ${environmental_extra.lib_deps}
  https://github.com/Kongduino/Adafruit_nRFCrypto/archive/8cde7189b5ead9dcd49f72601b43b969c0bbc06e.zip
  adafruit/Adafruit DRV2605 Library@1.2.4

; The WisMesh Pocket is a RAK4631, so it takes the flags the RAK measured: the 1 ms TCXO start-up, XOSC standby, RX
; re-arm in the TX_DONE interrupt, and continuous RX resume.
[env:rak_wismesh_pocket-dmshell-bench]
extends = env:rak_wismesh_pocket
board_level = extra
build_flags = ${env:rak_wismesh_pocket.build_flags}
  ${dmshell_bench.build_flags}
  -DSX126X_TCXO_DELAY_US=1000
  -DSX126X_STANDBY_XOSC
  -DSX126X_RX_REARM_AT_TX_DONE
  -DSX126X_RESUME_CONTINUOUS_RX
  ; Logging only: names any thread that holds the main loop 10 ms or more, against the TX timeline's rx>thr.
  -DMESHTASTIC_SLOW_THREAD_MS=10

; How much does the board's TX prestage buy? These drop it and nothing else. TX_STAGE_EARLY is a variant of
; prestage, not an independent mechanism -- it writes the payload during the backoff instead of in the scan's
; standby, and its own comment says it needs TX_PRESTAGE -- so it goes too. The server's prestage is a
; separate axis, toggled at run time with MESHTASTIC_TX_PRESTAGE=0 against CH341_TX_PRESTAGE_DEFAULT.
[env:tracker-t1000-e-dmshell-bench-noprestage]
extends = env:tracker-t1000-e
board_level = extra
build_flags = ${env:tracker-t1000-e.build_flags}
  ${dmshell_bench.build_flags}
  -DLR11X0_TCXO_DELAY_US=1000
  -DLR11X0_RX_REARM_AT_TX_DONE
  -DLR11X0_CAD_EXIT_LBT
  -DLR11X0_RESUME_CONTINUOUS_RX
  -DLR11X0_CAD_SLIM
  -DLR11X0_STANDBY_XOSC

[env:seeed_mesh_tracker_X1-dmshell-bench-noprestage]
extends = env:seeed_mesh_tracker_X1
board_level = extra
build_flags = ${env:seeed_mesh_tracker_X1.build_flags}
  ${dmshell_bench.build_flags}
  -DLR2021_CAD_EXIT_LBT
  -DLR2021_RESUME_CONTINUOUS_RX
  -DLR2021_RX_REARM_AT_TX_DONE
lib_deps =
  ${arduino_base.lib_deps}
  https://github.com/jp-bennett/RadioLib/archive/3d2c32bfb82014ac0a538a01b25f8f8feec2abc5.zip
  https://github.com/meshtastic/Crypto/archive/1c817c2f27aa4593e07d0f7e13b3dbf8d980bcae.zip
  ${environmental_base.lib_deps}
  ${environmental_extra.lib_deps}
  https://github.com/Kongduino/Adafruit_nRFCrypto/archive/8cde7189b5ead9dcd49f72601b43b969c0bbc06e.zip
  adafruit/Adafruit DRV2605 Library@1.2.4

; Diagnostic only: rak_wismesh_pocket-dmshell-bench with the same 1 ms chip-state task as
; tbeam-s3-core-dmshell-bench-sampler.
[env:rak_wismesh_pocket-dmshell-bench-sampler]
extends = env:rak_wismesh_pocket-dmshell-bench
board_level = extra
build_flags = ${env:rak_wismesh_pocket-dmshell-bench.build_flags}
  -DSX126X_STATE_SAMPLER_MS=1
  -DSX126X_STATE_SAMPLER_TASK

; The RAK's live configuration plus the slot parity gate (see tbeam-s3-core-dmshell-bench-gate)
[env:rak_wismesh_pocket-dmshell-bench-gate]
extends = env:rak_wismesh_pocket-dmshell-bench
board_level = extra
build_flags = ${env:rak_wismesh_pocket-dmshell-bench.build_flags}
  -DMESHTASTIC_TX_SLOT_GATE_MS=1

; The RAK's live configuration with the radio thread in its own task (see tbeam-s3-core-dmshell-bench-task)
[env:rak_wismesh_pocket-dmshell-bench-task]
extends = env:rak_wismesh_pocket-dmshell-bench
board_level = extra
build_flags = ${env:rak_wismesh_pocket-dmshell-bench.build_flags}
  -DMESHTASTIC_RADIO_TASK

; rak_wismesh_pocket-dmshell-bench-gate in the radio task
[env:rak_wismesh_pocket-dmshell-bench-task-gate]
extends = env:rak_wismesh_pocket-dmshell-bench
board_level = extra
build_flags = ${env:rak_wismesh_pocket-dmshell-bench-gate.build_flags}
  -DMESHTASTIC_RADIO_TASK

; rak_wismesh_pocket-dmshell-bench-task-gate with measured leads (see tbeam-s3-core-dmshell-bench-task-lead)
[env:rak_wismesh_pocket-dmshell-bench-task-lead]
extends = env:rak_wismesh_pocket-dmshell-bench
board_level = extra
build_flags = ${env:rak_wismesh_pocket-dmshell-bench-task-gate.build_flags}
  -DMESHTASTIC_TX_SLOT_LEAD
