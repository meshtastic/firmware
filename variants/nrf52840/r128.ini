; DMShell loss bench r121: the RAK WisMesh Pocket as a background traffic source, with the fixed-timeline generator.
; Longer frames (120-220 bytes) than r119, so fewer sends carry the same airtime and the per-send cost caps it later.
; The measured pair reuses r116's images and servers. Not built by CI.

[env:rak_wismesh_pocket-r121-g0]
extends = env:rak_wismesh_pocket
board_level = extra
build_flags = ${env:rak_wismesh_pocket.build_flags}
  -DBENCH_TRAFFIC_LOAD_PCT=0
  -DBENCH_TRAFFIC_MIN_LEN=120
  -DBENCH_TRAFFIC_MAX_LEN=220

[env:rak_wismesh_pocket-r121-g10]
extends = env:rak_wismesh_pocket
board_level = extra
build_flags = ${env:rak_wismesh_pocket.build_flags}
  -DBENCH_TRAFFIC_LOAD_PCT=10
  -DBENCH_TRAFFIC_MIN_LEN=120
  -DBENCH_TRAFFIC_MAX_LEN=220

[env:rak_wismesh_pocket-r121-g25]
extends = env:rak_wismesh_pocket
board_level = extra
build_flags = ${env:rak_wismesh_pocket.build_flags}
  -DBENCH_TRAFFIC_LOAD_PCT=25
  -DBENCH_TRAFFIC_MIN_LEN=120
  -DBENCH_TRAFFIC_MAX_LEN=220

; The measured client, arm D (develop): the on-board DMShell test client aimed at the CH341 server.

[env:seeed_mesh_tracker_X1-r128-d]
extends = env:seeed_mesh_tracker_X1
board_level = extra
build_flags = ${env:seeed_mesh_tracker_X1.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2

; Arm P: #12125 merged onto the same develop, nothing else.

[env:seeed_mesh_tracker_X1-r128-p]
extends = env:seeed_mesh_tracker_X1
board_level = extra
build_flags = ${env:seeed_mesh_tracker_X1.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
