; DMShell loss bench r112, arms A and Anp, on claude/dmshell-on-develop: develop plus #12019, #12020 and every
; unlanded quantum. -a is the whole stack with slot parity; -anp is the same build with the parity flag taken off, so
; the gate and the lead have nothing to key on. Pair -a with native-r112-a started with DMSHELL_SLOT_PARITY=even, and
; -anp with the same binary started with DMSHELL_SLOT_PARITY unset. DMSHELL_TEST_PEER is the server's node number.
;
; No MESHTASTIC_BENCH_INSTRUMENTATION here, unlike the -dmshell-next envs: arms R and D cannot have it, and its log
; volume is not something to put on one side of a four-way comparison. Use -dmshell-next when the diagnostics are
; wanted. RADIOLIB_GODMODE stays: the LR11x0 and LR2021 quanta #error without it.
; Not built by CI.

[env:rak_wismesh_pocket-r112-a]
extends = env:rak_wismesh_pocket
board_level = extra
build_flags = ${env:rak_wismesh_pocket.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DRADIOLIB_GODMODE=1
  -DDMSHELL_TEST_SLOT_PARITY=1
  -DMESHTASTIC_RADIO_TASK
  -DMESHTASTIC_TX_SLOT_GATE_MS=1
  -DMESHTASTIC_TX_SLOT_LEAD
  -DMESHTASTIC_TX_SLOT_SET_TX_AT_MS=3

[env:rak_wismesh_pocket-r112-anp]
extends = env:rak_wismesh_pocket
board_level = extra
build_flags = ${env:rak_wismesh_pocket.build_flags}
