; DMShell loss bench r112, arm R: 2.8.1's radio path with DMShell (#11976) and the on-board test client, the Portduino
; lock (#12024) and the host admin keys (#12056) - nothing else. No slot parity: 2.8.1's protobufs have no
; MeshPacket.slot_parity, so the client cannot stamp one. Run against native-r112-r with DMSHELL_SLOT_PARITY unset.
; DMSHELL_TEST_PEER is the server's node number. Not built by CI.

[env:rak_wismesh_pocket-r112-r]
extends = env:rak_wismesh_pocket
board_level = extra
build_flags = ${env:rak_wismesh_pocket.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2

[env:tracker-t1000-e-r112-r]
extends = env:tracker-t1000-e
board_level = extra
build_flags = ${env:tracker-t1000-e.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2

[env:seeed_mesh_tracker_X1-r112-r]
extends = env:seeed_mesh_tracker_X1
board_level = extra
build_flags = ${env:seeed_mesh_tracker_X1.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
