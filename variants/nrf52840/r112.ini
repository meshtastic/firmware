; DMShell loss bench r112, arm D: current develop, nothing added but the test client's peer. develop has no slot parity
; (#12020 is still open), so this arm runs parity-off by construction. Run against native-r112-d with
; DMSHELL_SLOT_PARITY unset. DMSHELL_TEST_PEER is the server's node number. Not built by CI.

[env:rak_wismesh_pocket-r112-d]
extends = env:rak_wismesh_pocket
board_level = extra
build_flags = ${env:rak_wismesh_pocket.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2

[env:tracker-t1000-e-r112-d]
extends = env:tracker-t1000-e
board_level = extra
build_flags = ${env:tracker-t1000-e.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2

[env:seeed_mesh_tracker_X1-r112-d]
extends = env:seeed_mesh_tracker_X1
board_level = extra
build_flags = ${env:seeed_mesh_tracker_X1.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
