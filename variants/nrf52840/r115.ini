; DMShell loss bench r115, arm D: develop, nothing added but the test client's peer.
; Run against r112's native-r112-d server image with DMSHELL_SLOT_PARITY unset. Not built by CI.

[env:tracker-t1000-e-r115-d]
extends = env:tracker-t1000-e
board_level = extra
build_flags = ${env:tracker-t1000-e.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2

[env:seeed_mesh_tracker_X1-r115-d]
