; Heltec Mesh Pocket V2 nRF52840/SX1262 device
[env:heltec-mesh-pocket-v2]
custom_meshtastic_hw_model = 152
custom_meshtastic_hw_model_slug = HELTEC_MESH_POCKET_V2
custom_meshtastic_architecture = nrf52840
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Heltec Mesh Pocket V2
custom_meshtastic_tags = Heltec
custom_meshtastic_key = heltec_mesh_pocket_v2

extends = nrf52840_base
board = heltec_mesh_pocket_v2
board_level = release
debug_tool = jlink

build_flags = ${nrf52840_base.build_flags}
  -UOLEDDISPLAY_REDUCE_MEMORY ; TFTDisplay.cpp needs buffer_back for dirty-window diffing
  -Ivariants/nrf52840/heltec_mesh_pocket_v2
  -DHELTEC_MESH_POCKET_V2
  -DUSE_TFTDISPLAY=1

build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/heltec_mesh_pocket_v2>
lib_deps =
  ${nrf52840_base.lib_deps}
  https://github.com/Quency-D/heltec-meshpocket-v2-power/archive/c39d632c0227e20e2d5a41b2de857ea0ced1fd60.zip
  # renovate: datasource=custom.pio depName=moononournation-Arduino_GFX packageName=moononournation/library/GFX Library for Arduino
  moononournation/GFX Library for Arduino@1.6.9
