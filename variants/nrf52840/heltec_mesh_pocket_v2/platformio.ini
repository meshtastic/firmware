; Heltec MeshPocket V2 (magnetic power bank) nRF52840/SX1262 device
[env:heltec-mesh-pocket-v2]
custom_meshtastic_hw_model = 152
custom_meshtastic_hw_model_slug = HELTEC_MESH_POCKET_V2
custom_meshtastic_architecture = nrf52840
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = Heltec Mesh Pocket V2
custom_meshtastic_tags = Heltec

extends = nrf52840_base
board_level = extra
board = heltec_mesh_pocket_v2
debug_tool = jlink

build_flags = ${nrf52840_base.build_flags}
  -UOLEDDISPLAY_REDUCE_MEMORY ; TFTDisplay.cpp needs the lib's buffer_back for dirty-window diffing
  -Ivariants/nrf52840/heltec_mesh_pocket_v2
  -DHELTEC_MESH_POCKET_V2
  -DCONFIG_NFCT_PINS_AS_GPIOS=1 ; P0.09 / P0.10 drive the display rail and read GNSS PPS
  -DUSE_TFTDISPLAY
  -DUSER_SETUP_LOADED
  -DST7735_DRIVER
  -DST7735_REDTAB160x80
  -D TFT_SPI_PORT=SPI1
  -D TFT_CS=ST7735_CS
  -D TFT_DC=ST7735_RS
  -D TFT_RST=ST7735_RESET
  -D TFT_BL=ST7735_BL
  -D TFT_BACKLIGHT_ON=HIGH

build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/heltec_mesh_pocket_v2>
lib_deps =
  ${nrf52840_base.lib_deps}
  bodmer/TFT_eSPI@2.5.43 ; renovate: datasource=platformio-registry depName=bodmer/TFT_eSPI
