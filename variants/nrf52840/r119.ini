; DMShell loss bench r119: the RAK WisMesh Pocket as a background traffic source, not a DMShell client.
; It broadcasts random-length frames (hop limit 0) at Poisson intervals sized to the stated share of airtime.
; The measured pair reuses r116's images and servers. Not built by CI.

[env:rak_wismesh_pocket-r119-g0]
extends = env:rak_wismesh_pocket
board_level = extra
build_flags = ${env:rak_wismesh_pocket.build_flags}
  -DBENCH_TRAFFIC_LOAD_PCT=0

[env:rak_wismesh_pocket-r119-g10]
extends = env:rak_wismesh_pocket
board_level = extra
build_flags = ${env:rak_wismesh_pocket.build_flags}
  -DBENCH_TRAFFIC_LOAD_PCT=10

[env:rak_wismesh_pocket-r119-g25]
extends = env:rak_wismesh_pocket
board_level = extra
build_flags = ${env:rak_wismesh_pocket.build_flags}
  -DBENCH_TRAFFIC_LOAD_PCT=25
