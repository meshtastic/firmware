; DMShell loss bench r113: develop + the CAD-handoff error fix + the locked IRQ poll. -r113-f carries no probe;
; -r113-fp adds the SPI lock probe, and on the X1 the RX FIFO probe (every 50th frame left unread on purpose, so its
; loss is not comparable). Run against native-r113-f with DMSHELL_SLOT_PARITY unset. Not built by CI.

[env:rak_wismesh_pocket-r113-f]
extends = env:rak_wismesh_pocket
board_level = extra
build_flags = ${env:rak_wismesh_pocket.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2

[env:rak_wismesh_pocket-r113-fp]
extends = env:rak_wismesh_pocket
board_level = extra
build_flags = ${env:rak_wismesh_pocket.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DMESHTASTIC_SPI_LOCK_PROBE

[env:tracker-t1000-e-r113-f]
extends = env:tracker-t1000-e
board_level = extra
build_flags = ${env:tracker-t1000-e.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2

[env:tracker-t1000-e-r113-fp]
extends = env:tracker-t1000-e
board_level = extra
build_flags = ${env:tracker-t1000-e.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DMESHTASTIC_SPI_LOCK_PROBE

[env:seeed_mesh_tracker_X1-r113-f]
extends = env:seeed_mesh_tracker_X1
board_level = extra
build_flags = ${env:seeed_mesh_tracker_X1.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2

[env:seeed_mesh_tracker_X1-r113-fp]
extends = env:seeed_mesh_tracker_X1
board_level = extra
build_flags = ${env:seeed_mesh_tracker_X1.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DMESHTASTIC_SPI_LOCK_PROBE
  -DMESHTASTIC_RX_FIFO_PROBE=50
