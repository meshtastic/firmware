; GAT562 Mesh Tracker Pro: gat562_mesh_trial_tracker hardware plus a 5-way joystick,
; without the external QSPI flash (the joystick occupies those pins).
[env:gat562_mesh_tracker_pro]
extends = nrf52840_base
board_level = extra
board = gat562_mesh_tracker_pro
build_flags = ${nrf52840_base.build_flags}
  -I variants/nrf52840/gat562_mesh_tracker_pro
  -D PRIVATE_HW
  -DRADIOLIB_EXCLUDE_SX128X=1
  -DRADIOLIB_EXCLUDE_SX127X=1
  -DRADIOLIB_EXCLUDE_LR11X0=1
  -DRADIOLIB_EXCLUDE_LR2021=1
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/gat562_mesh_tracker_pro>
