; Regression sweep r129, arm C: develop plus the five open bugfix PRs. The measured clients, one per chip family, each the
; on-board DMShell test client aimed at the CH341 server. Nothing is added to either arm - the arms
; are the branches, and these envs exist only so an image cannot be mislabelled. Not built by CI.
;
; DMSHELL_TEST_PEER is the server's node id. Verify it against the running server before flashing:
; a wrong peer produces a silent null.

[env:rak4631-r129-c]
extends = env:rak4631
board_level = extra
build_flags = ${env:rak4631.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2

[env:tracker-t1000-e-r129-c]
extends = env:tracker-t1000-e
board_level = extra
build_flags = ${env:tracker-t1000-e.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2

[env:seeed_mesh_tracker_X1-r129-c]
extends = env:seeed_mesh_tracker_X1
board_level = extra
build_flags = ${env:seeed_mesh_tracker_X1.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
