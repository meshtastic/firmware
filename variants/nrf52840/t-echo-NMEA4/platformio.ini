[env:t-echo-NMEA4]
extends = env:t-echo

; Same physical hardware identity as the normal T-Echo.
; Only the firmware implementation is selected by this environment.
custom_meshtastic_display_name = LILYGO T-Echo NMEA4

build_flags =
    -Ivariants/nrf52840/t-echo-NMEA4-common/include
    -Ivariants/nrf52840/t-echo-NMEA4-common/include/gps
    -Ivariants/nrf52840/t-echo-NMEA4-common/include/graphics
    -Ivariants/nrf52840/t-echo-NMEA4-common/include/graphics/draw
    -Ivariants/nrf52840/t-echo-NMEA4-common/include/motion
    ${env:t-echo.build_flags}
    -DT_ECHO_NMEA4_FAMILY=1
    -DT_ECHO_NMEA4=1

build_src_filter =
    ${env:t-echo.build_src_filter}
    -<gps/GPS.cpp>
    -<gps/TinyGPS++.cpp>
    -<graphics/Screen.cpp>
    -<graphics/draw/UIRenderer.cpp>
    -<graphics/draw/SatellitesRenderer.cpp>
    -<motion/ICM20948Sensor.cpp>
    +<../variants/nrf52840/t-echo-NMEA4-common/src>

; Replace the normal Meshtastic TinyGPSPlus dependency only in this environment.
lib_ignore =
    TinyGPSPlus
