; DMShell loss bench r146, arm 283: the 2.8.3 snapshot of develop, with buffered radio SPI (#12310), plus the until-done test client.
; The DMShell server and test client are the same code in both arms and in r135, so only the radio and router
; stack differs. -lt envs are for LONG_TURBO: a 15000-byte job, as r135 ran it. Pair with native-r146-283. Not built by CI.

[env:rak_wismesh_pocket-r146-283]
extends = env:rak_wismesh_pocket
board_level = extra
build_flags = ${env:rak_wismesh_pocket.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DDMSHELL_TEST_UNTIL_DONE=1

[env:rak_wismesh_pocket-r146-283-lt]
extends = env:rak_wismesh_pocket
board_level = extra
build_flags = ${env:rak_wismesh_pocket.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DDMSHELL_TEST_UNTIL_DONE=1
  -DDMSHELL_TEST_OUTPUT_BYTES=15000

