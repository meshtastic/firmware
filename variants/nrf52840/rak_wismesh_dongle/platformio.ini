; RAK10726 WisMesh Dongle - RAK4630/4631 + USB + 2 LEDs + buzzer (headless phone USB mesh adapter)
[env:rak_wismesh_dongle]
custom_meshtastic_support_level = 1
custom_meshtastic_images = rak4631.svg
custom_meshtastic_tags = RAK

extends = nrf52840_base
board = wiscore_rak4631
board_check = true
; Inherit RAK4631 hw_model until WISMESH_DONGLE is added to meshtastic/protobufs.
custom_meshtastic_hw_model = 9
custom_meshtastic_hw_model_slug = RAK4631
custom_meshtastic_architecture = nrf52840
custom_meshtastic_display_name = RAK WisMesh Dongle
custom_meshtastic_actively_supported = true
custom_meshtastic_requires_dfu = true
build_flags = ${nrf52840_base.build_flags}
  -I variants/nrf52840/rak_wismesh_dongle
  -D WISMESH_DONGLE
  -D RAK_4631
  -DRADIOLIB_EXCLUDE_SX128X=1
  -DRADIOLIB_EXCLUDE_SX127X=1
  -DRADIOLIB_EXCLUDE_LR11X0=1
  -DRADIOLIB_EXCLUDE_LR2021=1
  -DMESHTASTIC_EXCLUDE_WIFI=1
  ; Phone USB VBUS can make SAADC VDD samples look "unsafe" and stall boot in waitUntilPowerLevelSafe().
  ; threshold 0 => getVDDVoltage() < threshold is never true, effectively skipping the gate.
  -DSAFE_VDD_VOLTAGE_THRESHOLD_MV=0
  -DSAFE_VDD_VOLTAGE_THRESHOLD_HYST_MV=0
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/rak_wismesh_dongle>
