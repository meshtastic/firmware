; DMShell loss bench on claude/dmshell-on-11983: develop, #11983, #12019 and #12020, with no #11984. -next is every
; quantum on, the old final's A less #11984 (the RAK re-arms from #11983's task instead of the ISR) and the WRONG_MODEM
; re-read; each -noq* takes one back out. Run the server's native-dmshell-next with DMSHELL_SLOT_PARITY=even against all
; of them. DMSHELL_TEST_PEER is the server's node number. Not built by CI.

; the whole stack: every quantum on, as the old final's A, less #11984 and the WRONG_MODEM re-read
[env:rak_wismesh_pocket-dmshell-next]
extends = env:rak_wismesh_pocket
board_level = extra
build_flags = ${env:rak_wismesh_pocket.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DRADIOLIB_GODMODE=1
  -DMESHTASTIC_BENCH_INSTRUMENTATION=1
  -DDMSHELL_TEST_SLOT_PARITY=1
  -DMESHTASTIC_RADIO_TASK
  -DMESHTASTIC_TX_SLOT_GATE_MS=1
  -DMESHTASTIC_TX_SLOT_LEAD
  -DMESHTASTIC_TX_SLOT_SET_TX_AT_MS=3

; no slot parity on the packet. The gate keys on it, so it has nothing to hold either
