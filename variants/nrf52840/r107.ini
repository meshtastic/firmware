; DMShell loss bench, round 107, arm R: the TX_DONE re-arm from the readout task on nRF52 too, plus the on-board test
; client. No slot parity in this round. DMSHELL_TEST_PEER is the server's node number. Not built by CI.
;
; Only the RAK has an arm here. Arm T already re-arms from the task on the T-Beam and the X1, and nothing on this
; branch touches the T1000-E, so the RAK is where arm R differs from arm T at all - and from arm I by the re-arm's
; path alone.

[env:rak_wismesh_pocket-r107-r]
extends = env:rak_wismesh_pocket
board_level = extra
build_flags = ${env:rak_wismesh_pocket.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2

; The T1000-E's LR1110 had no TX_DONE re-arm at all before this branch, so this arm is the re-arm against none,
; whichever path - the LR11x0 re-arm runs from the readout task on the ISR branch too.
[env:tracker-t1000-e-r107-r]
extends = env:tracker-t1000-e
board_level = extra
build_flags = ${env:tracker-t1000-e.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2

; R-resume: arm R plus SX126X_RX_KNOWN_CONTINUOUS, which records the continuous RX RadioLib's duty cycle really armed,
; so resumeRunningReceive() picks a frame's RX back up instead of standing the chip by and reprogramming it. The arm I
; gets implicitly from the ISR's explicit continuous SET_RX. Read it against arm I, not only against R.
[env:rak_wismesh_pocket-r107-r-resume]
extends = env:rak_wismesh_pocket
board_level = extra
build_flags = ${env:rak_wismesh_pocket.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DSX126X_RX_KNOWN_CONTINUOUS=1
