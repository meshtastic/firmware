; DMShell loss bench, round 107, arm R: the TX_DONE re-arm from the readout task on nRF52 too, plus the on-board test
; client. No slot parity in this round. DMSHELL_TEST_PEER is the server's node number. Not built by CI.
;
; Only the RAK has an arm here. Arm T already re-arms from the task on the T-Beam and the X1, and nothing on this
; branch touches the T1000-E, so the RAK is where arm R differs from arm T at all - and from arm I by the re-arm's
; path alone.

[env:rak_wismesh_pocket-r107-r]
extends = env:rak_wismesh_pocket
board_level = extra
build_flags = ${env:rak_wismesh_pocket.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
