; DMShell loss bench, round 107, arm T: claude/rx-readout-task as the PR stands, plus the on-board test client. No slot
; parity in this round. DMSHELL_TEST_PEER is the server's node number. Not built by CI.
;
; What the PR does per board: the RAK and the T1000-E get the readout task alone (the SX126x re-arm is held off nRF52
; and there is no LR11x0 re-arm), the X1 gets the task plus the LR2021 TX_DONE re-arm. The -norearm env on the X1 takes
; that re-arm back out, so the readout task can be read on its own there too.

[env:rak_wismesh_pocket-r107-t]
extends = env:rak_wismesh_pocket
board_level = extra
build_flags = ${env:rak_wismesh_pocket.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2

[env:tracker-t1000-e-r107-t]
extends = env:tracker-t1000-e
board_level = extra
build_flags = ${env:tracker-t1000-e.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2

[env:seeed_mesh_tracker_X1-r107-t]
extends = env:seeed_mesh_tracker_X1
board_level = extra
build_flags = ${env:seeed_mesh_tracker_X1.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2

; The readout task without the LR2021 TX_DONE re-arm
[env:seeed_mesh_tracker_X1-r107-t-norearm]
extends = env:seeed_mesh_tracker_X1
board_level = extra
build_flags = ${env:seeed_mesh_tracker_X1.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DLR2021_RX_REARM_AT_TX_DONE=0
