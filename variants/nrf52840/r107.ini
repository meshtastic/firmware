; DMShell loss bench, round 107, arm I: the TX_DONE re-arm in the ISR, plus the on-board test client. No slot parity in
; this round. DMSHELL_TEST_PEER is the server's node number. Not built by CI.
;
; Only the RAK has an arm here. The ISR re-arm needs nRF52 with a real DIO1 and no LoRa FEM, so it is the RAK's SX1262
; or nothing: on the T-Beam (ESP32) and the X1 and T1000-E (LR chips) this branch builds the same firmware as arm T.

[env:rak_wismesh_pocket-r107-i]
extends = env:rak_wismesh_pocket
board_level = extra
build_flags = ${env:rak_wismesh_pocket.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
