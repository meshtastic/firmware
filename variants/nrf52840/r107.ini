; DMShell loss bench, round 107, arm P: #11983 as it stands at 764448e - the readout task, the honest continuous-RX
; resume, the SX126x re-arm from the task on nRF52, and the LR11x0 re-arm - plus the on-board test client. No slot
; parity in this round. DMSHELL_TEST_PEER is the server's node number. Not built by CI.
;
; Per board this is the same firmware as an arm already run, so it is a confirmation of the PR as one image rather
; than a new comparison: RAK = R-resume without the TRACE re-arm counters, T1000-E = R, X1 = T (the LR20x0 has no
; resume to turn on, and nothing here touches its re-arm).

[env:rak_wismesh_pocket-r107-p]
extends = env:rak_wismesh_pocket
board_level = extra
build_flags = ${env:rak_wismesh_pocket.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2

[env:tracker-t1000-e-r107-p]
extends = env:tracker-t1000-e
board_level = extra
build_flags = ${env:tracker-t1000-e.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2

[env:seeed_mesh_tracker_X1-r107-p]
extends = env:seeed_mesh_tracker_X1
board_level = extra
build_flags = ${env:seeed_mesh_tracker_X1.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
