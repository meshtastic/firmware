[env:t-echo-card]
extends = nrf52840_base
board = t-echo
board_level = extra
lib_deps =
  ${nrf52840_base.lib_deps}
  # renovate: datasource=git-refs depName=meshtastic-codec2 packageName=https://github.com/meshtastic/codec2 gitBranch=main
  https://github.com/meshtastic/codec2/archive/refs/heads/main.zip
debug_tool = jlink

build_flags = ${nrf52840_base.build_flags}
  -I variants/nrf52840/t-echo-card
  ; nrf52.ini excludes audio for the arch; this board has the hardware for it.
  -UMESHTASTIC_EXCLUDE_AUDIO
  -D CODEC2_EXTERNAL_CODEBOOKS
  ; Shipped codec2 rates. Tables live in QSPI, so this only affects code size.
  -D CODEC2_MODE_EN_DEFAULT=0
  -D CODEC2_MODE_2400_EN=1
  -D CODEC2_MODE_1400_EN=1
  -D CODEC2_MODE_700C_EN=1
  -D CODEC2_MODE_450_EN=1
  -D T_ECHO_CARD

build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/t-echo-card>
