; DMShell loss bench r148: both ends on boards, no CH341. The server is tbeam-s3-core-r148-server (synthetic shell).
; Every node waits for a PPS clock hold (120 s of edges), then logs µs radio edges and raw PPS edges. Set R148_PEER
; to the server's node number (0x...) before building. Not built by CI.

[env:seeed_mesh_tracker_X1-r148]
extends = env:seeed_mesh_tracker_X1
board_level = extra
build_flags = ${env:seeed_mesh_tracker_X1.build_flags}
  -DDMSHELL_TEST_PEER=${sysenv.R148_PEER}
  -DDMSHELL_TEST_UNTIL_DONE=1
  -DDMSHELL_TEST_WAIT_PPS=1
  -DPPS_BENCH_HOLD_SECS=120
  -DPPS_ALLOW_2D_FIX=1
  -DRADIO_EDGE_LOG=1

[env:rak_wismesh_pocket-r148]
extends = env:rak_wismesh_pocket
board_level = extra
build_flags = ${env:rak_wismesh_pocket.build_flags}
  -DDMSHELL_TEST_PEER=${sysenv.R148_PEER}
  -DDMSHELL_TEST_UNTIL_DONE=1
  -DDMSHELL_TEST_WAIT_PPS=1
  -DPPS_BENCH_HOLD_SECS=120
  -DPPS_ALLOW_2D_FIX=1
  -DRADIO_EDGE_LOG=1

; r148b: RadioLib's per-command SPI status checks off (RADIOLIB_SPI_PARANOID=0), against the plain env.
[env:seeed_mesh_tracker_X1-r148-noparanoid]
extends = env:seeed_mesh_tracker_X1-r148
build_flags = ${env:seeed_mesh_tracker_X1-r148.build_flags}
  -DRADIOLIB_SPI_PARANOID=0

; r148d: hold TX while a busy scan's handoff RX is open (RADIO_CAD_HANDOFF_HOLDS_TX), against the plain env.
[env:seeed_mesh_tracker_X1-r148-hold]
extends = env:seeed_mesh_tracker_X1-r148
build_flags = ${env:seeed_mesh_tracker_X1-r148.build_flags}
  -DRADIO_CAD_HANDOFF_HOLDS_TX=1

; r148d arm R: re-read the RX flags just before the pre-TX scan's standby; "CAD arm" logs after the scan.
[env:seeed_mesh_tracker_X1-r148-recheck]
extends = env:seeed_mesh_tracker_X1-r148
build_flags = ${env:seeed_mesh_tracker_X1-r148.build_flags}
  -DRADIO_PREAMBLE_RECHECK=1

; r148e: time every radio command from the pre-TX scan to the transmit call ("RadioEdge: tx_seq" lines).
[env:seeed_mesh_tracker_X1-r148e]
extends = env:seeed_mesh_tracker_X1-r148
build_flags = ${env:seeed_mesh_tracker_X1-r148.build_flags}
  -DRADIO_EDGE_SEQ=1

[env:rak_wismesh_pocket-r148e]
extends = env:rak_wismesh_pocket-r148
build_flags = ${env:rak_wismesh_pocket-r148.build_flags}
  -DRADIO_EDGE_SEQ=1

; r148f: no arm on nRF52, only tx_seq on one TX in 8, against the server's arm F and control.
[env:seeed_mesh_tracker_X1-r148f]
extends = env:seeed_mesh_tracker_X1-r148e
build_flags = ${env:seeed_mesh_tracker_X1-r148e.build_flags}
  -DRADIO_EDGE_SEQ_EVERY=8

[env:rak_wismesh_pocket-r148f]
extends = env:rak_wismesh_pocket-r148e
build_flags = ${env:rak_wismesh_pocket-r148e.build_flags}
  -DRADIO_EDGE_SEQ_EVERY=8

; r148g: the chip's mode and errors at TX_DONE on one TX in 8 ("RadioEdge: txdone_mode"); SPI paranoid off from the
; root [env]. The RAK proves the server's short TCXO wait on a second SX1262 (arm G against -ctl); the X1 has no arm.
[env:seeed_mesh_tracker_X1-r148g]
extends = env:seeed_mesh_tracker_X1-r148e
build_flags = ${env:seeed_mesh_tracker_X1-r148e.build_flags}
  -DRADIO_EDGE_SEQ_EVERY=8
  -DRADIO_TXDONE_MODE_CHECK=1

[env:rak_wismesh_pocket-r148g-ctl]
extends = env:rak_wismesh_pocket-r148e
build_flags = ${env:rak_wismesh_pocket-r148e.build_flags}
  -DRADIO_EDGE_SEQ_EVERY=8
  -DRADIO_TXDONE_MODE_CHECK=1
  -DSX126X_CAD_XOSC_AT_DONE=1

[env:rak_wismesh_pocket-r148g]
extends = env:rak_wismesh_pocket-r148g-ctl
build_flags = ${env:rak_wismesh_pocket-r148g-ctl.build_flags}
  -DSX126X_CAD_TCXO_SHORT_US=156

; r148h: the RAK as r148h's second SX1262, without PPS (its pin 17 is dead): arm H against -ctl, as the server's envs.
[env:rak_wismesh_pocket-r148h-ctl]
extends = env:rak_wismesh_pocket-r148g-ctl
build_unflags = ${nrf52840_base.build_unflags}
  -DDMSHELL_TEST_WAIT_PPS=1
  -DPPS_BENCH_HOLD_SECS=120

[env:rak_wismesh_pocket-r148h]
extends = env:rak_wismesh_pocket-r148g-ctl
build_flags = ${env:rak_wismesh_pocket-r148g-ctl.build_flags}
  -DSX126X_CAD_TCXO_SHORT_US=156
  -DSX126X_CAD_TCXO_RESTORE=2
build_unflags = ${nrf52840_base.build_unflags}
  -DDMSHELL_TEST_WAIT_PPS=1
  -DPPS_BENCH_HOLD_SECS=120

; r148i: the X1's CAD exits straight to TX when clear (LR2021_CAD_LBT, slim scan) against the r148g X1 (exit RX on a
; busy CAD, verdict read and SetTx when clear). LR2021_CAD_LBT defaults to 1, so the control turns it off.
[env:seeed_mesh_tracker_X1-r148i]
extends = env:seeed_mesh_tracker_X1-r148g
build_flags = ${env:seeed_mesh_tracker_X1-r148g.build_flags}
  -DLR2021_CAD_LBT=1

[env:seeed_mesh_tracker_X1-r148i-ctl]
extends = env:seeed_mesh_tracker_X1-r148g
build_flags = ${env:seeed_mesh_tracker_X1-r148g.build_flags}
  -DLR2021_CAD_LBT=0

; r148j: as the esp32s3 r148j envs. The X1 keeps r148i's LBT scan; the RAK (no PPS) is optional.
[env:seeed_mesh_tracker_X1-r148j-ctl]
extends = env:seeed_mesh_tracker_X1-r148i
build_flags = ${env:seeed_mesh_tracker_X1-r148i.build_flags}
  -DRADIO_EDGE_REARM=1

[env:seeed_mesh_tracker_X1-r148j]
extends = env:seeed_mesh_tracker_X1-r148j-ctl
build_flags = ${env:seeed_mesh_tracker_X1-r148j-ctl.build_flags}
  -DRADIO_SLIM_REARM=1

[env:rak_wismesh_pocket-r148j-ctl]
extends = env:rak_wismesh_pocket-r148h-ctl
build_flags = ${env:rak_wismesh_pocket-r148h-ctl.build_flags}
  -DRADIO_EDGE_REARM=1

[env:rak_wismesh_pocket-r148j]
extends = env:rak_wismesh_pocket-r148j-ctl
build_flags = ${env:rak_wismesh_pocket-r148j-ctl.build_flags}
  -DRADIO_SLIM_REARM=1
