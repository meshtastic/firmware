; DMShell loss bench r148: both ends on boards, no CH341. The server is tbeam-s3-core-r148-server (synthetic shell).
; Every node waits for a PPS clock hold (120 s of edges), then logs µs radio edges and raw PPS edges. Set R148_PEER
; to the server's node number (0x...) before building. Not built by CI.

[env:seeed_mesh_tracker_X1-r148]
extends = env:seeed_mesh_tracker_X1
board_level = extra
build_flags = ${env:seeed_mesh_tracker_X1.build_flags}
  -DDMSHELL_TEST_PEER=${sysenv.R148_PEER}
  -DDMSHELL_TEST_UNTIL_DONE=1
  -DDMSHELL_TEST_WAIT_PPS=1
  -DPPS_BENCH_HOLD_SECS=120
  -DRADIO_EDGE_LOG=1

[env:rak_wismesh_pocket-r148]
extends = env:rak_wismesh_pocket
board_level = extra
build_flags = ${env:rak_wismesh_pocket.build_flags}
  -DDMSHELL_TEST_PEER=${sysenv.R148_PEER}
  -DDMSHELL_TEST_UNTIL_DONE=1
  -DDMSHELL_TEST_WAIT_PPS=1
  -DPPS_BENCH_HOLD_SECS=120
  -DRADIO_EDGE_LOG=1
