; Crypto test vectors on hardware: pio test -e crypto-nrf52840 -f test_crypto_vectors
; SenseCAP T1000-E. Serial is USB CDC, which re-enumerates after every upload.
[env:crypto-nrf52840]
extends = nrf52840_base
board = tracker-t1000-e
board_level = extra
board_build.ldscript = src/platform/nrf52/nrf52840_s140_v7.ld
upload_protocol = nrfutil
build_flags = ${nrf52840_base.build_flags}
  -Ivariants/nrf52840/tracker-t1000-e
  -Isrc/platform/nrf52/softdevice
  -Isrc/platform/nrf52/softdevice/nrf52
  -DTRACKER_T1000_E
  -D CRYPTO_TEST_MINIMAL
build_src_filter =
  -<*>
  +<crypto/>
  +<mesh/HardwareRNG.cpp>
  +<meshUtils.cpp>
  +<mesh/CryptoEngine.cpp>
  +<concurrency/Lock.cpp>
  +<concurrency/LockGuard.cpp>
  +<../variants/nrf52840/tracker-t1000-e>
test_filter =
  test_crypto_vectors

; Backend suite only: no CryptoEngine, so the link proves test_crypto_backend needs just src/crypto.
[env:crypto-nrf52840-backend]
extends = env:crypto-nrf52840
; --wrap lets the suite count the backend each public call really reached.
build_flags = ${env:crypto-nrf52840.build_flags}
  -D CRYPTO_TEST_WRAP_DISPATCH
  -Wl,--wrap=crypto_nrf52_aes128_ctr
  -Wl,--wrap=crypto_nrf52_aes128_ccm_seal
  -Wl,--wrap=crypto_nrf52_aes128_ccm_open
  -Wl,--wrap=crypto_nrf52_sha256
  -Wl,--wrap=crypto_nrf52_hmac_sha256
  -Wl,--wrap=crypto_nrf52_x25519
  -Wl,--wrap=crypto_nrf52_ed25519_verify
  -Wl,--wrap=crypto_nrf52_ed25519_basemul
  -Wl,--wrap=crypto_lib_aes256_ctr
  -Wl,--wrap=crypto_lib_aes256_ccm_seal
  -Wl,--wrap=crypto_lib_aes256_ccm_open
  -Wl,--wrap=crypto_lib_sha256
  -Wl,--wrap=crypto_lib_sha512
  -Wl,--wrap=crypto_lib_hmac_sha256
  -Wl,--wrap=crypto_lib_x25519
  -Wl,--wrap=crypto_lib_ed25519_verify
  -Wl,--wrap=crypto_lib_ed25519_basemul
  -Wl,--wrap=crypto_lib_xeddsa_sign
build_src_filter =
  -<*>
  +<crypto/>
  +<mesh/HardwareRNG.cpp>
  +<concurrency/Lock.cpp>
  +<concurrency/LockGuard.cpp>
  +<../variants/nrf52840/tracker-t1000-e>
test_filter =
  test_crypto_backend
