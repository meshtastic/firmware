; DMShell loss bench r114, arm P1: P0 + the LR2021 RX FIFO discard + the locked airtime reads. Probe arm, loss not comparable: the SPI lock
; probe on every board, and on the X1 the RX FIFO probe (a drop armed every 50th frame, taken on the next frame under
; 64 bytes). Run against r113's native-r112-d server with DMSHELL_SLOT_PARITY unset. Not built by CI.

[env:rak_wismesh_pocket-r114-p1]
extends = env:rak_wismesh_pocket
board_level = extra
build_flags = ${env:rak_wismesh_pocket.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DMESHTASTIC_SPI_LOCK_PROBE

[env:tracker-t1000-e-r114-p1]
extends = env:tracker-t1000-e
board_level = extra
build_flags = ${env:tracker-t1000-e.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DMESHTASTIC_SPI_LOCK_PROBE

[env:seeed_mesh_tracker_X1-r114-p1]
extends = env:seeed_mesh_tracker_X1
board_level = extra
build_flags = ${env:seeed_mesh_tracker_X1.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DMESHTASTIC_SPI_LOCK_PROBE
  -DMESHTASTIC_RX_FIFO_PROBE=50
