; DMShell loss bench r114, arms B and W, on claude/prestage-via-phy. The question is narrow: does routing the prestage
; payload write through RadioLib's chip-neutral PhysicalLayer::writeTxBuffer() (jgromes/RadioLib#1890) behave the same
; as the chip-specific call each board has been using? -b keeps the chip-specific call, -w takes the PHY one. Everything
; else, the RadioLib pin included, is identical between the two, so the pair isolates the API and nothing else.
;
; Both arms are r112's arm A with its slot parity, so the numbers are comparable with r112-a, EXCEPT that the whole
; branch now pins jp-bennett/RadioLib tx-buffer-bench instead of develop's jgromes pin. Expect B to differ from r112-a
; by whatever that pin jump is worth; B vs W is the measurement.
;
; Run both against native-r114-b with DMSHELL_SLOT_PARITY=even. DMSHELL_TEST_PEER is the server's node number.
; RADIOLIB_GODMODE stays in both arms: other quanta #error without it. Not built by CI.

; ---- T1000-E (LR1110), the board where prestage measured its largest win (r39, 9.40 -> 7.82%) ----

[env:tracker-t1000-e-r114-b]
extends = env:tracker-t1000-e
board_level = extra
build_flags = ${env:tracker-t1000-e.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DRADIOLIB_GODMODE=1
  -DDMSHELL_TEST_SLOT_PARITY=1
  -DMESHTASTIC_RADIO_TASK
  -DMESHTASTIC_TX_SLOT_GATE_MS=1
  -DMESHTASTIC_TX_SLOT_LEAD
  -DMESHTASTIC_TX_SLOT_SET_TX_AT_MS=3
  -DLR11X0_STANDBY_XOSC
  -DLR11X0_CAD_EXIT_LBT
  -DLR11X0_CAD_SLIM
  -DLR11X0_TX_STAGE_EARLY

[env:tracker-t1000-e-r114-w]
extends = env:tracker-t1000-e
board_level = extra
build_flags = ${env:tracker-t1000-e.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DRADIOLIB_GODMODE=1
  -DDMSHELL_TEST_SLOT_PARITY=1
  -DMESHTASTIC_RADIO_TASK
  -DMESHTASTIC_TX_SLOT_GATE_MS=1
  -DMESHTASTIC_TX_SLOT_LEAD
  -DMESHTASTIC_TX_SLOT_SET_TX_AT_MS=3
  -DLR11X0_STANDBY_XOSC
  -DLR11X0_CAD_EXIT_LBT
  -DLR11X0_CAD_SLIM
  -DLR11X0_TX_STAGE_EARLY
  -DMESHTASTIC_PRESTAGE_VIA_PHY

; ---- X1 (LR2021). -b clears the Tx FIFO and writes it from the firmware, by hand; -w calls writeTxBuffer(), which
; ---- does both inside RadioLib. That is the comparison the PR actually claims, and it is a closer control than
; ---- r112-a's prestageTransmit(), which is the superseded API and is not on this RadioLib pin. Prestage measured
; ---- null on this board (r60/r61), so read this pair as a regression check, not as a win: W should land on B.

[env:seeed_mesh_tracker_X1-r114-b]
extends = env:seeed_mesh_tracker_X1
board_level = extra
build_flags = ${env:seeed_mesh_tracker_X1.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DRADIOLIB_GODMODE=1
  -DDMSHELL_TEST_SLOT_PARITY=1
  -DMESHTASTIC_RADIO_TASK
  -DMESHTASTIC_TX_SLOT_GATE_MS=1
  -DMESHTASTIC_TX_SLOT_LEAD
  -DMESHTASTIC_TX_SLOT_SET_TX_AT_MS=3
  -DLR2021_TX_PRESTAGE
  -DLR2021_CAD_EXIT_LBT

[env:seeed_mesh_tracker_X1-r114-w]
extends = env:seeed_mesh_tracker_X1
board_level = extra
build_flags = ${env:seeed_mesh_tracker_X1.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DRADIOLIB_GODMODE=1
  -DDMSHELL_TEST_SLOT_PARITY=1
  -DMESHTASTIC_RADIO_TASK
  -DMESHTASTIC_TX_SLOT_GATE_MS=1
  -DMESHTASTIC_TX_SLOT_LEAD
  -DMESHTASTIC_TX_SLOT_SET_TX_AT_MS=3
