; DMShell loss bench, arm R: 2.8.1's radio path plus the on-board test client, under the env names claude/dmshell-final
; uses. DMSHELL_TEST_PEER is the server's node number. Not built by CI.

[env:rak_wismesh_pocket-dmshell-final]
extends = env:rak_wismesh_pocket
board_level = extra
build_flags = ${env:rak_wismesh_pocket.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2

[env:tracker-t1000-e-dmshell-final]
extends = env:tracker-t1000-e
board_level = extra
build_flags = ${env:tracker-t1000-e.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2

[env:seeed_mesh_tracker_X1-dmshell-final]
extends = env:seeed_mesh_tracker_X1
board_level = extra
build_flags = ${env:seeed_mesh_tracker_X1.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
