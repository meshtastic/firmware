[env:makerpython_nrf52840_sx1280_eink]
board_level = extra
extends = nrf52840_base
board = nordic_pca10059
build_flags = ${nrf52840_base.build_flags}
  -Ivariants/nrf52840/MakePython_nRF52840_eink
  -D PRIVATE_HW
  -D PIN_EINK_EN
  -DEINK_DISPLAY_MODEL=GxEPD2_290_T5D
  -DEINK_WIDTH=296
  -DEINK_HEIGHT=128
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/MakePython_nRF52840_eink>
lib_deps = 
  ${nrf52840_base.lib_deps}
  # renovate: datasource=git-refs depName=meshtastic/codec2 packageName=https://github.com/meshtastic/codec2 gitBranch=main
  https://github.com/meshtastic/codec2/archive/3e347e0b70fc72af9357fbbd32b10a125321d6c5.zip
  # renovate: datasource=custom.pio depName=GxEPD2 packageName=zinggjm/library/GxEPD2
  zinggjm/GxEPD2@1.6.9
debug_tool = jlink
;upload_port = /dev/ttyACM4