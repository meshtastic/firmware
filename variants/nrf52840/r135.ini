; DMShell loss bench r135, arm D: develop. Both arms carry the same DMShell server and test client, so
; only the radio and router stack differs. Each run ends when the output is complete (DMSHELL_TEST_UNTIL_DONE).
; -lt envs are for LONG_TURBO: a 30000-byte job instead of 120000. Pair with native-r135-d. Not built by CI.

[env:rak_wismesh_pocket-r135-d]
extends = env:rak_wismesh_pocket
board_level = extra
build_flags = ${env:rak_wismesh_pocket.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DDMSHELL_TEST_UNTIL_DONE=1

[env:rak_wismesh_pocket-r135-d-lt]
extends = env:rak_wismesh_pocket
board_level = extra
build_flags = ${env:rak_wismesh_pocket.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DDMSHELL_TEST_UNTIL_DONE=1
  -DDMSHELL_TEST_OUTPUT_BYTES=30000

[env:tracker-t1000-e-r135-d]
extends = env:tracker-t1000-e
board_level = extra
build_flags = ${env:tracker-t1000-e.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DDMSHELL_TEST_UNTIL_DONE=1

[env:tracker-t1000-e-r135-d-lt]
extends = env:tracker-t1000-e
board_level = extra
build_flags = ${env:tracker-t1000-e.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DDMSHELL_TEST_UNTIL_DONE=1
  -DDMSHELL_TEST_OUTPUT_BYTES=30000

[env:seeed_mesh_tracker_X1-r135-d]
extends = env:seeed_mesh_tracker_X1
board_level = extra
build_flags = ${env:seeed_mesh_tracker_X1.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DDMSHELL_TEST_UNTIL_DONE=1

[env:seeed_mesh_tracker_X1-r135-d-lt]
extends = env:seeed_mesh_tracker_X1
board_level = extra
build_flags = ${env:seeed_mesh_tracker_X1.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
