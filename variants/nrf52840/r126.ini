; DMShell loss bench r126: does running the LR2021 on its DC-DC (SIMO) regulator cost anything on the air?
; Both arms are the same code and the same RadioLib pin (7.8.1); they differ only in LR2021_REGULATOR_LDO,
; so the contrast is the regulator and nothing else. Boot prints "LR20x0 regulator: DC-DC" or "... LDO".
; Run against the r118 server image with DMSHELL_SLOT_PARITY unset. Not built by CI.

; C: the change as it would ship - DC-DC after every begin()
[env:seeed_mesh_tracker_X1-r126-c]
extends = env:seeed_mesh_tracker_X1
board_level = extra
build_flags = ${env:seeed_mesh_tracker_X1.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2

; O: the per-variant opt-out - setRegulatorLDO() instead, i.e. the regulator the chip resets to
[env:seeed_mesh_tracker_X1-r126-o]
extends = env:seeed_mesh_tracker_X1
board_level = extra
build_flags = ${env:seeed_mesh_tracker_X1.build_flags}
  -DDMSHELL_TEST_PEER=0x999312f2
  -DLR2021_REGULATOR_LDO
