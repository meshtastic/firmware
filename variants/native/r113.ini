; DMShell loss bench r113, CH341 server. native-r113-f is the same commit as the boards, no probe; native-r113-sp adds
; the stage probe, whose readback costs USB time, so its loss is not comparable. DMSHELL_SLOT_PARITY unset. Not built by CI.

[env:native-r113-f]
extends = env:native
board_level = extra

[env:native-r113-sp]
extends = env:native
board_level = extra
build_flags = ${env:native.build_flags}
  -DMESHTASTIC_STAGE_PROBE
