; DMShell loss bench on claude/dmshell-on-11983: the CH341 server. Portduino has no readout task or radio task, so one
; server binary serves every client arm. Start it with DMSHELL_SLOT_PARITY=even. Not built by CI.

; the slot gate with its measured lead, SET_TX aimed 2 ms into the slot
[env:native-dmshell-next]
extends = env:native
board_level = extra
build_flags = ${env:native.build_flags}
  -DMESHTASTIC_TX_SLOT_GATE_MS=1
  -DMESHTASTIC_TX_SLOT_LEAD
  -DMESHTASTIC_TX_SLOT_SET_TX_AT_MS=2
  -DMESHTASTIC_BENCH_INSTRUMENTATION=1
