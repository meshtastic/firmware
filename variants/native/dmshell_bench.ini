; DMShell loss bench: the CH341 server's live configuration (round 53's s53c, parity even), with TX prestage and the
; 1 ms TCXO start-up built in. MESHTASTIC_TX_PRESTAGE and MESHTASTIC_TCXO_DELAY_US still override them. Not built by CI.
[env:native-dmshell-bench]
extends = env:native
board_level = extra
build_flags = ${env:native.build_flags}
  -DMESHTASTIC_TX_SLOT_PARITY=0
  -DSX126X_CAD_SLIM
  -DSX126X_TX_STAGE_IN_RX
  -DSX126X_TX_STAGE_EARLY
  -DCH341_FAST_HAL
  -DCH341_PACKED_CS
  -DCH341_TX_PRESTAGE_DEFAULT=1
  -DSX126X_TCXO_DELAY_US=1000

; The server with the clients' TX timeline: "TX timeline us" and "TX slot" lines after each TX, so its own slot landing
; (SET_TX's offset into its even slot) can be measured. The lines print after RX is back, so the TX path is unchanged.
[env:native-dmshell-bench-timeline]
extends = env:native-dmshell-bench
board_level = extra
build_flags = ${env:native-dmshell-bench.build_flags}
  -DMESHTASTIC_LOG_RADIO_EDGES
  -DMESHTASTIC_TX_TIMELINE

; SL: the timeline server with measured leads, as the clients' TL: SET_TX aimed 2 ms into its even slot, the scan started
; the measured scan-to-SET_TX time before it, and the timer fired the measured wake latency (plus 1 ms) before the scan.
; The early stage still writes the payload during the backoff. Logs a "TX lead" line after each TX.
[env:native-dmshell-bench-lead]
extends = env:native-dmshell-bench
board_level = extra
build_flags = ${env:native-dmshell-bench-timeline.build_flags}
  -DMESHTASTIC_TX_SLOT_GATE_MS=1
  -DMESHTASTIC_TX_SLOT_LEAD
  -DMESHTASTIC_TX_SLOT_SET_TX_AT_MS=2
