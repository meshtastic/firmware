; DMShell loss bench: the CH341 server's live configuration (round 53's s53c, parity even). Run it with
; MESHTASTIC_TX_PRESTAGE=1 in the environment. Not built by CI.
[env:native-dmshell-bench]
extends = env:native
board_level = extra
build_flags = ${env:native.build_flags}
  -DMESHTASTIC_TX_SLOT_PARITY=0
  -DSX126X_CAD_SLIM
  -DSX126X_TX_STAGE_IN_RX
  -DSX126X_TX_STAGE_EARLY
  -DCH341_FAST_HAL
  -DCH341_PACKED_CS
