; DMShell loss bench r112, the server for arms A and Anp: the same commit as the boards, with the slot gate and its
; measured lead. One binary serves both arms - the parity is runtime, not a build flag. Start it with
; DMSHELL_SLOT_PARITY=even for -a and with DMSHELL_SLOT_PARITY unset for -anp. Not built by CI.

[env:native-r112-a]
extends = env:native
board_level = extra
build_flags = ${env:native.build_flags}
  -DMESHTASTIC_TX_SLOT_GATE_MS=1
  -DMESHTASTIC_TX_SLOT_LEAD
  -DMESHTASTIC_TX_SLOT_SET_TX_AT_MS=2
