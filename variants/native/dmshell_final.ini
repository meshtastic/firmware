; DMShell loss bench on claude/dmshell-final: the CH341 server, held fixed for every client arm. It is SL from
; claude/dmshell-shared: SET_TX aimed 2 ms into its slot, which lands where the clients' 3 ms aims land. The CH341 fixes
; (#12016) switch on at run time when the radio is on a CH341. Run it with DMSHELL_SLOT_PARITY=even. Not built by CI.
[env:native-dmshell-final]
extends = env:native
board_level = extra
build_flags = ${env:native.build_flags}
  -DMESHTASTIC_TX_SLOT_GATE_MS=1
  -DMESHTASTIC_TX_SLOT_LEAD
  -DMESHTASTIC_TX_SLOT_SET_TX_AT_MS=2
  -DMESHTASTIC_BENCH_INSTRUMENTATION=1
