; DMShell loss bench r114, the CH341 server (SX1262 over USB). The SX126x prestage only compiles on Portduino and only
; runs when the IRQ is polled over USB, so the server is the only place the SX126x side of jgromes/RadioLib#1890 gets
; exercised. -b keeps the raw WriteBuffer stream; -w calls writeTxBuffer().
;
; writeTxBuffer() sends a SetBufferBaseAddress command of its own before the payload, which the raw write does not.
; On this bus that is one extra USB round trip per scan, inside the very window prestage exists to shorten, so -w
; landing WORSE than -b here is a real possible outcome and is the thing worth knowing before the API is merged.
;
; Pair both with tracker-t1000-e-r114-b, and start either with DMSHELL_SLOT_PARITY=even. Not built by CI.

[env:native-r114-b]
extends = env:native
board_level = extra
build_flags = ${env:native.build_flags}
  -DMESHTASTIC_TX_SLOT_GATE_MS=1
  -DMESHTASTIC_TX_SLOT_LEAD
  -DMESHTASTIC_TX_SLOT_SET_TX_AT_MS=2

[env:native-r114-w]
extends = env:native
board_level = extra
build_flags = ${env:native.build_flags}
  -DMESHTASTIC_TX_SLOT_GATE_MS=1
  -DMESHTASTIC_TX_SLOT_LEAD
  -DMESHTASTIC_TX_SLOT_SET_TX_AT_MS=2
  -DMESHTASTIC_PRESTAGE_VIA_PHY
