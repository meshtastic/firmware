; DMShell loss bench, add-one-in run: the CH341 server, running the arm of the same name as the client. The baseline is
; develop's behaviour. The server has no readout task (excluded on Portduino) and no radio task, so Q3, Q4, Q12 and Q15
; have no server side: those runs use -base here. Its slot parity is the runtime DMSHELL_SLOT_PARITY=even, not a build
; flag, so the q10 run also uses -base, started with that variable set. Not built by CI.

; every quantum off. Also the server side of the q3, q4, q9, q12 and q15 runs, and of q10 with DMSHELL_SLOT_PARITY=even
[env:native-dmshell-add]
extends = env:native
board_level = extra
build_flags = ${env:native.build_flags}
  -DMESHTASTIC_BENCH_INSTRUMENTATION=1
  -DMESHTASTIC_RX_DEFER_FOR_TX_MS=0
  -DMESHTASTIC_RADIOLIB_SPI_TIMEOUT_MS=0

; Q11 holds RX for a due slotted TX. Run with DMSHELL_SLOT_PARITY=even for Q10's grid
[env:native-dmshell-add-q11]
extends = env:native
board_level = extra
build_flags = ${env:native.build_flags}
  -DMESHTASTIC_BENCH_INSTRUMENTATION=1
  -DMESHTASTIC_RX_DEFER_FOR_TX_MS=30
  -DMESHTASTIC_RADIOLIB_SPI_TIMEOUT_MS=0

; Q13 gate and Q14 lead, SET_TX aimed 2 ms in so it lands where the clients' 3 ms aims land. No radio task here
[env:native-dmshell-add-q1214]
extends = env:native
board_level = extra
build_flags = ${env:native.build_flags}
  -DMESHTASTIC_BENCH_INSTRUMENTATION=1
  -DMESHTASTIC_RX_DEFER_FOR_TX_MS=0
  -DMESHTASTIC_TX_SLOT_GATE_MS=1
  -DMESHTASTIC_TX_SLOT_LEAD
  -DMESHTASTIC_TX_SLOT_SET_TX_AT_MS=2
  -DMESHTASTIC_RADIOLIB_SPI_TIMEOUT_MS=0

; The 50 ms BUSY bound, which develop does not have: RadioLib waits its own 1000 ms instead
[env:native-dmshell-add-qbusy]
extends = env:native
board_level = extra
build_flags = ${env:native.build_flags}
  -DMESHTASTIC_BENCH_INSTRUMENTATION=1
  -DMESHTASTIC_RX_DEFER_FOR_TX_MS=0
  -DMESHTASTIC_RADIOLIB_SPI_TIMEOUT_MS=50
