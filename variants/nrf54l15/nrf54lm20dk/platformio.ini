[env:nrf54lm20dk]
# PRIVATE_HW (255) - the protobuf HardwareModel enum reserves DK / DIY boards
# without an SKU under PRIVATE_HW; no dedicated enum value will be assigned.
custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = NRF54LM20_DK
custom_meshtastic_architecture = nrf54lm20
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = Nordic nRF54LM20-DK

extends = nrf54_base
# nRF54LM20A support (s145 10.0.1 for the LM20, its startup and linker scripts) is only on this platform
# branch so far.
platform = https://github.com/andyshinn/platform-nordicnrf54.git#648a966ee20fb15b4b7b9cd8afdcf2a7a9415def
# The Arduino core and the bootloader with the LM20's native USB, under review upstream:
# andyshinn/nRF54_Arduino#1 and #2 (this commit is both) and andyshinn/nRF54_Bootloader#2 (the tag adds
# release/nrf54lm20dk_bootloader.hex, which the builder needs for the DFU .zip and the merged .hex).
platform_packages =
  framework-arduinoadafruitnrf54@https://github.com/cvaldess/nRF54_Arduino.git#ef304610b2bdc6c0b4c6d9ebccac053320cc0483
  framework-arduinoadafruitnrf54-bootloader@https://github.com/cvaldess/nRF54_Bootloader.git#v0.5.0-lm20dk.1
board = nrf54lm20dk
board_level = extra
# The core's main.cpp starts USB through TinyUSB_Device_Init(), declared weak: from a library archive the
# linker never pulls the object that defines it. Link library objects directly instead.
lib_archive = no
# DFU over the native USB port (J3): 1200 bps touch on the application's port (239A:CAFE), then
# adafruit-nrfutil on the bootloader's (239A:4AFE). The on-board J-Link (J4) stays for debugging.
# Do not use -t bootloader: on this platform it runs nrfjprog --chiperase, which also wipes the filesystem.
upload_protocol = nrfutil
debug_tool = jlink
# The TinyUSB include path for the core (as nRF52's builder does), and firmware-*.uf2 from
# userfirmware.hex for the bootloader's UF2 drive
extra_scripts =
  ${env.extra_scripts}
  pre:extra_scripts/nrf54_tinyusb.py
  extra_scripts/nrf54lm20_uf2.py

build_flags = ${nrf54_base.build_flags}
  -Ivariants/nrf54l15/nrf54lm20dk
  -DNRF54LM20_DK
  -DMESHTASTIC_EXCLUDE_GPS=1
  -DHAS_GPS=0
  -DHAS_SCREEN=0
  -DMESHTASTIC_EXCLUDE_SCREEN=1
  # The E22-900M30S PA adds ~10 dB after the SX1262: selects the module's gain (TX_GAIN_LORA) and
  # SX126X_MAX_POWER in configuration.h.
  -D EBYTE_E22_900M30S

build_src_filter = ${nrf54_base.build_src_filter}
  +<../variants/nrf54l15/nrf54lm20dk>

lib_deps = ${nrf54_base.lib_deps}
  # The core's TinyUSB library (USB CDC as Serial): the dependency finder does not pick it up from Arduino.h
  Adafruit TinyUSB Library
