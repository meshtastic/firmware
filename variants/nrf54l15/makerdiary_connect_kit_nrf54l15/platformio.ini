[env:makerdiary_connect_kit_nrf54l15]
custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = makerdiary_connect_kit_nrf54l15
custom_meshtastic_architecture = nrf54l15
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = MakerDiary Connect Kit nRF54L15

extends = nrf54_base, inkhud
board = makerdiary_connect_kit_nrf54l15
board_level = extra
upload_protocol = jlink
debug_tool = jlink

build_flags = ${nrf54_base.build_flags} ${inkhud.build_flags}
  -Ivariants/nrf54l15/makerdiary_connect_kit_nrf54l15
  -DNRF54L15_DK
  -DMESHTASTIC_EXCLUDE_GPS=1
  -DHAS_SCREEN=1
  -DUSE_INKHUD=1
  ; -DUSE_SEGGER ; for debug: pyocd rtt -t nrf54l -a 0x20000000 -s 0x40000

build_src_filter = 
  ${nrf54_base.build_src_filter} 
  ${inkhud.build_src_filter}
  +<../variants/nrf54l15/makerdiary_connect_kit_nrf54l15>

lib_deps = 
  ${inkhud.lib_deps}
  ${nrf54_base.lib_deps}

extra_scripts =
  ${env.extra_scripts}
  variants/nrf54l15/makerdiary_connect_kit_nrf54l15/custom_build_tasks.py
