[env:lm20meshnode]
# LM20MeshNode: open hardware pocket node, https://github.com/cvaldess/LM20MeshNode
# PRIVATE_HW (255) - DIY board without an SKU, so no dedicated HardwareModel enum value.
custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = LM20_MESHNODE
custom_meshtastic_architecture = nrf54lm20
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = LM20MeshNode

extends = nrf54_base
# nRF54LM20A support (s145 10.0.1 for the LM20, its startup and linker scripts) is only on this platform
# branch so far.
platform = https://github.com/andyshinn/platform-nordicnrf54.git#648a966ee20fb15b4b7b9cd8afdcf2a7a9415def
# The Arduino core and the bootloader of the nRF54LM20-DK (andyshinn/nRF54_Arduino#1 and #2,
# andyshinn/nRF54_Bootloader#2) with this board added on top: the core's lm20meshnode variant, and the
# bootloader's lm20meshnode board and its release/lm20meshnode_bootloader.hex, which the builder needs
# for the DFU .zip and the merged .hex.
platform_packages =
  framework-arduinoadafruitnrf54@https://github.com/cvaldess/nRF54_Arduino.git#39d1fbf9f41471097ceda6b1a56cda2813be464b
  framework-arduinoadafruitnrf54-bootloader@https://github.com/cvaldess/nRF54_Bootloader.git#v0.5.0-lm20meshnode.1
board = lm20meshnode
board_level = extra
# The core's main.cpp starts USB through TinyUSB_Device_Init(), declared weak: from a library archive the
# linker never pulls the object that defines it. Link library objects directly instead.
lib_archive = no
# DFU over the USB-C port: 1200 bps touch on the application's port (239A:CAFE), then adafruit-nrfutil on
# the bootloader's (239A:4AFE). SWD (J201) is for an external debug probe.
# Do not use -t bootloader: on this platform it runs nrfjprog --chiperase, which also wipes the filesystem.
upload_protocol = nrfutil
debug_tool = jlink
# The TinyUSB include path for the core (as nRF52's builder does), and firmware-*.uf2 from
# userfirmware.hex for the bootloader's UF2 drive
extra_scripts =
  ${env.extra_scripts}
  pre:extra_scripts/nrf54_tinyusb.py
  extra_scripts/nrf54lm20_uf2.py

build_flags = ${nrf54_base.build_flags}
  -Ivariants/nrf54l15/lm20meshnode
  -DLM20MESHNODE

build_src_filter = ${nrf54_base.build_src_filter}
  +<../variants/nrf54l15/lm20meshnode>

lib_deps = ${nrf54_base.lib_deps}
  # The core's TinyUSB library (USB CDC as Serial): the dependency finder does not pick it up from Arduino.h
  Adafruit TinyUSB Library
  # On-board sensors: nrf54_base carries no sensor libraries, so without these the drivers compile out.
  # LSM6DS3TR-C (0x6A, motion):
  # renovate: datasource=github-tags depName=Adafruit BusIO packageName=adafruit/Adafruit_BusIO
  https://github.com/adafruit/Adafruit_BusIO/archive/refs/tags/1.17.4.zip
  # renovate: datasource=github-tags depName=Adafruit Unified Sensor packageName=adafruit/Adafruit_Sensor
  https://github.com/adafruit/Adafruit_Sensor/archive/refs/tags/1.1.15.zip
  # renovate: datasource=github-tags depName=Adafruit LSM6DS packageName=adafruit/Adafruit_LSM6DS
  https://github.com/adafruit/Adafruit_LSM6DS/archive/refs/tags/4.7.4.zip
  # SHT41 (0x44, temperature and humidity):
  # renovate: datasource=github-tags depName=arduino-sht packageName=sensirion/arduino-sht
  https://github.com/Sensirion/arduino-sht/archive/refs/tags/v1.2.6.zip
