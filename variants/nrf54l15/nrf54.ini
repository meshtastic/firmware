[nrf54_base]
; Out-of-tree platform (meshtastic/platform-nordicnrf54) with the s145 SoftDevice Arduino core;
; the platform pulls the Arduino core and the DFU bootloader from their own repositories.
platform = https://github.com/meshtastic/platform-nordicnrf54.git#v0.3.1
extends = arduino_base

build_type = release
build_flags =
  -include variants/nrf54l15/cpp_overrides/lfs_assert.h
  ${arduino_base.build_flags}
  -Wno-unused-variable
  -Isrc/platform/nrf54
  ; Shared nRF52 headers (NRF52Bluetooth.h, Nrf52SaadcLock.h); architecture.h resolves from nrf54 first
  -Isrc/platform/nrf52
  -DPRIVATE_HW
  -DLOOP_STACK_SZ=2048
  -DCFG_BLE_TASK_STACKSIZE=2048
  -DNRF_USE_SERIAL_DFU
  -DMESHTASTIC_EXCLUDE_AUDIO=1
  -DMESHTASTIC_EXCLUDE_PAXCOUNTER=1
  -DMESHTASTIC_EXCLUDE_PKT_HISTORY_HASH=1
  -DOLEDDISPLAY_REDUCE_MEMORY
  -Os
  -std=gnu++17
build_unflags =
  -Ofast
  -Og
  -ggdb3
  -ggdb2
  -g3
  -g2
  -g
  -g1
  -g0
  -std=c++11
  -std=gnu++11

build_src_filter =
  ${arduino_base.build_src_filter} +<platform/nrf54/> +<platform/nrf52/NRF52Bluetooth.cpp> +<platform/nrf52/Nrf52SaadcLock.cpp> +<platform/nrf52/alloc.cpp> +<platform/nrf52/hardfault.cpp> -<nimble/> -<mesh/wifi/> -<mesh/api/> -<mesh/http/> -<modules/esp32> -<mesh/eth/> -<mesh/raspihttp> -<serialization/>

lib_deps =
  ${arduino_base.lib_deps}
  ${radiolib_base.lib_deps}
  # renovate: datasource=git-refs depName=meshtastic/Crypto packageName=https://github.com/meshtastic/Crypto gitBranch=main
  https://github.com/meshtastic/Crypto/archive/591ff9a690e8168ccb7a36abde8d7783e448d395.zip

lib_ignore =
  BluetoothOTA
  lvgl
