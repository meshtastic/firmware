[env:nrf54l15dk]
# PRIVATE_HW (255) - the protobuf HardwareModel enum reserves DK / DIY boards
# without an SKU under PRIVATE_HW; no dedicated enum value will be assigned.
custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = NRF54L15_DK
custom_meshtastic_architecture = nrf54l15
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = Nordic nRF54L15-DK

extends = nrf54_base
board = nrf54l15dk
board_level = extra
upload_protocol = jlink
debug_tool = jlink

build_flags = ${nrf54_base.build_flags}
  -Ivariants/nrf54l15/nrf54l15dk
  -DNRF54L15_DK
  -DMESHTASTIC_EXCLUDE_GPS=1
  -DHAS_GPS=0
  -DHAS_SCREEN=0
  -DMESHTASTIC_EXCLUDE_SCREEN=1
  # The E22-900M30S has a PA after the SX1262, modeled as 7 dB in configuration.h: without this the radio is
  # driven to 22 dBm and the module transmits past the region limit. Selects the module's gain (TX_GAIN_LORA)
  # and SX126X_MAX_POWER in configuration.h.
  -D EBYTE_E22_900M30S

build_src_filter = ${nrf54_base.build_src_filter}
  +<../variants/nrf54l15/nrf54l15dk>

# nrf54_base carries no sensor libraries, so without these the INA3221 and SHTxx drivers compile to
# NullSensor and the power/environment telemetry modules disable themselves at boot. For optional I2C
# sensors wired to the DK (e.g. INA3221 at 0x42, SHT40 at 0x44); a stock DK has neither.
lib_deps = ${nrf54_base.lib_deps}
  # renovate: datasource=github-tags depName=INA3221_RT packageName=RobTillaart/INA3221_RT
  https://github.com/RobTillaart/INA3221_RT/archive/refs/tags/0.4.2.zip
  # renovate: datasource=github-tags depName=arduino-sht packageName=sensirion/arduino-sht
  https://github.com/Sensirion/arduino-sht/archive/refs/tags/v1.2.6.zip
