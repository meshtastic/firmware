[env:xiao_nrf54l15]
# PRIVATE_HW (255) until the protobuf HardwareModel enum gets an entry for this board.
custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = XIAO_NRF54L15
custom_meshtastic_architecture = nrf54l15
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = Seeed XIAO nRF54L15

extends = nrf54l15_base
board = xiao_nrf54l15
board_level = extra

build_flags = ${nrf54l15_base.build_flags}
  -Ivariants/nrf54l15/xiao_nrf54l15
  -DXIAO_NRF54L15
  -DMESHTASTIC_EXCLUDE_GPS=1
  -DHAS_GPS=0
  -DHAS_SCREEN=0
  -DMESHTASTIC_EXCLUDE_SCREEN=1

build_src_filter = ${nrf54l15_base.build_src_filter}
  +<../variants/nrf54l15/xiao_nrf54l15>
