[env:heltec-ht62-esp32c3-sx1262]
custom_meshtastic_hw_model = 53
custom_meshtastic_hw_model_slug = HELTEC_HT62
custom_meshtastic_architecture = esp32-c3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Heltec HT62
custom_meshtastic_images = heltec-ht62-esp32c3-sx1262.svg
custom_meshtastic_tags = Heltec

extends = esp32c3_base
board = esp32-c3-devkitm-1
board_level = pr
build_flags = 
  ${esp32c3_base.build_flags}
  -D HELTEC_HT62
  -I variants/esp32c3/heltec_esp32c3
monitor_speed = 115200
upload_protocol = esptool
;upload_port = /dev/ttyUSB0
upload_speed = 921600

; BLE-mesh build, opt-in - see the heltec-v3_blemesh comment. Links on the C3 with the mesh
; section (RAM 34.2%, flash 87.2%); no C3 has been on the bench, so it is build-verified only.
[env:heltec-ht62-esp32c3-sx1262_blemesh]
extends = env:heltec-ht62-esp32c3-sx1262
build_flags =
  ${env:heltec-ht62-esp32c3-sx1262.build_flags}
  ${ble_mesh_esp32.build_flags}
custom_sdkconfig =
  ${esp32c3_base.custom_sdkconfig}
  ${ble_mesh_esp32.custom_sdkconfig}
