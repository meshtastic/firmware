<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="720" viewBox="0 0 1040 720" role="img" aria-labelledby="title desc">
<title id="title">ESP32-C3 Super Mini to SX1278 Ra-02 wiring</title>
<desc id="desc">Nine exact connections: 3V3 to VCC, GND to GND, GPIO10 to NSS, GPIO6 to SCK, GPIO7 to MOSI, GPIO5 to MISO, GPIO3 to RESET, GPIO4 to DIO0, and GPIO0 to DIO1.</desc>
