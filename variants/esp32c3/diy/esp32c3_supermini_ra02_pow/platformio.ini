
; Community DIY: ESP32-C3 Super Mini + Ai-Thinker Ra-02 (SX1278, 433 MHz)
; Contributor: PowerCodeX369
; Uses the upstream Meshtastic RF95/SX127x implementation.

[env:esp32c3_supermini_ra02_pow]
extends = esp32c3_base
board = esp32-c3-devkitm-1
board_level = extra

custom_meshtastic_architecture = esp32
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = ESP32-C3 Super Mini Ra-02 DIY
custom_meshtastic_tags = DIY

build_flags =
    ${esp32c3_base.build_flags}
    -D PRIVATE_HW
    -I variants/esp32c3/diy/esp32c3_supermini_ra02_pow
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
