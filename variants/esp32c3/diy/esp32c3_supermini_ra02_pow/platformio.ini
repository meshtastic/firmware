; Community DIY wiring: ESP32-C3 Super Mini + Ai-Thinker Ra-02 (SX1278, 433 MHz)
; Maintainer/contributor: PowerCodeX369
; Based on upstream esp32c3_super_mini platformio.ini; kept as PRIVATE_HW.
;
; Not a new Meshtastic protocol. This invokes the official firmware RF95/SX127x path.
[env:esp32c3_supermini_ra02_pow]
extends = esp32c3_base
board = esp32-c3-devkitm-1
board_level = extra
build_flags =
    ${esp32c3_base.build_flags}
    -D PRIVATE_HW
    -I variants/esp32c3/diy/esp32c3_supermini_ra02_pow
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
