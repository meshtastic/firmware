; RadioMaster XR1/XR3 (and Zerodrag) C3+LR1121 RX (ExpressLRS).
; RF-switch table decoded from the ExpressLRS layout; not yet tested on hardware.
[env:elrs-lr1121-rx-radiomaster-xr1]
extends = elrs_lr1121_rx_base
build_flags =
  ${elrs_lr1121_rx_base.build_flags}
  -D RADIOMASTER_XR1_LR1121_RX
  ; Board dir must precede the shared -I so this board's variant.h/rfswitch.h shims win
  -I variants/esp32c3/diy/elrs_lr1121_rx_radiomaster_xr1
  ; Sub-GHz high-power PA, +22 dBm (see elrs_lr1121_rx_hglrc/platformio.ini for why 22)
  -D LR1110_MAX_POWER=22
