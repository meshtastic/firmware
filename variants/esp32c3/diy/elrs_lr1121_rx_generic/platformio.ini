; ExpressLRS "Generic C3 LR1121" RX: every single-radio C3+LR1121 RX that uses the ELRS
; compiled-in default RF switch (BAYCKRC, DAKEFPV, GEPRC, Spedix, THOBBY, RadioMaster XR2, ...).
; Pinout and RF-switch table decoded from the ExpressLRS layout; not yet tested on hardware.
[env:elrs-lr1121-rx-generic]
extends = elrs_lr1121_rx_base
build_flags =
  ${elrs_lr1121_rx_base.build_flags}
  -D ELRS_GENERIC_C3_LR1121_RX
  ; Board dir must precede the shared -I so this board's variant.h/rfswitch.h shims win
  -I variants/esp32c3/diy/elrs_lr1121_rx_generic
  ; Sub-GHz high-power PA, +22 dBm (see elrs_lr1121_rx_hglrc/platformio.ini for why 22)
  -D LR1110_MAX_POWER=22
