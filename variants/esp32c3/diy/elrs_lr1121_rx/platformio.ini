; ExpressLRS ESP32-C3 + LR1121 single-radio RX modules as headless, BLE-only Meshtastic nodes.
; All share the ExpressLRS "Generic C3 LR1121" pinout and differ only in the RF-switch wiring
; (rfswitch.h). The phone app over BLE is the whole UI, so WiFi and its services are left out.
[elrs_lr1121_rx_base]
extends = esp32c3_base
board = esp32-c3-devkitm-1
board_level = extra
build_flags =
  ${esp32c3_base.build_flags}
  -D PRIVATE_HW
  -I variants/esp32c3/diy/elrs_lr1121_rx
  ; ExpressLRS 3.6+ leaves the LR1121 on a non-public firmware (device 0xF3) RadioLib can't drive;
  ; flash Semtech's LR1121 transceiver image 1.4 (~64 kB) on first boot.
  -D LR11X0_UPDATE_FIRMWARE_TO=0x0104
  -D RADIOLIB_EXCLUDE_SX127X=1
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_LR2021=1
  -D MESHTASTIC_EXCLUDE_SCREEN=1
  -D MESHTASTIC_EXCLUDE_I2C=1
  -D MESHTASTIC_EXCLUDE_GPS=1
  -D MESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR=1
  -D MESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR_EXTERNAL=1
  -D MESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR=1
  -D MESHTASTIC_EXCLUDE_HEALTH_TELEMETRY=1
  -D MESHTASTIC_EXCLUDE_POWER_TELEMETRY=1
  -D MESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
  -D MESHTASTIC_EXCLUDE_AUDIO=1
  -D MESHTASTIC_EXCLUDE_WIFI=1
  -D MESHTASTIC_EXCLUDE_MQTT=1
  -D MESHTASTIC_EXCLUDE_PAXCOUNTER=1
  -D MESHTASTIC_EXCLUDE_ATAK=1
  -D MESHTASTIC_EXCLUDE_STOREFORWARD=1
  -D MESHTASTIC_EXCLUDE_REMOTEHARDWARE=1

; HGLRC C3 900/2400 Dual Band Nano/PRO RX (tested on hardware)
[env:elrs-lr1121-rx-hglrc]
extends = elrs_lr1121_rx_base
build_flags =
  ${elrs_lr1121_rx_base.build_flags}
  -D ELRS_RFSW_HGLRC

; RadioMaster XR1/XR3, Zerodrag Nexus Duo (untested)
[env:elrs-lr1121-rx-radiomaster-xr1]
extends = elrs_lr1121_rx_base
build_flags =
  ${elrs_lr1121_rx_base.build_flags}
  -D ELRS_RFSW_RADIOMASTER

; Boards on the ExpressLRS default RF switch: BAYCKRC, DAKEFPV, GEPRC, Spedix, THOBBY,
; RadioMaster XR2, ... (untested)
[env:elrs-lr1121-rx-generic]
extends = elrs_lr1121_rx_base
