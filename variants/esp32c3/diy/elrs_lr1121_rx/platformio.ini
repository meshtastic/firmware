; Shared base for ExpressLRS ESP32-C3 + LR1121 single-radio RX modules (dual-band sub-GHz + 2.4 GHz)
; repurposed as Meshtastic nodes. Each board's platformio.ini does
;   extends = elrs_lr1121_rx_base
; and sets only what is board-specific: its own -I dir (variant.h / rfswitch.h shims that pick an
; rfswitch_*.h table from this dir) and the PA power cap.
;
; These modules are headless (no screen, GPS, sensors or I2C bus broken out): an LR1121, an
; ESP32-C3, one NeoPixel and a button. They are BLE-only by design: the phone app over BLE is the
; whole UI, so WiFi and everything built on it (web server, TCP API, MQTT) is excluded too. That
; also keeps power draw down (Meshtastic runs WiFi with power save off) and the image small.

[elrs_lr1121_rx_base]
extends = esp32c3_base
board = esp32-c3-devkitm-1
board_level = extra
build_flags =
  ${esp32c3_base.build_flags}
  -D PRIVATE_HW
  ; ExpressLRS 3.6+ flashes the LR1121 with a non-public firmware image (device 0xF3) that RadioLib
  ; doesn't recognise, so begin() fails. Bake in Semtech's official LR1121 transceiver image (~64 kB)
  ; and let LR11x0Interface flash it on first boot; a no-op once the radio runs 1.4.
  -D LR11X0_UPDATE_FIRMWARE_TO=0x0104
  ; Shared pinout + RF-switch tables
  -I variants/esp32c3/diy/elrs_lr1121_rx
  ; RadioLib: only LR11x0 is fitted
  -D RADIOLIB_EXCLUDE_SX127X=1
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_LR2021=1
  ; Hardware that isn't there: screen, I2C bus (and so motion sensors), GPS, sensors, audio
  -D MESHTASTIC_EXCLUDE_SCREEN=1
  -D MESHTASTIC_EXCLUDE_I2C=1
  -D MESHTASTIC_EXCLUDE_GPS=1
  -D MESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR=1
  -D MESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR_EXTERNAL=1
  -D MESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR=1
  -D MESHTASTIC_EXCLUDE_HEALTH_TELEMETRY=1
  -D MESHTASTIC_EXCLUDE_POWER_TELEMETRY=1
  -D MESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
  -D MESHTASTIC_EXCLUDE_AUDIO=1
  ; BLE-only by design (see top of file)
  -D MESHTASTIC_EXCLUDE_WIFI=1
  -D MESHTASTIC_EXCLUDE_WEBSERVER=1
  -D MESHTASTIC_EXCLUDE_SOCKETAPI=1
  -D MESHTASTIC_EXCLUDE_MQTT=1
  -D MESHTASTIC_EXCLUDE_PAXCOUNTER=1
  ; Modules that need hardware or infrastructure a bare RX module doesn't have
  -D MESHTASTIC_EXCLUDE_ATAK=1
  -D MESHTASTIC_EXCLUDE_STOREFORWARD=1
  -D MESHTASTIC_EXCLUDE_RANGETEST=1
  -D MESHTASTIC_EXCLUDE_REMOTEHARDWARE=1
monitor_speed = 115200
upload_protocol = esptool
upload_speed = 921600
