; HGLRC C3 900/2400 Dual Band Nano/PRO RX (ExpressLRS), tested on hardware
[env:elrs-lr1121-rx-hglrc]
extends = elrs_lr1121_rx_base
build_flags =
  ${elrs_lr1121_rx_base.build_flags}
  -D HGLRC_ESP32C3_LR1121_RX
  ; Board dir must precede the shared -I so this board's variant.h/rfswitch.h shims win
  -I variants/esp32c3/diy/elrs_lr1121_rx_hglrc
  ; ExpressLRS runs the sub-GHz side on the LR1121's high-power PA at up to +22 dBm. RadioLib only
  ; switches from the low-power PA to the high-power one above 14 dBm, so a lower cap silently
  ; leaves the radio on the LP PA (~8 dB down: "hears everything, nobody hears it"). RadioLib
  ; hard-caps the HP PA at 22; higher makes begin() return -13 INVALID_OUTPUT_POWER.
  ; (LR1110_MAX_POWER is the cap RadioLib/Meshtastic use for the whole LR11x0 family.)
  -D LR1110_MAX_POWER=22
