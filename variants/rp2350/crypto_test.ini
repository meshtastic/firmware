; Crypto test vectors on hardware: pio test -e crypto-rp2350 -f test_crypto_vectors
; Raspberry Pi Pico 2. Unity output goes to Serial (USB CDC), which re-enumerates after every upload.
[env:crypto-rp2350]
extends = rp2350_base
board = rpipico2
board_level = extra
upload_protocol = picotool
build_flags =
  ${rp2350_base.build_flags}
  -D RPI_PICO2
  -I variants/rp2350/rpipico2
  -D CRYPTO_TEST_MINIMAL
build_src_filter =
  -<*>
  +<mesh/CryptoEngine.cpp>
  +<mesh/aes-ccm.cpp>
  +<mesh/HardwareRNG.cpp>
  +<meshUtils.cpp>
  +<concurrency/Lock.cpp>
