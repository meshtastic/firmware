; Crypto test vectors on hardware: pio test -e crypto-esp32c6 -f test_crypto_vectors
; Serial is the USB-Serial-JTAG port; it may re-enumerate after an upload.
[env:crypto-esp32c6]
extends = esp32c6_base
board = esp32-c6-devkitm-1
board_level = extra
build_flags =
  ${esp32c6_base.build_flags}
  -D TLORA_C6
  -I variants/esp32c6/tlora_c6
  -D CRYPTO_TEST_MINIMAL
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
build_src_filter =
  -<*>
  +<crypto/>
  +<mesh/HardwareRNG.cpp>
  +<meshUtils.cpp>
  +<mesh/CryptoEngine.cpp>
  +<concurrency/Lock.cpp>
  +<concurrency/LockGuard.cpp>
lib_ignore =
  ${esp32c6_base.lib_ignore}
  ESP32 Codec2
test_filter =
  test_crypto_vectors

; Backend suite only: no CryptoEngine.
[env:crypto-esp32c6-backend]
extends = env:crypto-esp32c6
build_src_filter =
  -<*>
  +<crypto/>
  +<mesh/HardwareRNG.cpp>
  +<concurrency/Lock.cpp>
  +<concurrency/LockGuard.cpp>
test_filter =
  test_crypto_backend
