; Crypto test vectors on hardware: pio test -e crypto-esp32c6 -f test_crypto_vectors
; Serial is UART0 (the devkit's UART USB port), so the port does not re-enumerate after a reset.
[env:crypto-esp32c6]
extends = esp32c6_base
board = esp32-c6-devkitm-1
board_level = extra
build_flags =
  ${esp32c6_base.build_flags}
  -D TLORA_C6
  -I variants/esp32c6/tlora_c6
  -D CRYPTO_TEST_MINIMAL
build_src_filter =
  -<*>
  +<crypto/>
  +<mesh/CryptoEngine.cpp>
  +<mesh/aes-ccm.cpp>
  +<mesh/HardwareRNG.cpp>
  +<platform/esp32/ESP32CryptoEngine.cpp>
  +<meshUtils.cpp>
  +<concurrency/Lock.cpp>
lib_ignore =
  ${esp32c6_base.lib_ignore}
  ESP32 Codec2

; Backend suite only: no CryptoEngine. Link not build-verified.
[env:crypto-esp32c6-backend]
extends = env:crypto-esp32c6
build_src_filter =
  -<*>
  +<crypto/>
  +<mesh/HardwareRNG.cpp>
  +<concurrency/Lock.cpp>
  +<concurrency/LockGuard.cpp>
test_filter =
  test_crypto_backend
