<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Allow the unprivileged meshtasticd service user to talk to bluetoothd, so
  meshtasticd can register its BLE GATT service, advertisement and pairing agent.
  bluetoothd's own policy (bluetooth.conf) covers the reverse direction: it runs as
  root, which may call back into any client's GATT objects.

  The rule is deliberately destination-wide rather than per-interface: meshtasticd
  legitimately uses GattManager1, LEAdvertisingManager1, AgentManager1, Adapter1,
  Device1, ObjectManager, Properties and Introspectable, and a stale interface
  allowlist fails as a hard-to-diagnose runtime denial after a BlueZ upgrade. The
  scope is still bounded: only the meshtasticd user, and only toward org.bluez.
-->
<busconfig>
  <policy user="meshtasticd">
    <allow send_destination="org.bluez"/>
  </policy>
</busconfig>
