# LR2021_IRQ_DIO_NUM is the older spelling, read only when IRQ_DIO_NUM is absent. Both are set
# here, so the alias line does nothing and DIO9 - not DIO11 - is the interrupt.
Lora:
  Module: lr2021
  spidev: spidev0.0
  CS: 21
  IRQ: 16
  Busy: 20
  Reset: 18
  IRQ_DIO_NUM: 9
  LR2021_IRQ_DIO_NUM: 11
  rfswitch_table:
    pins: [DIO6, DIO7, DIO8]
    MODE_STBY: [LOW, LOW, LOW]
    MODE_RX: [HIGH, LOW, HIGH]
    MODE_TX: [HIGH, HIGH, HIGH]
    MODE_RX_HF: [LOW, LOW, LOW]
    MODE_TX_HF: [LOW, LOW, LOW]
