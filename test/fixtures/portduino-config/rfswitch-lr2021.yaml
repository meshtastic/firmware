# CLEAN. A correct LR20x0 table: MODE_RX_HF is a mode this part has, and IRQ_DIO_NUM keeps
# the interrupt off DIO5, which the table drives as a switch line. Also carries both LR2021
# power ceilings, so dropping either from the checker's schema fails this case.
Lora:
  Module: lr2021
  spidev: spidev0.0
  CS: 21
  IRQ: 16
  Busy: 20
  Reset: 18
  IRQ_DIO_NUM: 9
  LR2021_MAX_POWER: 20
  LR2021_MAX_POWER_HF: 10
  rfswitch_table:
    pins: [DIO5, DIO6, DIO7, DIO8]
    MODE_STBY: [LOW, LOW, LOW, LOW]
    MODE_RX: [HIGH, LOW, LOW, LOW]
    MODE_TX: [HIGH, HIGH, LOW, LOW]
    MODE_RX_HF: [LOW, LOW, HIGH, LOW]
    MODE_TX_HF: [LOW, LOW, LOW, HIGH]
