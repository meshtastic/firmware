# FAULT: DIO5 is listed in pins but driven LOW in every mode. setRfSwitchTable() assigns
# FUNCTION_RF_SWITCH to every non-NC pin in the list whatever the levels, so listing DIO5
# takes it away from FUNCTION_IRQ. Reported exactly like the HIGH case.
Lora:
  Module: lr2021
  CS: 21
  IRQ: 16
  IRQ_DIO_NUM: 5
  rfswitch_table:
    pins: [DIO5, DIO6]
    MODE_STBY: [LOW, LOW]
    MODE_RX: [LOW, HIGH]
    MODE_TX: [LOW, HIGH]
    MODE_RX_HF: [LOW, LOW]
    MODE_TX_HF: [LOW, LOW]
