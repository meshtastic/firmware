# Two command sensors, one with a Scale and one with a Type in a different case. Clean: the only
# finding is the info line saying they need environment measurement enabled.
Lora:
  Module: sx1262
  CS: 21
  IRQ: 16
  Busy: 20
  Reset: 18
Sensors:
  - Type: temperature
    Command: cat /sys/bus/iio/devices/iio:device0/in_temp_input
    Scale: 0.001
  - Type: Relative_Humidity
    Command: /usr/local/bin/read-humidity
