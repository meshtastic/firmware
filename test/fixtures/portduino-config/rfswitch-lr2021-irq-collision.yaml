# FAULT: IRQ_DIO_NUM names DIO5, which the switch table also drives. One pin cannot be
# both the interrupt output and an RF switch control. begin() only exercises SPI and
# BUSY, so the radio reports init success and then never receives a packet.
Lora:
  Module: lr2021
  CS: 21
  IRQ: 16
  Busy: 20
  Reset: 18
  IRQ_DIO_NUM: 5
  rfswitch_table:
    pins: [DIO5, DIO6, DIO7, DIO8]
    MODE_STBY: [LOW, LOW, LOW, LOW]
    MODE_RX: [HIGH, LOW, LOW, LOW]
    MODE_TX: [HIGH, HIGH, LOW, LOW]
    MODE_RX_HF: [LOW, LOW, HIGH, LOW]
    MODE_TX_HF: [LOW, LOW, LOW, HIGH]
