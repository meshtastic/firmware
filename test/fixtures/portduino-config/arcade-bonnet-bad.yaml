# FAULT: four ways a bonnet config silently does nothing. 0x120 is outside the MCP23017's
# 0x20-0x27, so the bonnet is never started; 'fire' is not an action the driver knows; '2A'
# is not a button on the bonnet (they run 1A-1F); and 1B appears under two actions, where
# the later one wins and the earlier binding is lost.
Lora:
  Module: sx1262
  CS: 21
  IRQ: 16
  Busy: 20
  Reset: 18
I2C:
  I2CDevice: /dev/i2c-1
Input:
  ArcadeBonnet: 0x120
  ArcadeBonnetButtons:
    select: [1A, 2A]
    fire: 1C
    cancel: [1B]
    back: 1B
