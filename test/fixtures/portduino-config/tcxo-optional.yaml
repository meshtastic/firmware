# CLEAN. The carrier ships populated either way, so the driver probes: try the TCXO, fall
# back to the XTAL. No DIO3_TCXO_VOLTAGE, so the TCXO attempt uses the radio default of
# 1.6 V rather than being skipped, and the report must name that Vref.
Lora:
  Module: lr2021
  spidev: spidev0.0
  CS: 21
  IRQ: 16
  Busy: 20
  Reset: 18
  IRQ_DIO_NUM: 9
  TCXO_OPTIONAL: true
  rfswitch_table:
    pins: [DIO5, DIO6, DIO7, DIO8]
    MODE_STBY: [LOW, LOW, LOW, LOW]
    MODE_RX: [HIGH, LOW, LOW, LOW]
    MODE_TX: [HIGH, HIGH, LOW, LOW]
    MODE_RX_HF: [LOW, LOW, HIGH, LOW]
    MODE_TX_HF: [LOW, LOW, LOW, HIGH]
