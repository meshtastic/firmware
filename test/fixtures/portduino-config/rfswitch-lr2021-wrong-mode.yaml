# FAULT: MODE_GNSS and MODE_TX_HP are LR11xx modes an LR20x0 does not have, so both rows are
# dropped. Expect a WARNING naming the module rather than the "unknown key" a misspelling
# gets.
Lora:
  Module: lr2021
  CS: 21
  IRQ: 16
  IRQ_DIO_NUM: 11
  rfswitch_table:
    pins: [DIO5, DIO6]
    MODE_STBY: [LOW, LOW]
    MODE_RX: [HIGH, LOW]
    MODE_TX: [HIGH, HIGH]
    MODE_RX_HF: [LOW, HIGH]
    MODE_TX_HF: [HIGH, LOW]
    MODE_TX_HP: [LOW, HIGH]
    MODE_GNSS: [HIGH, HIGH]
